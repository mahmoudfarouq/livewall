<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights Left On</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600&display=swap');
:root{
  color-scheme: dark;
  --night:#06080c;
  --ink:#efe6d8;
  --ink-dim:rgba(239,230,216,.66);
  --ink-faint:rgba(239,230,216,.4);
  --sodium:#ffa24a;
  --glass:rgba(10,12,17,.52);
  --glass-edge:rgba(255,206,160,.16);
  --focus:#ffc67e;
  --shade:rgba(4,5,8,.72);
  --font-story:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --font-ui:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{display:block}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.over-window{cursor:pointer}
.ui{position:fixed;z-index:3;pointer-events:none}
.ui > *{pointer-events:auto}
.brand{left:max(18px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));max-width:min(420px, calc(100vw - 36px));pointer-events:none}
.brand h1{margin:0;font-family:var(--font-story);font-style:italic;font-weight:400;font-size:clamp(22px, 3.2vw, 30px);letter-spacing:.005em;color:var(--ink);text-shadow:0 1px 18px rgba(0,0,0,.6)}
.hint{margin:.35em 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-dim);transition:opacity 1.6s ease;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.hint.gone{opacity:0}
.controls{top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;border-radius:19px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:500 13px/1 var(--font-ui)}
button.pill{cursor:pointer}
button.pill:hover{border-color:rgba(255,206,160,.32)}
button:focus-visible, input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.pill svg{width:16px;height:16px;flex:none}
.speed label{color:var(--ink-dim)}
.speed input{width:96px;accent-color:var(--sodium)}
#room{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:2;opacity:0;pointer-events:none}
#room.live{pointer-events:auto;cursor:zoom-out}
.brand{transition:opacity .8s ease}
.brand.away{opacity:0}
.speed{transition:opacity .6s ease}
.is-inside .speed{opacity:0;pointer-events:none}
.sound .wave{opacity:.3;transition:opacity .3s}
.sound.on .wave{opacity:1}
.inside{inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));opacity:0;visibility:hidden;transition:opacity .7s ease, visibility 0s linear .7s}
.inside.shown{opacity:1;visibility:visible;transition:opacity 1.1s ease .15s}
.inside-top{display:flex;gap:8px;align-self:flex-start;flex-wrap:wrap}
.inside .caption{pointer-events:none;margin:0 auto;max-width:30ch;text-align:center;font-family:var(--font-story);font-weight:400;font-size:clamp(19px, 2.7vw, 31px);line-height:1.32;color:var(--ink);text-shadow:0 2px 22px var(--shade), 0 0 3px var(--shade);padding:.5em 1em;background:radial-gradient(closest-side, var(--shade), transparent);text-wrap:balance}
.caption em{font-style:italic;color:var(--ink)}
.caption span{color:var(--ink-dim)}
.short{display:none}
.toast{position:fixed;left:50%;bottom:max(26px, env(safe-area-inset-bottom));z-index:4;transform:translate(-50%, 8px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:19px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13.5px;color:var(--ink);transition:opacity .35s ease, transform .35s ease;white-space:nowrap}
.toast.shown{opacity:1;transform:translate(-50%, 0)}
@media (prefers-reduced-motion: reduce){ .brand,.inside,.toast,.hint{transition-duration:.01s !important} }
@media (max-width:520px){
  .long{display:none}
  .short{display:inline}
  .speed input{width:70px}
  .speed label{display:none}
  .hint{font-size:12.5px}
}
</style>

<canvas id="scene" tabindex="-1" aria-label="A city at night seen from the air. Lit windows can be opened to look inside."></canvas>

<div class="ui brand">
  <h1>Lights Left On</h1>
  <p class="hint" id="hint"></p>
</div>

<canvas id="room" aria-hidden="true"></canvas>

<div class="ui inside" id="inside">
  <div class="inside-top">
    <button class="pill" id="back" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="long">Back to the city</span><span class="short">Back</span></button>
    <button class="pill" id="another" type="button"><span class="long">Another window</span><span class="short">Another</span></button>

</div>

<div class="toast" id="toast" role="status"></div>

<div class="ui controls">
  <button class="pill sound" id="sound" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="wave" d="M11 5.6c.9.8.9 4 0 4.8M12.9 4c1.9 1.7 1.9 6.3 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>Sound off</span></button>
  <div class="pill speed">

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('hint').textContent = 'The city could not load. Check your connection and refresh.'; return; }

const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = RMQ.matches;
if (RMQ.addEventListener) RMQ.addEventListener('change', e => { reduced = e.matches; });
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------------------------------------------------------------
   Hashing. Mirrors the GLSL hash13 in float32 so JS and the GPU
   agree on which window is lit and what is happening inside.
---------------------------------------------------------------- */
const f32 = Math.fround;
const fr = x => f32(x - Math.floor(x));
const K1 = f32(0.1031), K2 = f32(31.32);
function hash13(x, y, z) {
  let px = fr(f32(f32(x) * K1)), py = fr(f32(f32(y) * K1)), pz = fr(f32(f32(z) * K1));
  const d = f32(f32(f32(px * f32(pz + K2)) + f32(py * f32(py + K2))) + f32(pz * f32(px + K2)));
  px = f32(px + d); py = f32(py + d); pz = f32(pz + d);
  return fr(f32(f32(px + py) * pz));
}
const GLSL_HASH = `
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
`;

function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const R = mulberry(0x2a0217);

/* ---------------------------------------------------------------
   The window stories. Each is drawn in a 100 x 100 room, lit from
   inside, at loop phase t in [0, 1). The same function paints the
   tiny atlas frames seen from the air and the big view inside.
---------------------------------------------------------------- */
const TAU = Math.PI * 2;
const INK = 'rgba(17,12,10,.95)', MID = 'rgba(46,36,32,.9)', SOFT = 'rgba(70,58,52,.55)';
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function room(g, top, bot, floorY) {
  const gr = g.createLinearGradient(0, 0, 0, 100);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, 100, 100);
  if (floorY) { g.fillStyle = 'rgba(60,48,42,.35)'; g.fillRect(0, floorY, 100, 100 - floorY); }
}
function glowAt(g, x, y, r, col) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function seg(g, x1, y1, x2, y2, w, col) { g.strokeStyle = col || INK; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function limb(g, x, y, a1, l1, a2, l2, w) {
  const ex = x + Math.sin(a1) * l1, ey = y + Math.cos(a1) * l1;
  const hx = ex + Math.sin(a1 + a2) * l2, hy = ey + Math.cos(a1 + a2) * l2;
  g.strokeStyle = INK; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke();
  return [hx, hy];
}
// A person. (x, y) are the feet; o holds pose angles (radians, 0 = hanging straight down, + towards +x).
function person(g, x, y, s, o) {
  o = o || {};
  const lean = o.lean || 0, sit = o.sit, hipY = y - (sit ? 15 : 25) * s;
  const hx = x, hy = hipY;
  const nx = hx + Math.sin(lean) * 19 * s, ny = hy - Math.cos(lean) * 19 * s;
  let hands = {};
  if (!o.noLegs) {
    if (sit) {
      const dir = o.face || 1;
      limb(g, hx, hy, dir * Math.PI / 2, 12 * s, -dir * Math.PI / 2, 14 * s, 6 * s);
    } else {
      limb(g, hx, hy, o.l1 || 0.08, 13 * s, o.k1 || 0, 13 * s, 6 * s);
      limb(g, hx, hy, o.l2 || -0.08, 13 * s, o.k2 || 0, 13 * s, 6 * s);
    }
  }
  seg(g, hx, hy, nx, ny, 10.5 * s);
  const shx = nx + Math.sin(lean) * -1.5 * s, shy = ny + 2.2 * s;
  hands.l = limb(g, shx, shy, o.a1 == null ? 0.15 : o.a1, 10.5 * s, o.e1 || 0, 10 * s, 4.4 * s);
  hands.r = limb(g, shx, shy, o.a2 == null ? -0.15 : o.a2, 10.5 * s, o.e2 || 0, 10 * s, 4.4 * s);
  const hdx = nx + Math.sin(lean + (o.tilt || 0)) * 7.5 * s, hdy = ny - Math.cos(lean + (o.tilt || 0)) * 7.5 * s;
  g.fillStyle = INK; g.beginPath(); g.arc(hdx, hdy, 6.2 * s, 0, TAU); g.fill();
  if (o.hair) { g.beginPath(); g.ellipse(hdx - (o.face || 1) * 4 * s, hdy + 2 * s, 3.2 * s, 6 * s, 0, 0, TAU); g.fill(); }
  hands.head = [hdx, hdy];
  return hands;
}
function plant(g, x, y, s, t, seed) {
  g.fillStyle = MID; g.beginPath(); g.moveTo(x - 6 * s, y - 10 * s); g.lineTo(x + 6 * s, y - 10 * s); g.lineTo(x + 4.5 * s, y); g.lineTo(x - 4.5 * s, y); g.fill();
  g.fillStyle = INK;
  for (let i = 0; i < 6; i++) {
    const a = -1.2 + i * 0.48 + Math.sin(t * TAU + i + seed) * 0.05;
    g.save(); g.translate(x, y - 10 * s); g.rotate(a); g.beginPath(); g.ellipse(0, -9 * s, 2.6 * s, 9 * s, 0, 0, TAU); g.fill(); g.restore();
  }
}
function note(g, x, y, a) { g.globalAlpha = a; g.fillStyle = INK; g.beginPath(); g.ellipse(x, y, 2.2, 1.6, -0.4, 0, TAU); g.fill(); seg(g, x + 2, y, x + 2, y - 8, 1); g.globalAlpha = 1; }
function office(g) {
  room(g, '#e9f1ea', '#c4ccc6', 86);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(8, 3, 34, 3); g.fillRect(58, 3, 34, 3);
  g.fillStyle = 'rgba(80,90,86,.35)'; g.fillRect(0, 58, 100, 3);
}
function desk(g, x0, x1, y) { g.fillStyle = MID; g.fillRect(x0, y, x1 - x0, 3.5); g.fillRect(x0 + 2, y, 2.5, 100 - y); g.fillRect(x1 - 4.5, y, 2.5, 100 - y); }
function monitor(g, x, y, w, h, col) { g.fillStyle = INK; g.fillRect(x - 1.5, y - 1.5, w + 3, h + 3); g.fillStyle = col; g.fillRect(x, y, w, h); g.fillStyle = INK; g.fillRect(x + w / 2 - 1.5, y + h, 3, 6); g.fillRect(x + w / 2 - 6, y + h + 5, 12, 2); }

const STORIES = [
  { name: 'cooking', lines: ['Someone is making pancakes at two in the morning, and it is going well.', 'Dinner for one, eaten standing up, at an hour that does not count.', 'Garlic, onions, and a recipe read aloud to nobody.'],
    draw(g, t) {
      room(g, '#f6eee2', '#d9cbb8');
      g.fillStyle = MID; g.fillRect(4, 6, 40, 16); g.fillRect(70, 6, 26, 16);
      g.beginPath(); g.moveTo(48, 6); g.lineTo(66, 6); g.lineTo(70, 22); g.lineTo(44, 22); g.fill();
      glowAt(g, 57, 26, 14, 'rgba(255,240,200,.8)');
      const flip = sm(0.15, 0.25, t) * (1 - sm(0.45, 0.55, t));
      const h = person(g, 34, 106, 1.05, { a1: 1.0 + flip * 0.3, e1: 0.7, a2: 0.7, e2: 0.9 + Math.sin(t * TAU * 4) * 0.3, lean: 0.06 });
      const [px, py] = h.l;
      g.fillStyle = INK; g.beginPath(); g.ellipse(px + 9, py - 1, 8, 2, -flip * 0.2, 0, TAU); g.fill(); seg(g, px, py, px + 3, py - 1, 2);
      const fy = t > 0.2 && t < 0.55 ? Math.sin(Math.PI * (t - 0.2) / 0.35) * 16 : 0;
      g.fillStyle = INK; g.beginPath(); g.ellipse(px + 9, py - 3 - fy, 5, 1.6, fy * 0.15, 0, TAU); g.fill();
      g.fillStyle = 'rgba(30,22,18,.98)'; g.fillRect(0, 74, 100, 26);
      for (let i = 0; i < 3; i++) {
        const ph = (t * 2 + i / 3) % 1;
        g.strokeStyle = `rgba(255,255,255,${(1 - ph) * 0.55})`; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(px + 6 + i * 3, py - 4); g.quadraticCurveTo(px + 2 + i * 3 + Math.sin(ph * 6 + i) * 5, py - 14 - ph * 10, px + 8 + i * 3, py - 22 - ph * 16); g.stroke();
      }
    } },
  { name: 'cat', lines: ['A cat on the sill, keeping the night shift.', 'The cat is watching the street. It has opinions about the street.', 'Somebody is asleep. The cat is not.'],
    draw(g, t) {
      room(g, '#f3e7d6', '#d6c4ad');
      glowAt(g, 20, 30, 26, 'rgba(255,236,190,.9)');
      g.fillStyle = MID; g.beginPath(); g.moveTo(14, 34); g.lineTo(26, 34); g.lineTo(23, 26); g.lineTo(17, 26); g.fill(); seg(g, 20, 34, 20, 88, 1.6, MID);
      g.fillStyle = 'rgba(60,40,34,.5)'; g.fillRect(0, 0, 9, 88); g.fillRect(91, 0, 9, 88);
      plant(g, 82, 88, 0.8, t, 2);
      const look = Math.sin(t * TAU) > 0.6 ? 2.5 : 0;
      g.fillStyle = INK;
      g.beginPath(); g.ellipse(55, 76, 10, 12, 0, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(55, 85, 12, 4, 0, 0, TAU); g.fill();
      const hx = 55 + look, hy = 60;
      g.beginPath(); g.arc(hx, hy, 7, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(hx - 6.5, hy - 2); g.lineTo(hx - 5, hy - 11); g.lineTo(hx - 1, hy - 5); g.fill();
      g.beginPath(); g.moveTo(hx + 6.5, hy - 2); g.lineTo(hx + 5, hy - 11); g.lineTo(hx + 1, hy - 5); g.fill();
      const sw = Math.sin(t * TAU * 2) * 0.6;
      g.strokeStyle = INK; g.lineWidth = 3.4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(64, 84); g.bezierCurveTo(76, 86, 78 + sw * 4, 76, 74 + sw * 8, 66 + Math.abs(sw) * 3); g.stroke();
      g.fillStyle = 'rgba(30,22,18,.98)'; g.fillRect(0, 88, 100, 12);
    } },
  { name: 'dancing', lines: ['Two people dancing in the kitchen to a song only they can hear.', 'They put the record on again. Nobody minds.', 'A slow dance, socks on, chairs pushed back.'],
    draw(g, t) {
      room(g, '#f5e6d4', '#d4bea6', 90);
      const sw = Math.sin(t * TAU) * 0.6;
      g.save(); g.translate(50, 0); g.rotate(sw * 0.05); seg(g, 0, 0, 0, 20, 1.2, MID); g.restore();
      glowAt(g, 50 + sw * 1, 24, 22, 'rgba(255,230,180,.85)');
      g.fillStyle = MID; g.beginPath(); g.arc(50 + sw, 22, 5, Math.PI, 0); g.fill();
      const th = t * TAU, d = Math.cos(th) * 9.5, s1 = 1 + Math.sin(th) * 0.05, s2 = 1 - Math.sin(th) * 0.05;
      const sway = Math.sin(th * 2) * 0.07;
      const A = () => person(g, 50 - d, 98, s1, { lean: sway + 0.08, a1: -2.3, e1: 0.3, a2: -1.2, e2: -0.6, l1: 0.1 + sway, l2: -0.12 });
      const Bp = () => person(g, 50 + d, 98, s2 * 0.94, { lean: sway - 0.08, a1: 1.3, e1: 0.6, a2: 2.2, e2: -0.3, hair: true, face: -1, l1: 0.1, l2: -0.1 + sway });
      if (Math.sin(th) > 0) { Bp(); A(); } else { A(); Bp(); }
    } },
  { name: 'violin', lines: ['Someone is learning the violin, badly.', 'The same eight bars, for the ninth time tonight.', 'A violin, a metronome, and a great deal of patience from the neighbours.'],
    draw(g, t) {
      room(g, '#f2e9dc', '#d3c6b4', 90);
      seg(g, 24, 90, 24, 52, 1.6, MID); seg(g, 18, 90, 24, 80, 1.6, MID); seg(g, 30, 90, 24, 80, 1.6, MID);
      g.fillStyle = MID; g.save(); g.translate(24, 50); g.rotate(-0.25); g.fillRect(-9, -7, 18, 12); g.restore();
      const bow = Math.sin(t * TAU * 2);
      const h = person(g, 62, 98, 1, { a1: -1.3, e1: -0.5, a2: -0.5 + bow * 0.35, e2: -1.4 - bow * 0.2, face: -1, tilt: -0.25, lean: -0.04 });
      const [hx, hy] = h.head;
      g.fillStyle = INK; g.save(); g.translate(hx - 7, hy + 7); g.rotate(-0.35); g.beginPath(); g.ellipse(0, 0, 8, 3.4, 0, 0, TAU); g.fill(); g.fillRect(-18, -0.8, 12, 1.6); g.restore();
      const [bx, by] = h.r; seg(g, bx - 14, by - 4 - bow * 2, bx + 12, by + 5 + bow * 2, 1.2);
      for (let i = 0; i < 3; i++) {
        const ph = (t + i / 3) % 1, sour = i === 1;
        note(g, 48 - ph * 10 + Math.sin(ph * 9) * 3, 46 - ph * 30 + (sour ? ph * ph * 30 : 0), (1 - ph) * 0.9);
      }
    } },
  { name: 'tv', lines: ['The television is still talking. He fell asleep an hour ago.', 'A late film plays to a sleeping audience of one.', 'The news repeats itself to someone who stopped listening at midnight.'],
    draw(g, t) {
      const fl = 0.75 + 0.25 * Math.sin(t * TAU * 7 + Math.sin(t * TAU * 3) * 2);
      room(g, `rgba(${200 * fl | 0},${222 * fl | 0},255,1)`, `rgba(${120 * fl | 0},${140 * fl | 0},${190 * fl | 0},1)`);
      g.fillStyle = MID; g.fillRect(6, 56, 88, 18); g.fillRect(4, 66, 12, 24); g.fillRect(84, 66, 12, 24);
      g.fillStyle = 'rgba(36,28,26,.95)'; g.fillRect(8, 72, 84, 16);
      const br = Math.sin(t * TAU) * 0.8;
      g.fillStyle = INK;
      g.beginPath(); g.arc(20, 62, 6.2, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(46, 68 - br * 0.5, 21, 6.5 + br * 0.4, -0.03, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(74, 70, 13, 4.5, 0.05, 0, TAU); g.fill();
      seg(g, 30, 66, 22, 74, 4.4);
      g.fillStyle = 'rgba(70,60,80,.6)'; g.beginPath(); g.ellipse(58, 66, 26, 6, 0, Math.PI, TAU); g.fill();
      g.fillStyle = `rgba(255,255,255,${0.1 + 0.15 * Math.max(0, Math.sin(t * TAU * 5))})`; g.fillRect(0, 0, 100, 100);
    } },
  { name: 'plants', lines: ['Someone is watering their plants by lamplight.', 'Eleven plants, all with names, all watered on schedule.', 'The monstera is getting the good water tonight.'],
    draw(g, t) {
      room(g, '#f1ecdc', '#cfc7ae', 90);

/* ---------------------------------------------------------------
   Renderer, scene, camera
---------------------------------------------------------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);

renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x06080c, 1);

const FOG = new THREE.Color(0.135, 0.085, 0.066);
const FOG_D = 0.00155;
const shared = {
  uTime: { value: 0 },
  uFog: { value: FOG },
  uFogD: { value: FOG_D },

/* ---------------------------------------------------------------
   City layout
---------------------------------------------------------------- */
const P = 84, N = 16, HALF = N * P / 2;      // block pitch, blocks per side
const S = j => -HALF + j * P;                 // street centre line j
const SP = 3.2, FH = 3.4, GF = 5.0;           // window spacing, floor height, lobby height
const INS = [[.13, .87, .15, .85], [.05, .95, .10, .93], [.10, .90, .14, .86]]; // window insets by style

// Autopilot route through street intersections, [xIndex, zIndex]
const route = [[3,3],[3,8],[6,8],[6,12],[11,12],[11,8],[13,8],[13,4],[9,4],[9,2],[5,2],[5,3]];
const ctrl = [];
{
  const V2 = (a) => new THREE.Vector2(S(a[0]), S(a[1]));
  const n = route.length, corner = 30;
  for (let i = 0; i < n; i++) {
    const A = V2(route[(i - 1 + n) % n]), C = V2(route[i]), B = V2(route[(i + 1) % n]);
    const a = C.clone().sub(A).normalize(), b = B.clone().sub(C).normalize();
    ctrl.push(C.clone().addScaledVector(a, -corner), C.clone().addScaledVector(b, corner));
    const segLen = B.distanceTo(C) - corner * 2, steps = Math.max(1, Math.round(segLen / 70));
    for (let k = 1; k < steps; k++) ctrl.push(C.clone().addScaledVector(b, corner + segLen * k / steps));
  }
}
let acc = 0;
const ctrl3 = ctrl.map((p, i) => {
  if (i > 0) acc += p.distanceTo(ctrl[i - 1]);
  const y = 40 + 16 * Math.sin(acc / 230) + 78 * Math.pow(Math.max(0, Math.sin(acc / 620 + 0.6)), 3);
  return new THREE.Vector3(p.x, y, p.y);
});
const curve = new THREE.CatmullRomCurve3(ctrl3, true, 'centripetal');
curve.arcLengthDivisions = 3000;
const pathLen = curve.getLength();
const pathSamples = curve.getSpacedPoints(1600);

// Buildings
const B = [];   // {x,y,z,w,h,d,seed,style,lit,kind,top}
function addBox(x, y0, z, w, h, d, style, lit, kind) {
  const b = { x, y: y0 + h / 2, z, w, h, d, seed: B.length, style, lit, kind, top: y0 + h };
  B.push(b); return b;
}
const tallTops = [];
function capForPath(x0, x1, z0, z1, h) {
  for (const s of pathSamples) {
    if (s.x > x0 - 6 && s.x < x1 + 6 && s.z > z0 - 6 && s.z < z1 + 6) h = Math.min(h, s.y - 16);
  }
  return h;
}
for (let bx = 0; bx < N; bx++) for (let bz = 0; bz < N; bz++) {
  const X0 = S(bx) + 10, X1 = S(bx + 1) - 10, Z0 = S(bz) + 10, Z1 = S(bz + 1) - 10;
  const lots = [];
  const split = R();
  if (split < 0.18) lots.push([X0, X1, Z0, Z1]);
  else if (split < 0.5) { const m = X0 + (X1 - X0) * (0.4 + R() * 0.2); lots.push([X0, m, Z0, Z1], [m, X1, Z0, Z1]); }
  else if (split < 0.7) { const m = Z0 + (Z1 - Z0) * (0.4 + R() * 0.2); lots.push([X0, X1, Z0, m], [X0, X1, m, Z1]); }
  else { const mx = (X0 + X1) / 2, mz = (Z0 + Z1) / 2; lots.push([X0, mx, Z0, mz], [mx, X1, Z0, mz], [X0, mx, mz, Z1], [mx, X1, mz, Z1]); }
  for (const [lx0, lx1, lz0, lz1] of lots) {
    const m = 1.2 + R() * 2.6;
    const x0 = lx0 + m, x1 = lx1 - m, z0 = lz0 + m, z1 = lz1 - m;
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, w = x1 - x0, d = z1 - z0;
    const r = Math.hypot(cx + 40, cz - 30);
    let hmax = 24 + 205 * Math.exp(-Math.pow(r / 340, 2)) + 26 * R();
    let h = hmax * (0.28 + 0.72 * Math.pow(R(), 1.5));
    if (R() < 0.05) h *= 1.55;
    h = Math.max(9, capForPath(x0, x1, z0, z1, h));
    const sr = R();
    const style = h > 85 ? (sr < 0.68 ? 1 : sr < 0.85 ? 2 : 0) : (sr < 0.68 ? 0 : sr < 0.84 ? 2 : 1);
    const lit = style === 0 ? 0.2 + R() * 0.16 : style === 1 ? 0.08 + R() * 0.12 : 0.16 + R() * 0.14;
    if (h > 72 && R() < 0.55) {
      const h1 = h * (0.5 + R() * 0.22);
      addBox(cx, 0, cz, w, h1, d, style, lit, 0);
      const w2 = w * (0.6 + R() * 0.22), d2 = d * (0.6 + R() * 0.22);
      addBox(cx + (R() - .5) * (w - w2) * .5, h1, cz + (R() - .5) * (d - d2) * .5, w2, h - h1, d2, style, lit * 0.9, 0);
    } else addBox(cx, 0, cz, w, h, d, style, lit, 0);
    const top = B[B.length - 1];
    // roof furniture
    const units = h > 60 ? 1 + (R() * 3 | 0) : (R() < 0.6 ? 1 : 0);
    for (let k = 0; k < units; k++) {
      const uw = 2 + R() * 5, ud = 2 + R() * 5, uh = 1.5 + R() * 3.5;
      addBox(top.x + (R() - .5) * (top.w - uw - 2), top.top, top.z + (R() - .5) * (top.d - ud - 2), uw, uh, ud, 0, 0, 1);
    }
    if (h > 120) {
      const ah = 8 + R() * 22;
      addBox(top.x, top.top, top.z, 0.7, ah, 0.7, 0, 0, 1);
      tallTops.push(new THREE.Vector3(top.x, top.top + ah + 0.4, top.z));
    }
    if (h > 95) {
      const hw = top.w / 2 - 0.3, hd = top.d / 2 - 0.3;
      for (const [sx, sz] of [[1,1],[-1,1],[1,-1],[-1,-1]]) tallTops.push(new THREE.Vector3(top.x + sx * hw, top.top + 0.5, top.z + sz * hd));
    }
  }
}
// Elevated train viaduct along the street at zIndex 6
const TRAIN_Z = S(6) + 3.5, TRAIN_Y = 15;
addBox(0, TRAIN_Y - 1.4, TRAIN_Z, HALF * 2 + 200, 1.2, 6.5, 0, 0, 1);
for (let x = -HALF - 90; x <= HALF + 90; x += 32) addBox(x, 0, TRAIN_Z, 1.6, TRAIN_Y - 1.4, 1.6, 0, 0, 1);

/* ---------------------------------------------------------------
   Building material: procedural facades with per-window state
---------------------------------------------------------------- */
const atlasTex = new THREE.DataTexture(new Uint8Array([200, 200, 200, 255]), 1, 1, THREE.RGBAFormat);

const buildingMat = new THREE.ShaderMaterial({
  uniforms: buildingUniforms,
  vertexShader: `
    attribute vec4 aInfo;

/* ---------------------------------------------------------------

function resize() {
