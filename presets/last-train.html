#ann{position:fixed;pointer-events:none;text-align:center;font-family:"Alegreya Sans",system-ui,sans-serif;font-size:clamp(14px,.6vw + 10px,17px);line-height:1.35;color:var(--ann);opacity:0;transition:opacity 1.4s ease;text-shadow:0 1px 10px rgba(0,0,0,.95)}

#hint.in{opacity:.75}

#ui button{cursor:pointer}
#ui button[aria-pressed="true"]{background:rgba(120,70,28,.6);border-color:rgba(255,200,120,.45)}
#ui label{display:flex;align-items:center;gap:8px}

.idle #ui{opacity:.16}

.wall #ui,.wall #hint{display:none}
.wall #talk p.in{opacity:.5}
.wall #ann.in{opacity:.55}

function drawTreeline() {

function drawLayer(z, cell, L) {

    switch (sg.type) {
      case 'forest': case 'tunnel':

        break;

        break;
      case 'coast':

        break;

function church(x, z, col, R) {

function drawPoles() {
  const z = 19, s = f / z, sp = 52;

function drawNear() {
  // catenary masts, signals
  const pace = PACES[paceI], ve = Math.abs(v) * pace;
  const na = clamp(1 - (ve - 12) / 50, .12, .85);
  if (REG[regAt(camX)].electric) {
    const z = 7, s = f / z, sp = 58;
    const [a0, a1] = xr(z, 80);
    for (let k = Math.floor(a0 / sp); k <= Math.ceil(a1 / sp); k++) {
      const x = k * sp, sg = segAt(x);
      if (sg.type === 'tunnel' || sg.type === 'river') continue;
      if (sg.st && Math.abs(x - sg.st.x) < 140) continue;
      const X = P(x, z), Y = G(z), bw = .32 * s;
      ctx.globalAlpha = na;
      ctx.fillStyle = rgb(mix(nearCol, [40, 42, 48], .3)); ctx.fillRect(X - bw / 2, win.y - 10, bw + ve * .004 * s, Y - win.y + 10);
      ctx.fillRect(X - bw * 2, Y - 6.2 * s, bw * 4, .12 * s);

  }

    const z = 6.5, s = f / z, X = P(sx, z), Y = G(z);
    ctx.fillStyle = rgb(nearCol); ctx.fillRect(X - .08 * s, Y - 4.4 * s, .16 * s, 4.4 * s);
    ctx.beginPath(); rrPath(ctx, X - .22 * s, Y - 5.2 * s, .44 * s, .9 * s, .1 * s); ctx.fill();
    const green = sx > camX + 5;
    glow(green ? GL.green : GL.red, X, Y - 4.95 * s, .9 * s, .9);
  }
  // bridges
  for (const rv of J.rivers) {
    const a = rv.a - 14, b = rv.b + 14;
    if (b < camX - 60 || a > camX + 60) continue;
    const z = 5.2, s = f / z, top = hy - (5.8 - CAMH) * s, bot = G(z) - .4 * s, pan = 5;
    ctx.strokeStyle = rgb(mix(nearCol, [60, 66, 80], .25 + env.moon * .15)); ctx.globalAlpha = na; ctx.lineWidth = Math.max(2, .28 * s);
    ctx.beginPath(); ctx.moveTo(P(a, z), top); ctx.lineTo(P(b, z), top); ctx.moveTo(P(a, z), bot); ctx.lineTo(P(b, z), bot);

    ctx.save(); ctx.translate(X, Y - 2.2 * s); ctx.rotate(.785); ctx.fillRect(-.7 * s, -.07 * s, 1.4 * s, .14 * s); ctx.rotate(-1.57); ctx.fillRect(-.7 * s, -.07 * s, 1.4 * s, .14 * s); ctx.restore();

    glow(GL.red, X - .35 * s, Y - 1.6 * s, .9 * s, ph ? 1 : .08); glow(GL.red, X + .35 * s, Y - 1.6 * s, .9 * s, ph ? .08 : 1);

function drawBoard(st, x, z) {
  const s = f / z, sty = BOARD[st.r];

  ctx.fillStyle = sty.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(st.name, X + bw / 2, yb - bh + (st.sub ? .5 : .47) * s);
  if (st.sub) { ctx.font = `500 ${fs * .4}px ${SIGNFONT}`; ctx.fillText(st.sub, X + bw / 2, yb - bh + .72 * s); }
  // sodium cast and enamel sheen
  const g = ctx.createLinearGradient(X, yb - bh, X + bw * .6, yb);
  g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,120,30,.16)');
  ctx.fillStyle = g; ctx.beginPath(); rrPath(ctx, X, yb - bh, bw, bh, .07 * s); ctx.fill();
  ctx.fillStyle = `rgba(0,0,0,${.35 * env.night})`; ctx.beginPath(); rrPath(ctx, X, yb - bh, bw, bh, .07 * s); ctx.fill();

function drawStationBuilding(st) {
  const z = 17, s = f / z, a = st.x - 42, b = st.x + 42, Y = G(z), h = 9 * s;
  const XA = P(a, z), XB = P(b, z);

  ctx.fillRect(XA, Y - h, XB - XA, h);
  ctx.beginPath(); ctx.moveTo(XA - s, Y - h); ctx.lineTo(XA + 3 * s, Y - h - 2.4 * s); ctx.lineTo(XB - 3 * s, Y - h - 2.4 * s); ctx.lineTo(XB + s, Y - h); ctx.fill();

    ctx.beginPath(); ctx.moveTo(X, Y - 2 * s); ctx.lineTo(X, Y - 5.6 * s); ctx.arc(X + .9 * s, Y - 5.6 * s, .9 * s, Math.PI, 0); ctx.lineTo(X + 1.8 * s, Y - 2 * s); ctx.fill();

  }

  const CX = P(st.x, z), CY = Y - h - .4 * s, cr = .8 * s, t = env.h;
  ctx.fillStyle = `rgba(248,240,220,${.6 + .35 * env.lights})`; ctx.beginPath(); ctx.arc(CX, CY, cr, 0, 7); ctx.fill();

function drawPerson(p) {
  const s = f / p.z, X = P(p.x, p.z), Yb = hy + (CAMH - .9) * f / p.z;

  if (p.flowers) { ctx.fillStyle = `rgba(230,150,160,${.5 + .3 * env.lights})`; ctx.beginPath(); ctx.arc(X + p.dir * sw * .9, sh + ht * .08, ht * .05, 0, 7); ctx.fill(); }

function drawStations() {
  for (const st of J.stations) {
    const half = st.stop ? 130 : 55;
    if (st.x + half < camX - 140 || st.x - half > camX + 140) { if (!(st.stop && Math.abs(st.x - camX) < 320)) continue; }

    const yN = hy + ph * f / zn, yF = hy + ph * f / zf;

    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(P(a, zf), yF); ctx.lineTo(P(b, zf), yF); ctx.lineTo(P(b, zn), yN); ctx.lineTo(P(a, zn), yN); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgb(mix(nearCol, [30, 28, 28], .5)); ctx.fillRect(P(a, zn), yN, P(b, zn) - P(a, zn), .9 * f / zn);
    ctx.fillStyle = 'rgba(205,200,190,.55)'; ctx.fillRect(P(a, zn), yN - 1, P(b, zn) - P(a, zn), Math.max(2, .06 * f / zn));
    const yl = hy + ph * f / 3.9;

    ctx.beginPath(); ctx.moveTo(P(a + 2, 3.9), yl); ctx.lineTo(P(b - 2, 3.9), yl); ctx.stroke();

}

function makeCrowd(st) {
