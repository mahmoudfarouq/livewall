<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floating Ink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #eceeea;
    --ink: #1c1d20;
    --ink-soft: #545c5f;
    --line: rgba(28, 29, 32, 0.13);
    --panel: rgba(239, 241, 237, 0.76);
    --focus: #0d3b66;
    --table: #3a4246;
    --tray-h: 120px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 1.3s ease;
  }
  #water, #life {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    transform-origin: 50% 46%;
    transition: transform 1.3s cubic-bezier(.2,.7,.2,1), box-shadow 1.3s ease, opacity 0.8s ease;
  }
  #water { touch-action: none; cursor: crosshair; }
  #life { pointer-events: none; }
  body.lifted { background: var(--table); }
  body.lifted #water {
    transform: scale(0.84) rotate(-0.7deg);
    box-shadow: 0 2px 3px rgba(0,0,0,0.18), 0 40px 70px -30px rgba(0,0,0,0.6);
    cursor: default;
  }
  body.lifted #life { opacity: 0; transform: scale(0.84) rotate(-0.7deg); }

  .intro {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    max-width: min(36ch, calc(100vw - 32px));
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .intro h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 500;
    font-size: 25px;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  .intro .ja { font-size: 14px; color: var(--ink-soft); margin-left: 10px; opacity: 0.7; }
  .intro p { margin: 0; font-size: 14px; color: var(--ink-soft); }
  #hint { color: var(--ink); opacity: 0.82; }
  #lore {
    margin-top: 8px;
    font-family: "Shippori Mincho", serif;
    font-size: 13.5px;
    transition: opacity 0.7s ease;
  }
  #lore.fade { opacity: 0; }
  body.lifted .intro { opacity: 0; }

  .tray {
    position: fixed;
    left: 12px; right: 12px;
    margin: 0 auto;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: -moz-fit-content;
    width: fit-content;
    max-width: calc(100% - 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 30px -18px rgba(20, 30, 40, 0.45);
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; }
  .sep { width: 1px; height: 26px; background: var(--line); }
  .tools { display: flex; gap: 4px; }
  .tool {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13.5px; color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 5px 9px 5px 7px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .tool svg { width: 20px; height: 20px; flex: none; }
  .tool:hover { border-color: var(--line); }
  .tool[aria-checked="true"] { background: var(--ink); color: var(--paper); }
  .pigments { display: flex; align-items: center; gap: 8px; }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 0; padding: 0;
    cursor: pointer;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.32), rgba(255,255,255,0) 46%), var(--c);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-checked="true"] { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), 0 0 0 3px #f1f2ee, 0 0 0 4.5px var(--ink); }
  .pigment-name { min-width: 7.5em; font-size: 13.5px; }
  .actions button, .actions select {
    font: inherit; font-size: 13.5px; color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .actions select {
    -webkit-appearance: none; appearance: none;
    padding-right: 28px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 11px) 55%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .actions button:hover, .actions select:hover { border-color: rgba(28,29,32,0.32); }
  .actions button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .swatch:focus-visible { outline-offset: 5px; }

  .float-msg {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    margin: 0;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #status { bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--tray-h) + 58px); }
  #step { bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--tray-h) + 12px); max-width: min(46ch, calc(100vw - 32px)); }
  #step.show { opacity: 1; }
  #step b { font-weight: 500; }
  #status.show { opacity: 1; }
  #caption {
    position: fixed;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--tray-h) + 16px);
    left: 16px; right: 16px;
    margin: 0;
    text-align: center;
    font-family: "Shippori Mincho", serif;
    font-size: 15px;
    color: #e6e8e3;
    opacity: 0;
    transition: opacity 1s ease 0.5s;
    pointer-events: none;
  }
  body.lifted #caption { opacity: 0.92; }
  /* the drying line */
  #line {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    max-width: calc(100vw - 440px);
    margin: 0;
    padding: 9px 6px 0;
    list-style: none;
    display: flex;
    flex-direction: row-reverse;
    gap: 12px;
    overflow: hidden;
  }
  #line[hidden] { display: none; }
  #line::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 7px;
    height: 1px;
    background: rgba(28,29,32,0.35);
    border-radius: 1px;
  }
  body.lifted #line::before { background: rgba(230,232,227,0.5); }
  #line li { flex: none; animation: pin 0.9s cubic-bezier(.3,1.4,.5,1) both; }
  #line li:nth-child(2n) .print { transform: rotate(1.6deg); }
  #line li:nth-child(2n+1) .print { transform: rotate(-1.2deg); }
  @keyframes pin { from { opacity: 0; transform: translateY(-18px) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .print {
    position: relative;
    display: block;
    padding: 3px;
    border: 0;
    background: #f4f4f0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.18), 0 8px 14px -8px rgba(0,0,0,0.35);
    cursor: zoom-in;
    transform-origin: 50% 0;
  }
  .print::before {
    content: "";
    position: absolute;
    left: 50%; top: -8px;
    width: 6px; height: 14px;
    margin-left: -3px;
    background: #a98d63;
    border-radius: 2px;
    box-shadow: inset -1px 0 0 rgba(0,0,0,0.18);
  }
  .print canvas { display: block; width: 76px; height: auto; }
  .print:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 12px 18px -8px rgba(0,0,0,0.4); }
  #viewer {
    border: 0;
    padding: 18px 18px 14px;
    background: #f4f4f0;
    color: var(--ink);
    max-width: min(92vw, 1100px);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  #viewer::backdrop { background: rgba(32,38,42,0.62); }
  #viewer canvas { display: block; max-width: 100%; max-height: 74vh; width: auto; height: auto; margin: 0 auto; }
  #viewer .row { justify-content: space-between; margin-top: 12px; gap: 12px; flex-wrap: nowrap; }
  #viewer p { margin: 0; font-family: "Shippori Mincho", serif; font-size: 15px; }
  #viewer button {
    font: inherit; font-size: 13.5px; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  @media (max-width: 760px) {
    #line { max-width: calc(100vw - 32px); left: 16px; right: 16px; flex-direction: row; justify-content: flex-start; }
    .print canvas { width: 54px; }
  }
  @media (prefers-reduced-motion: reduce) { #line li { animation: none; } }
  #nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-soft); }
  #nogl[hidden] { display: none; }
  .short { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    .tool .label { display: none; }
    .tool { padding: 6px; }
    .sep { display: none; }
    .pigment-name { display: none; }
  }
  @media (max-width: 560px) {
    .tray { padding: 8px; gap: 6px; border-radius: 16px; }
    .row { gap: 6px 8px; }
    .actions button, .actions select { padding: 6px 10px; font-size: 13px; }
    .actions select { padding-right: 26px; }
    .intro h1 { font-size: 21px; }
    .intro p { font-size: 13px; }
    #lore { font-size: 12.5px; }
    .long { display: none; }
    .short { display: inline; }
    .tools { gap: 2px; }
    .tool { padding: 5px; }
    .swatch { width: 26px; height: 26px; }
    .pigments { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #water, #life, body, .intro, #caption, #lore { transition-duration: 0.01s; transition-delay: 0s; }
    body.lifted #water, body.lifted #life { transform: scale(0.84); }
  }
</style>

<canvas id="water" role="img" aria-label="A marbling tank of water. Touch it to drop colour."></canvas>
<canvas id="life" aria-hidden="true"></canvas>

<div class="intro" id="intro">
  <h1>Floating Ink<span class="ja" lang="ja">墨流し</span></h1>
  <p id="hint"></p>
  <p id="lore"></p>
</div>

<p id="status" class="float-msg" role="status" aria-live="polite"></p>
<p id="caption" aria-live="polite"></p>
<p id="step" class="float-msg" aria-live="polite"></p>
<ul id="line" aria-label="Drying line of lifted prints" hidden></ul>
<dialog id="viewer" aria-label="Print">
  <canvas id="viewCanvas" role="img"></canvas>
  <div class="row"><p id="viewCaption"></p><button type="button" id="viewClose">Close</button></div>
</dialog>

<div class="tray" id="tray" role="group" aria-label="Marbler's tray">
  <div class="row">
    <div class="tools" role="radiogroup" aria-label="Tool" id="tools"></div>
    <span class="sep" aria-hidden="true"></span>
    <div class="pigments" role="radiogroup" aria-label="Pigment" id="pigments"></div>
    <span class="pigment-name" id="pigmentName" aria-hidden="true"></span>
  </div>
  <div class="row actions" id="actions">
    <select id="pattern" aria-label="Try a pattern">
      <option value="">Try a pattern</option>
      <option value="suminagashi">Suminagashi rings</option>
      <option value="stone">Stone (battal)</option>
      <option value="gelgit">Gel-git</option>
      <option value="nonpareil">Nonpareil</option>
      <option value="tulip">Tulip</option>
    </select>
    <select id="mood" aria-label="Water mood">
      <option value="still">Still water</option>
      <option value="spring">Spring</option>
      <option value="autumn">Autumn</option>
      <option value="winter">Winter</option>
      <option value="night">Night rain</option>
    </select>
    <button type="button" id="lifeBtn" aria-pressed="true" title="Koi, falling leaves and weather">Life<span class="long"> in the water</span></button>
    <button type="button" id="cam" aria-pressed="false"><span class="long">Use camera</span><span class="short">Camera</span></button>
    <button type="button" id="ghost" aria-pressed="false" hidden>Silhouette</button>
    <button type="button" id="sound" aria-pressed="false">Sound</button>
    <button type="button" id="lift">Lift<span class="long"> the print</span></button>
    <button type="button" id="clear">Clear</button>
  </div>
</div>

<div id="nogl" hidden><p>This browser can't run the water here: WebGL isn't available.<br>Try a recent Chrome, Safari or Firefox.</p></div>

<script>
(() => {
  'use strict';

  // ---------- pigments (real ones) ----------
  // Subtractive model: the dye texture stores absorbance; the paper shows through as paper * exp(-absorbance).
  const LIB = {
    sumi: { name: 'Sumi ink', hex: '#1b1a1e', gain: 0.85 },
    indigo: { name: 'Indigo', hex: '#26365c' },
    prussian: { name: 'Prussian blue', hex: '#0c3c68' },
    vermilion: { name: 'Vermilion', hex: '#d2431f', gain: 1.15 },
    gamboge: { name: 'Gamboge', hex: '#e39a12', gain: 1.3 },
    madder: { name: 'Rose madder', hex: '#c4485f', gain: 1.15 },
    sapgreen: { name: 'Sap green', hex: '#4f7a28', gain: 1.1 },
    sienna: { name: 'Burnt sienna', hex: '#8a3b1d' },
    paynes: { name: "Payne's grey", hex: '#3c4752' },
  };
  for (const [id, p] of Object.entries(LIB)) {
    p.id = id;
    p.abs = [1, 3, 5].map(i => {
      const v = parseInt(p.hex.substr(i, 2), 16) / 255;
      return -Math.log(Math.max(Math.pow(v, 2.2), 0.006)) * (p.gain || 1);
    });
  }
  let palette = ['sumi', 'indigo', 'prussian', 'vermilion', 'gamboge'].map(k => LIB[k]);
  let pigment = LIB.prussian;

  const TOOLS = [
    { id: 'drop', name: 'Drop', hint: 'Touch the water to let a drop of colour spread. Hold for a larger drop.',
      icon: '<path d="M12 3.5c3.2 4.2 5.2 7 5.2 9.7a5.2 5.2 0 0 1-10.4 0c0-2.7 2-5.5 5.2-9.7z"/>' },
    { id: 'brush', name: 'Brush', hint: 'Drag to draw colour straight through the water.',
      icon: '<path d="M4 20.5c2.6 0 4.3-1.3 4.3-3.4 0-1.2.9-2.2 2.1-2.2"/><path d="M9.9 14.6 18.4 6a1.7 1.7 0 0 1 2.4 2.4l-8.5 8.6"/>' },
    { id: 'stylus', name: 'Stylus', hint: 'Drag a fine point through the colours to pull thin lines. It adds no ink.',
      icon: '<path d="M7 17 19 5"/><circle cx="5.6" cy="18.4" r="1.4"/>' },
    { id: 'comb', name: 'Comb', hint: 'Drag a row of pins across the whole tank. Go back and forth for gel-git.',
      icon: '<path d="M3.5 6.5h17"/><path d="M5.5 6.5v11M9.2 6.5v11M12.9 6.5v11M16.6 6.5v11M20.3 6.5v11" stroke-dasharray="0"/>' },
    { id: 'breath', name: 'Breath', hint: 'Hold to breathe across the surface; the colours drift away from you.',
      icon: '<path d="M3 8.5c3-2 5.5 2 8.5 0s5.5-2 8.5 0"/><path d="M3 13c3-2 5.5 2 8.5 0s5.5-2 8.5 0"/><path d="M3 17.5c2.2-1.4 4.2 1.4 6.4 0"/>' },
    { id: 'clear', name: 'Clear drop', hint: 'Touch to drop clear water with a little gall. It opens a hole and pushes colour into rings.',
      icon: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6"/>' },
  ];
  let tool = TOOLS[0];

  const LORE = {
    start: "Suminagashi, 'floating ink', is the oldest known marbling, practised in Japan since the 12th century.",
    drop: 'A marbler touches a loaded brush to the surface and the colour opens into a disc.',
    brush: 'Ink drawn straight through the water feathers and curls as it goes.',
    stylus: 'Turkish marblers pull lines with a single bodkin of brass or a stiff horsehair.',
    comb: 'Marbling combs were rows of fine pins set into a wooden bar, the width of the tank.',
    breath: 'In suminagashi the marbler may simply breathe across the water to set the rings drifting.',
    clear: 'Ox gall makes colour spread; a drop of it alone pushes everything else aside.',
    idle: 'Left alone the water keeps drifting; marblers wait for it to settle before laying the paper.',
    lift: 'A sheet laid on the surface takes the pattern in one touch, so every print is the only one.',
    camera: 'Your movement becomes the current; the camera only sees a coarse grid of change.',
  };

  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = reduceMQ.matches;
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', e => { reduced = e.matches; });

  const isSmall = Math.min(window.innerWidth, window.innerHeight) < 600;
  const CFG = {
    SIM_RES: isSmall ? 128 : 160,
    DYE_RES: isSmall ? 720 : 1024,
    PRESSURE_ITER: 24,
    PRESSURE: 0.8,
    VEL_DISSIPATION: 0.35,
    DYE_DISSIPATION: 0.05,
    CURL: 24,
    FORCE: 5200,
    RADIUS: 0.0011,
  };

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const canvas = $('water');
  const lifeCv = $('life');
  const lctx = lifeCv.getContext('2d');
  const statusEl = $('status');
  let statusTimer = 0;
  function say(msg, ms = 6000) {
    statusEl.textContent = msg;
    statusEl.classList.add('show');
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => statusEl.classList.remove('show'), ms);
  }
  const loreEl = $('lore');
  let loreKey = '', loreTimer = 0;
  function setLore(text) {
    if (!text || text === loreKey) return;
    loreKey = text;
    loreEl.classList.add('fade');
    clearTimeout(loreTimer);
    loreTimer = setTimeout(() => { loreEl.textContent = text; loreEl.classList.remove('fade'); placeLine(); }, reduced ? 0 : 450);
  }
  const hintEl = $('hint');

  function radioKeys(wrap, items, i, pick) {
    return e => {
      const k = e.key;
      if (!['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(k)) return;
      e.preventDefault();
      const dir = (k === 'ArrowRight' || k === 'ArrowDown') ? 1 : -1;
      const n = items[(i + dir + items.length) % items.length];
      pick(n.id, true);
      wrap.querySelector(`[data-id="${n.id}"]`).focus();
    };
  }

  const toolWrap = $('tools');
  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tool';
    b.setAttribute('role', 'radio');
    b.dataset.id = t.id;
    b.title = t.hint;
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.icon}</svg><span class="label">${t.name}</span>`;
    b.setAttribute('aria-label', t.name);
    b.addEventListener('click', () => chooseTool(t.id, true));
    b.addEventListener('keydown', radioKeys(toolWrap, TOOLS, i, chooseTool));
    toolWrap.appendChild(b);
  });
  function chooseTool(id, fromUser) {
    tool = TOOLS.find(t => t.id === id);
    toolWrap.querySelectorAll('.tool').forEach(b => {
      const on = b.dataset.id === id;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    hintEl.textContent = tool.hint;
    if (fromUser) { setLore(LORE[id]); markInput(); }
  }

  const pigWrap = $('pigments');
  const pigName = $('pigmentName');
  function buildPalette() {
    pigWrap.textContent = '';
    palette.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-label', p.name);
      b.title = p.name;
      b.style.setProperty('--c', p.hex);
      b.dataset.id = p.id;
      b.addEventListener('click', () => choosePigment(p.id, true));
      b.addEventListener('keydown', radioKeys(pigWrap, palette, i, choosePigment));
      pigWrap.appendChild(b);
    });
    if (!palette.includes(pigment)) pigment = palette[Math.min(2, palette.length - 1)];
    choosePigment(pigment.id, false);
  }
  function choosePigment(id, fromUser) {
    pigment = LIB[id];
    pigWrap.querySelectorAll('.swatch').forEach(b => {
      const on = b.dataset.id === id;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    pigName.textContent = pigment.name;
    if (fromUser && tool.id !== 'drop' && tool.id !== 'brush') chooseTool('drop', true);
    if (fromUser) markInput();
  }

  // ---------- WebGL setup ----------
  const glParams = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' };
  let gl = canvas.getContext('webgl2', glParams);
  const isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', glParams) || canvas.getContext('experimental-webgl', glParams);
  if (!gl) return fail();

      .i('uTarget', velocity.read.attach(0))
      .f('aspectRatio', aspect())
      .f('pa', ax, ay).f('pb', bx, by)
      .f('vel', vx, vy)
      .f('radius', width * width * k * k)
      .f('spacing', spacing * k)

  // ---------- surface sources: drops, clear drops, breath, rain ----------
  // A drop really does spread across the surface; it is modelled as a point source of outward
  // surface flow (added to the advection), so earlier colours get pushed into thinning rings.
  const sources = [];
  const srcArr = new Float32Array(32);
  const SRC = {
    ink: { w: 0.00032, s: 0.075 },
    clear: { w: 0.00032, s: 0.075 },
    air: { w: 0.006, s: 0.06 },
    rain: { w: 0.00005, s: 0.012 },
  };
  function addSource(o) {
    const z = o.size == null ? 1 : o.size;
    const base = SRC[o.kind];
    const src = {
      x: o.x, y: o.y, kind: o.kind, pig: o.pig || null,
      held: !!o.held, hold: o.hold == null ? 0.35 * z : o.hold,
      w: base.w * (o.kind === 'air' ? 1 : z), s: base.s * (o.kind === 'air' ? 1 : Math.sqrt(z)) * (o.strength || 1), amp: 1, heldTime: 0,
    };
    if (src.kind === 'ink') {
      splatDye(src.x, src.y, src.pig.abs, 1.1, src.w * 0.55);
      noteUse(src.pig, 'drop');
      sound.pluck(0.3 + 0.4 * Math.min(1, z), -1);
    } else if (src.kind === 'clear') {
      eraseDye(src.x, src.y, src.w * 0.55, 1);
      noteUse(null, 'clear');
      sound.pluck(0.25, 3);
    }
    if (sources.length >= 8) {
      const i = sources.findIndex(q => !q.held);
      if (i < 0 || src.kind === 'rain') return src;
      sources.splice(i, 1);

    sources.push(src);
    return src;
  }
  function updateSources(dt) {
    for (let i = sources.length - 1; i >= 0; i--) {
      const s = sources[i];
      const live = s.held || s.hold > 0;
      if (s.held) { s.heldTime += dt; if (s.heldTime > 4) s.held = false; }
      else if (s.hold > 0) s.hold -= dt;
      else s.amp *= Math.exp(-dt * 4.5);
      if (live && s.kind === 'ink') splatDye(s.x, s.y, s.pig.abs, 2.4 * dt, s.w * 0.3);
      if (live && s.kind === 'clear') eraseDye(s.x, s.y, s.w * 0.35, 10 * dt);
      if (s.amp < 0.03) sources.splice(i, 1);
    }
    const k = unitK();
    srcArr.fill(0);
    sources.forEach((s, i) => {
      srcArr[i * 4] = s.x; srcArr[i * 4 + 1] = s.y;
      srcArr[i * 4 + 2] = s.s * s.amp * k * k * (reduced ? 0.7 : 1); srcArr[i * 4 + 3] = s.w * k * k;
    });
  }

  // what went into the current sheet (used to name prints)
  let usage = { pigs: new Map(), tools: new Set(), recipe: null };
  function noteUse(pig, what) {
    if (pig) usage.pigs.set(pig.id, (usage.pigs.get(pig.id) || 0) + 1);
    if (what) usage.tools.add(what);
  }

  // ---------- the marbler's still water ----------
  // "settle" makes the water heavy like marbling size, so lines stay where the tools leave them.
  let settle = 0, settleHold = 0;
  function stillWater(sec = 4) { settleHold = Math.max(settleHold, sec); }
  function updateSettle(dt) {

  }

  let lastInput = -1e9;

  function uvOf(e) {

  }

    if (lifted) return;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    const p = uvOf(e);
    const s = { x: p.x, y: p.y, fx: p.x, fy: p.y, down: true, moved: 0, t: performance.now(), src: null, tool: tool.id, dx0: p.x, dy0: p.y };
    pointers.set(e.pointerId, s);
    takeOver();
    if (s.tool === 'drop') s.src = addSource({ kind: 'ink', x: p.x, y: p.y, pig: pigment, held: true });
    else if (s.tool === 'clear') s.src = addSource({ kind: 'clear', x: p.x, y: p.y, held: true });
    else if (s.tool === 'breath') s.src = addSource({ kind: 'air', x: p.x, y: p.y, held: true });

      pointers.set(e.pointerId, s);

    }
    s.moved += Math.hypot((p.x - s.x) * aspect(), p.y - s.y);

    if (!s.down) { s.tool = tool.id; return; }

    if (s.src && s.tool === 'breath') { s.src.x = p.x; s.src.y = p.y; }
    if (s.src && (s.tool === 'drop' || s.tool === 'clear')) {
      // dragging with a drop tool lays a trail of smaller drops
      if (Math.hypot((p.x - s.dx0) * aspect(), p.y - s.dy0) > 0.07) {
        s.src.held = false;
        s.src = addSource({ kind: s.tool === 'drop' ? 'ink' : 'clear', x: p.x, y: p.y, pig: pigment, held: true, size: 0.6 });

    }
  });

  function applyInput(dt) {

      const ax = s.fx, ay = s.fy, bx = s.x, by = s.y;
      s.fx = bx; s.fy = by;
      const dist = Math.hypot((bx - ax) * ar, by - ay);
      if (s.tool === 'brush') {
        if (s.down) splatDye(bx, by, pigment.abs, 0.9 * dt, CFG.RADIUS * 0.7); // a still brush keeps bleeding

    hands.push({ tool: toolId, x0, y0, x1, y1, dur: Math.max(0.05, dur), t: 0, px: x0, py: y0, done });

    for (let i = hands.length - 1; i >= 0; i--) {

      const e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2; // ease in-out, like a steady hand

  // ---------- pattern recipes: an invisible hand performs a traditional pattern ----------

  // positions in short-side units around the centre, so shapes stay round on any screen

      wait,

      },
      async drop(p, pig, size = 1, gap = 0.4) {

  const RECIPES = {
    suminagashi: {

  async function playRecipe(id) {
    const R = RECIPES[id];

    setLore(R.lore);
    say('Touch the water at any time to take over.', 3500);
    try {
      await R.run(hand(rec));
      if (recipe === rec) {
        stepEl.innerHTML = '';
        const b = document.createElement('b');
        b.textContent = `${R.title}. `;

  // ---------- ambient currents ----------
  const emitters = [
    { a: 0.071, b: 0.053, p: 0.0, q: 1.3, ink: 0, pig: null },

  let ambLevel = 1, nextDrop = 0;
  function ambientPigment() {
    const pool = [pigment.id, pigment.id, pigment.id].concat(palette.map(p => p.id));
    return LIB[pool[(Math.random() * pool.length) | 0]];
  }
  function ambient(dt, t) {
    const idle = performance.now() - lastInput > 8000 && !ambientBlocked();
    ambLevel += ((idle ? 1 : 0) - ambLevel) * Math.min(1, dt * 0.6);
    if (idle && lastInput > 0 && performance.now() - lastInput > 9000) setLore(LORE.idle);
    if (ambLevel < 0.02) return;
    const slow = reduced ? 0.6 : 1;
    const k = ambLevel * slow * (1 - 0.8 * settle);
    for (const e of emitters) {
      const tt = t * slow;
      const x = 0.5 + 0.36 * Math.sin(tt * e.a * 6.283 + e.p);
      const y = 0.5 + 0.33 * Math.sin(tt * e.b * 6.283 + e.q);
      const vx = 0.36 * e.a * 6.283 * Math.cos(tt * e.a * 6.283 + e.p);
      const vy = 0.33 * e.b * 6.283 * Math.cos(tt * e.b * 6.283 + e.q);
      splatVel(x, y, vx * 45 * k, vy * 45 * k, 0.005);
      if (e.ink > t && e.pig) splatDye(x, y, e.pig.abs, 0.5 * dt * ambLevel, 0.0007);
    }
    if (t > nextDrop) {
      nextDrop = t + (2.6 + Math.random() * 4) * (reduced ? 1.7 : 1);
      const x = 0.14 + Math.random() * 0.72, y = 0.2 + Math.random() * 0.62;
      const r = Math.random();
      if (r < 0.62) addSource({ kind: 'ink', x, y, pig: ambientPigment(), size: (0.5 + Math.random() * 0.8) * ambLevel });
      else if (r < 0.85) addSource({ kind: 'clear', x, y, size: 0.5 + Math.random() * 0.5 });
      else {
        const e = emitters[(Math.random() * emitters.length) | 0];
        e.ink = t + 1.5 + Math.random() * 2.5;
        e.pig = ambientPigment();
      }
    }
  }

  // ---------- simulation step ----------
  let clearing = 0, simT = 0;
  function step(dt) {

      const [hx, hy] = pts[2], [ex, ey] = pts[pts.length - 1], [px2, py2] = pts[pts.length - 2];
      const ang = Math.atan2(ey - py2, ex - px2);
      lctx.fillStyle = `rgba(${col},${0.06 * k.a})`;
      for (const sgn of [-1, 1]) {
        const fa = Math.atan2(pts[1][1] - pts[3][1], pts[1][0] - pts[3][0]) + sgn * 2.1 + Math.sin(k.phase * 0.5) * 0.2 * sgn;
        lctx.beginPath();
        lctx.ellipse(hx + Math.cos(fa) * L * 0.2, hy + Math.sin(fa) * L * 0.2, L * 0.17, L * 0.07, fa, 0, 6.283);
        lctx.fill();
        const ta = ang + sgn * (0.45 + Math.sin(k.phase) * 0.15);
        lctx.beginPath();
        lctx.ellipse(ex + Math.cos(ta) * L * 0.16, ey + Math.sin(ta) * L * 0.16, L * 0.2, L * 0.075, ta, 0, 6.283);
        lctx.fill();
      }
    }
    for (let i = lifeState.ripples.length - 1; i >= 0; i--) {
      const r = lifeState.ripples[i];
      const f = (simT - r.t) / (r.big ? 1.8 : 1.1);
      if (f >= 1 || f < 0) { lifeState.ripples.splice(i, 1); continue; }
      const [px, py] = toPx(r.x, r.y);
      const R = (r.big ? 70 : 26) * Math.sqrt(f);
      for (const [off, a] of [[0, 0.24], [-0.35, 0.12]]) {
        const rr = R * (1 + off);
        if (rr <= 1) continue;
        lctx.beginPath(); lctx.arc(px, py, rr, 0, 6.283);
        lctx.strokeStyle = night ? `rgba(255,236,200,${a * (1 - f)})` : `rgba(30,38,48,${a * (1 - f)})`;
        lctx.lineWidth = 1; lctx.stroke();
      }
    }
    for (const f of lifeState.floaters) {
      const [px, py] = toPx(f.x, f.y);
      let alpha = 1;
      if (f.kind === 'snow' && f.landed) alpha = Math.max(0, 1 - (simT - f.landed) / 2.5);
      else if (f.age > f.fall + f.life - 3) alpha = Math.max(0, (f.fall + f.life - f.age) / 3);
      if (alpha <= 0) continue;
      const z = f.z;
      const sway = z > 0 ? Math.sin(f.age * 1.7 + f.sway) * 26 * z : 0;
      const scale = 1 + z * 0.55;
      const rot = f.rot + (z > 0 ? Math.sin(f.age * 1.3 + f.sway) * 0.8 * z : 0);
      // shadow on the water, drawing closer as it falls
      lctx.save();
      lctx.translate(px + 3 + z * 26, py + 4 + z * 30);
      lctx.rotate(rot);
      lctx.scale(f.size * (1 + z * 0.3), f.size * (1 + z * 0.3));
      leafPath(f);
      lctx.fillStyle = `rgba(20,26,34,${(0.13 - z * 0.08) * alpha})`;
      lctx.fill();
      lctx.restore();
      lctx.save();
      lctx.globalAlpha = alpha;
      lctx.translate(px + sway, py - z * 10);
      lctx.rotate(rot);
      lctx.scale(f.size * scale, f.size * scale);
      leafPath(f);
      if (f.kind === 'snow') {
        lctx.strokeStyle = 'rgba(110,130,150,0.85)'; lctx.lineWidth = 0.09; lctx.stroke();
      } else {
        lctx.fillStyle = f.kind === 'maple' ? f.hue : f.kind === 'ginkgo' ? '#d7a52b' : '#efc3cb';
        lctx.fill();
        lctx.strokeStyle = f.kind === 'petal' ? 'rgba(196,96,120,0.5)' : 'rgba(90,50,10,0.35)';
        lctx.lineWidth = 0.025;
        leafVeins(f);
      }
      lctx.restore();
    }
  }
  function leafPath(f) {
    const c = lctx;
    c.beginPath();
    if (f.kind === 'ginkgo') {
      c.moveTo(0, 0.12);
      c.bezierCurveTo(-0.25, 0.05, -0.56, -0.13, -0.5, -0.34);
      c.quadraticCurveTo(-0.26, -0.5, -0.05, -0.43);
      c.lineTo(0, -0.3);
      c.lineTo(0.05, -0.43);
      c.quadraticCurveTo(0.26, -0.5, 0.5, -0.34);
      c.bezierCurveTo(0.56, -0.13, 0.25, 0.05, 0, 0.12);
      c.closePath();
      c.moveTo(0.012, 0.12); c.lineTo(0.02, 0.5); c.lineTo(-0.01, 0.5); c.lineTo(-0.012, 0.12);
    } else if (f.kind === 'maple') {
      const lobes = [[-Math.PI / 2, 0.5], [-Math.PI / 2 - 0.85, 0.44], [-Math.PI / 2 + 0.85, 0.44], [-Math.PI / 2 - 1.75, 0.3], [-Math.PI / 2 + 1.75, 0.3]];
      for (let i = 0; i <= 120; i++) {
        const th = -Math.PI + (i / 120) * 2 * Math.PI;
        let r = 0.12;
        for (const [a, L] of lobes) {
          const d = Math.atan2(Math.sin(th - a), Math.cos(th - a));
          r = Math.max(r, L * Math.pow(Math.max(0, Math.cos(d * 1.9)), 3.5));
        }
        r *= 1 + 0.07 * Math.sin(th * 34);
        const x = Math.cos(th) * r, y = Math.sin(th) * r;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      c.moveTo(0.012, 0.1); c.lineTo(0.03, 0.42); c.lineTo(0.005, 0.42); c.lineTo(-0.012, 0.1);
    } else if (f.kind === 'petal') {
      c.moveTo(0, 0.5);
      c.bezierCurveTo(-0.46, 0.25, -0.42, -0.35, -0.13, -0.5);
      c.lineTo(0, -0.38);
      c.lineTo(0.13, -0.5);
      c.bezierCurveTo(0.42, -0.35, 0.46, 0.25, 0, 0.5);
      c.closePath();
    } else {
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const ca = Math.cos(a), sa = Math.sin(a);
        c.moveTo(0, 0); c.lineTo(ca * 0.5, sa * 0.5);
        for (const t of [0.25, 0.38]) {
          const bx = ca * t, by = sa * t;
          c.moveTo(bx, by); c.lineTo(bx + Math.cos(a + 0.7) * 0.12, by + Math.sin(a + 0.7) * 0.12);
          c.moveTo(bx, by); c.lineTo(bx + Math.cos(a - 0.7) * 0.12, by + Math.sin(a - 0.7) * 0.12);
        }
      }
    }
  }
  function leafVeins(f) {
    const c = lctx;
    c.beginPath();
    if (f.kind === 'ginkgo') {
      for (let i = -4; i <= 4; i++) { c.moveTo(0, 0.1); c.lineTo(i * 0.11, -0.4 + Math.abs(i) * 0.012); }
    } else if (f.kind === 'maple') {
      for (const a of [-Math.PI / 2, -Math.PI / 2 - 0.85, -Math.PI / 2 + 0.85, -Math.PI / 2 - 1.75, -Math.PI / 2 + 1.75]) {
        c.moveTo(0, 0.04); c.lineTo(Math.cos(a) * 0.4, Math.sin(a) * 0.4);
      }
    } else if (f.kind === 'petal') {
      c.moveTo(0, 0.45); c.lineTo(0, 0.05);
    }
    c.stroke();
  }

  // ---------- lift the print ----------
  let lifted = false, liftAmt = 0, prints = 0;
  const liftBtn = $('lift'), caption = $('caption');
  liftBtn.addEventListener('click', () => {
    lifted = !lifted;
    document.body.classList.toggle('lifted', lifted);
    liftBtn.innerHTML = lifted ? 'Return<span class="long"> to water</span>' : 'Lift<span class="long"> the print</span>';
    liftBtn.setAttribute('aria-pressed', String(lifted));
    canvas.setAttribute('aria-label', lifted ? 'A marbled print lifted from the water.' : 'A marbling tank of water. Touch it to drop colour.');
    if (lifted) {
      takeOver();
      prints++;
      caption.textContent = printTitle(prints);
      for (const s of pointers.values()) if (s.src) s.src.held = false;
      pointers.clear();
      setLore(LORE.lift);
      sound.lift();
      onLift(caption.textContent);
    } else {
      caption.textContent = '';
      markInput();
    }
  });
  function clock() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function printTitle(n) {
    const top = [...usage.pigs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => LIB[id].name);
    const pigs = top.length === 0 ? 'Floating ink' : top.length === 1 ? top[0] : `${top[0]} and ${top[1].toLowerCase()}`;
    const T = usage.tools;
    let kind = 'on still water';
    if (usage.recipe) kind = usage.recipe.toLowerCase();
    else if (T.has('comb')) kind = 'combed pattern';
    else if (T.has('stylus')) kind = 'drawn lines';
    else if (T.has('clear')) kind = 'rings';
    else if (T.has('breath')) kind = 'breath pattern';
    else if (T.has('camera')) kind = 'moving figure';
    else if (T.has('drop')) kind = 'stones';
    else if (T.has('brush')) kind = 'brushwork';
    const name = `${pigs} ${kind}`.replace(/^(\w)/, c => c.toUpperCase());
    return `Print ${n}: ${name}, pulled ${clock()}`;
  }
  // ---------- the drying line ----------
  let pendingPrint = null;
  const lineEl = $('line');
  const viewer = $('viewer'), viewCanvas = $('viewCanvas'), viewCaption = $('viewCaption');
  function onLift(title) { pendingPrint = { title }; }
  function afterRender() {
    if (!pendingPrint || liftAmt < 0.985) return;
    const { title } = pendingPrint;
    pendingPrint = null;
    const sc = Math.min(1, 1400 / Math.max(canvas.width, canvas.height));
    const big = document.createElement('canvas');
    big.width = Math.round(canvas.width * sc); big.height = Math.round(canvas.height * sc);
    big.getContext('2d').drawImage(canvas, 0, 0, big.width, big.height);
    const th = document.createElement('canvas');
    th.width = 160; th.height = Math.round(160 * canvas.height / canvas.width);
    th.getContext('2d').drawImage(big, 0, 0, th.width, th.height);
    th.setAttribute('aria-hidden', 'true');
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'print';
    b.title = title;
    b.setAttribute('aria-label', `${title}. Open the print.`);
    b.appendChild(th);
    b.addEventListener('click', () => openPrint(big, title));
    li.appendChild(b);
    lineEl.appendChild(li);
    while (lineEl.children.length > 8) lineEl.removeChild(lineEl.firstChild);
    lineEl.hidden = false;
    placeLine();
    say('Pinned to the drying line.', 2500);
  }
  function openPrint(big, title) {
    viewCanvas.width = big.width; viewCanvas.height = big.height;
    viewCanvas.getContext('2d').drawImage(big, 0, 0);
    viewCanvas.setAttribute('aria-label', title);
    viewCaption.textContent = title;
    if (viewer.showModal) viewer.showModal(); else viewer.setAttribute('open', '');
    $('viewClose').focus();
  }
  $('viewClose').addEventListener('click', () => { if (viewer.close) viewer.close(); else viewer.removeAttribute('open'); });
  viewer.addEventListener('click', e => { if (e.target === viewer && viewer.close) viewer.close(); });
  // on narrow screens the line hangs just under the title block
  function placeLine() {
    if (lineEl.hidden) return;
    if (window.innerWidth <= 760) {
      lineEl.style.top = Math.round($('intro').getBoundingClientRect().bottom + 12) + 'px';
    } else lineEl.style.top = '';
  }

  // ---------- sound (only after a gesture, off by default) ----------
  const sound = (() => {
    let ctx = null, master = null, lp = null, pluckBus = null, on = false, lastPluck = 0, activity = 0;
    const SCALE = [293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25, 783.99];
    function build() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.8; lp.connect(master);
      [[55, 'sine', 0.22], [82.6, 'sine', 0.12], [110.4, 'triangle', 0.045], [164.9, 'sine', 0.02]].forEach(([f, type, g]) => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
        const gn = ctx.createGain(); gn.gain.value = g;
        const wob = ctx.createOscillator(); wob.frequency.value = 0.05 + Math.random() * 0.08;
        const wg = ctx.createGain(); wg.gain.value = f * 0.004;
        wob.connect(wg); wg.connect(o.frequency); wob.start();
        o.connect(gn); gn.connect(lp); o.start();
      });
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.06;
      const lg = ctx.createGain(); lg.gain.value = 90;
      lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const ch = buf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < ch.length; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); ch[i] = b * 3; }
      const ns = ctx.createBufferSource(); ns.buffer = buf; ns.loop = true;
      const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 420; nf.Q.value = 0.5;
      const ng = ctx.createGain(); ng.gain.value = 0.05;
      ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
      pluckBus = ctx.createGain(); pluckBus.gain.value = 1; pluckBus.connect(master);
      const dl = ctx.createDelay(1); dl.delayTime.value = 0.31;
      const fb = ctx.createGain(); fb.gain.value = 0.38;
      const df = ctx.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 1600;
      pluckBus.connect(dl); dl.connect(df); df.connect(fb); fb.connect(dl); df.connect(master);
      return true;
    }
    function toggle() {
      if (!ctx && !build()) return null;
      on = !on;
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      if (on) { ctx.resume(); master.gain.linearRampToValueAtTime(0.8, t + 1.8); }
      else master.gain.linearRampToValueAtTime(0, t + 0.6);
      return on;
    }
    function pluck(intensity = 0.6, pitchBias = 0) {
      if (!on || !ctx) return;
      const now = ctx.currentTime;
      if (now - lastPluck < 0.075) return;
      lastPluck = now;
      const idx = Math.max(0, Math.min(SCALE.length - 1, ((Math.random() * SCALE.length) | 0) + pitchBias));
      const f = SCALE[idx] * (Math.random() < 0.3 ? 0.5 : 1);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f * 0.72, now);
      o.frequency.exponentialRampToValueAtTime(f * 1.18, now + 0.08 + Math.random() * 0.05);
      const g = ctx.createGain();
      const peak = 0.03 + 0.09 * Math.min(1, intensity);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(peak, now + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      o.connect(g);
      if (pan) { pan.pan.value = Math.random() * 1.2 - 0.6; g.connect(pan); pan.connect(pluckBus); } else g.connect(pluckBus);
      o.start(now); o.stop(now + 0.36);
    }
    function stir(amount) { activity = Math.min(1, activity + amount); }
    function tick(dt) {
      activity *= Math.exp(-dt * 1.4);
      if (!on || !ctx) return;
      lp.frequency.setTargetAtTime(280 + activity * 900, ctx.currentTime, 0.25);
      if (Math.random() < activity * dt * 7) pluck(activity, 2);
    }
    function lift() {
      if (!on || !ctx) return;
      [0, 0.09, 0.2].forEach((d, i) => setTimeout(() => { lastPluck = 0; pluck(0.5, -i); }, d * 1000));
    }
    return { toggle, pluck, stir, tick, lift };
  })();
  const soundBtn = $('sound');
  soundBtn.addEventListener('click', () => {
    const on = sound.toggle();
    if (on === null) { say("Sound isn't available in this browser.", 4000); return; }
    soundBtn.setAttribute('aria-pressed', String(on));
  });

  function clearTank() {
    clearing = 0.9;
    sources.length = 0;
    hands.length = 0;
    for (const e of emitters) e.ink = 0;
    nextDrop = simT + 9;
    usage = { pigs: new Map(), tools: new Set(), recipe: null };
  }
  $('clear').addEventListener('click', () => { takeOver(); clearTank(); markInput(); });

  // ---------- render ----------
  function render(t) {
    P.display.bind()
      .f('texelSize', dye.tx, dye.ty)
      .f('dyeTexel', dye.tx, dye.ty)
      .f('res', canvas.width, canvas.height)
      .f('time', reduced ? t * 0.4 : t)
      .f('paper', mood.paper[0], mood.paper[1], mood.paper[2])
      .f('ghostAmt', ghostAmt)
      .f('lift', liftAmt)
      .f('dpr', dprNow)
      .f('causAmt', mood.caus)
      .f('lampAmt', mood.lamp)
      .f('lampCol', lampLin[0], lampLin[1], lampLin[2])
      .f('lampPos', 0.28, 0.78)
      .f('sheet', sheetLin[0], sheetLin[1], sheetLin[2])
      .f('table', tableLin[0], tableLin[1], tableLin[2])
      .i('uDye', dye.read.attach(0))
      .i('uGhost', bindGhost(1));
    blit(null);
  }

  // ---------- start ----------
  chooseTool('drop', false);
  applyMood('still', false);
  const moodSel = $('mood');
  moodSel.addEventListener('change', () => applyMood(moodSel.value, true));
  const lifeBtn = $('lifeBtn');
  lifeBtn.addEventListener('click', () => {
    lifeOn = !lifeOn;
    lifeBtn.setAttribute('aria-pressed', String(lifeOn));
    markInput();
  });
  setLore(LORE.start);
  resize();
  window.addEventListener('resize', resize);

  function update(dt) {
    runTimers();
    readCamera();
    applyInput(dt);
    applyCamera();
    updateHands(dt);
    updateLife(dt);
    blendMood(dt);
    ambient(dt, simT);
    updateSettle(dt);
    updateSources(dt);
    step(dt);
  }

  // Warm-up: a few rounds of suminagashi so the first frame already holds rings.
  {
    const A = { x: 0.36, y: 0.58 }, B = { x: 0.66, y: 0.44 };
    const seq = [
      [0.0, 'ink', A, LIB.sumi, 1.1], [0.45, 'clear', A, null, 0.8], [0.8, 'ink', A, LIB.sumi, 0.8],
      [1.15, 'clear', A, null, 0.6], [1.45, 'ink', A, pigment, 0.6], [1.75, 'clear', A, null, 0.5],
      [0.2, 'ink', B, LIB.indigo, 0.9], [0.65, 'clear', B, null, 0.7], [1.0, 'ink', B, pigment, 0.6],
    ];
    for (const [at, kind, p, pig, size] of seq) after(at, () => addSource({ kind, x: p.x, y: p.y, pig, size }));
    after(2.1, () => handStroke('stylus', 0.18, 0.66, 0.82, 0.38, 0.9));
    nextDrop = 5;
    stillWater(3.2);
    for (let i = 0; i < 180; i++) { simT += 1 / 60; update(1 / 60); }
    stillWater(0);
    settleHold = 0;
  }

  const deep = /pattern=(\w+)/.exec(location.hash || '');
  if (deep && RECIPES[deep[1]]) playRecipe(deep[1]);

  let last = performance.now();
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); say('The water paused. Reload the page to continue.', 0); }, false);
  function frame(now) {
    const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 30));
    last = now;
    resize();
    const sdt = dt * (reduced ? 0.75 : 1);
    if (clearing > 0) clearing -= dt;
    liftAmt += ((lifted ? 1 : 0) - liftAmt) * Math.min(1, dt * (reduced ? 20 : 2.4));
    ghostAmt += ((ghostOn && cam.on && !lifted ? 1 : 0) - ghostAmt) * Math.min(1, dt * 3);
    sound.tick(dt);
    if (!lifted) {
      simT += sdt;
      update(sdt);
    } else {
      cameraMoves.length = 0;
    }
    render(simT);
    afterRender();
    drawOverlay();
    requestAnimationFrame(frame);
  }
  render(simT);
  requestAnimationFrame(frame);
})();
</script>
