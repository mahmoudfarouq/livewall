<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Pool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&display=swap');
:root{
  color-scheme: dark;
  --slate:#2a2f2d;
  --ink:#f1efe6;
  --ink-soft:rgba(241,239,230,.74);
  --glass:rgba(20,31,30,.5);
  --glass-edge:rgba(225,236,226,.16);
  --card:rgba(244,241,229,.94);
  --card-ink:#1d2422;
  --card-soft:#56615c;
  /* Xanthoria parietina: the orange lichen that marks the top of the shore */
  --lichen:#efb23a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--slate)}
body{font-family:'Alegreya Sans',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;outline:none;cursor:crosshair}
#stage:focus-visible{box-shadow:inset 0 0 0 3px var(--lichen)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#air{pointer-events:none}
.ui{position:fixed;z-index:3}
#tide{left:max(16px,env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;
  padding:8px 14px 8px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15);pointer-events:none}
#tide svg{display:block;flex:none}
#tide b{display:block;font-weight:500;font-size:16px;line-height:1.1}
#tide span{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.2}
#sound{right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;
  min-height:44px;padding:0 16px 0 12px;border-radius:999px;border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);
  font:500 15px/1 'Alegreya Sans',system-ui,sans-serif;cursor:pointer;
  -webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15)}
#sound:hover{background:rgba(30,46,44,.62)}
#sound:focus-visible{outline:2px solid var(--lichen);outline-offset:3px}
#sound .w{opacity:.25;transition:opacity .2s}
#sound[aria-pressed="true"] .w{opacity:1}
#hint{left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  text-align:center;font-size:16px;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.35);
  pointer-events:none;transition:opacity 1.4s ease}
#label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;padding:6px 11px 7px;border-radius:10px;background:var(--card);color:var(--card-ink);
  font-size:15.5px;font-weight:500;line-height:1.15;white-space:nowrap;opacity:0;transition:opacity .16s ease;
  box-shadow:0 4px 14px rgba(0,0,0,.25)}
#label i{display:block;font-weight:400;font-size:13px;color:var(--card-soft)}
.wall .ui,.wall #label{display:none!important}
.wall #stage{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){#tide span{font-size:12.5px}#sound{padding:0 13px 0 10px}}
@media (prefers-reduced-motion: reduce){#hint,#label,#sound .w{transition:none}}
</style>

<div id="stage" tabindex="0" role="img" aria-label="A rock pool seen from above. The tide drains and refills it over ten minutes. Press Enter to drop a pebble.">
  <canvas id="gl"></canvas>
  <canvas id="air"></canvas>
</div>
<div id="tide" class="ui" aria-live="polite">
  <svg width="64" height="26" viewBox="0 0 64 26" aria-hidden="true">
    <path id="tcurve" fill="none" stroke="rgba(241,239,230,.35)" stroke-width="1.5"/>
    <circle id="tdot" r="3.6" fill="var(--lichen)"/>
  </svg>
  <div><b id="tstate">Ebbing</b><span id="tnext">Low water in about 4 minutes</span></div>
</div>
<button id="sound" class="ui" type="button" aria-pressed="false">
  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8v4h3l4 3.5v-11L6 8z" fill="currentColor" stroke="none"/>
    <path class="w" d="M13 7.2a4 4 0 0 1 0 5.6M15.3 5a7 7 0 0 1 0 10"/>
  </svg>
  <span id="soundtxt">Sound off</span>
</button>
<div id="hint" class="ui">Click the water to drop a pebble. Drag to stir.</div>
<div id="label" aria-hidden="true"></div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const WALL = location.hash === '#wallpaper';
if (WALL) document.documentElement.classList.add('wall');
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mqRM.matches;
try { mqRM.addEventListener('change', e => { reduced = e.matches; }); } catch (_) {}
const mo = () => reduced ? 0.35 : 1;

const CYCLE = 600, LO = 0.425, HI = 0.975;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry((Math.random() * 2 ** 31) | 0);
const R = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(R(a, b + 1));

// ---------- value noise ----------
const PERM = new Uint16Array(512), VAL = new Float32Array(256);
(function () { const p = []; for (let i = 0; i < 256; i++) { p.push(i); VAL[i] = rnd(); }
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; })();
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), X = xi & 255, Y = yi & 255;
  const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]], c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * vn(x, y); n += a; x = x * 2.03 + 17.1; y = y * 2.03 + 3.7; a *= 0.5; } return s / n; }

// ---------- world ----------
let W = 0, H = 0, S = 1, U = 1, cell = 4, hmW = 0, hmH = 0, HM, WET, DRY, F;
let rc = 6, rW = 0, rH = 0, RA, RB, RHt, RBYTES, WBYTES;
let simT = CYCLE * 0.24, clock = 0, level = 0.7, levelEff = 0.7, tideV = 0.5, rising = false;
let sunL = [0.5, 0.3, 0.8], light = [1, 1, 1], sky = [0.6, 0.75, 0.9], shX = 0, shY = 0;
let surgeX = 0, surgeY = 0;
const flows = [];
let all = [], anemones = [], crabs = [], fish = [], weeds = [], shelters = [], pebbles = [];
let barnacles = [], limpets = [], snails = [], stars = [], prawns = [], tufts = [], lettuce = [];

function hAt(x, y) {
  let fx = x / cell, fy = y / cell;
  if (fx < 0) fx = 0; else if (fx > hmW - 1.001) fx = hmW - 1.001;
  if (fy < 0) fy = 0; else if (fy > hmH - 1.001) fy = hmH - 1.001;
  const i = fx | 0, j = fy | 0, u = fx - i, v = fy - j, k = j * hmW + i;
  return (HM[k] * (1 - u) + HM[k + 1] * u) * (1 - v) + (HM[k + hmW] * (1 - u) + HM[k + hmW + 1] * u) * v;
}
const depthAt = (x, y) => levelEff - hAt(x, y);
function gradAt(x, y) { const e = cell * 1.5; return [(hAt(x + e, y) - hAt(x - e, y)) / (2 * e), (hAt(x, y + e) - hAt(x, y - e)) / (2 * e)]; }
const inside = (x, y, m) => x > m && y > m && x < W - m && y < H - m;

function basin(x, y, c, r, a, e, depth, bowl) {
  const dx = x - c[0], dy = y - c[1], ca = Math.cos(a), sa = Math.sin(a);
  const rx = (dx * ca + dy * sa) / e, ry = (-dx * sa + dy * ca) * e;
  const d = Math.hypot(rx, ry) / r + 0.38 * (fbm(x * 3.1 + 40, y * 3.1 + 9, 4) - 0.5);
  if (d > 1.15) return 0;
  return depth * (1 - smooth(0.6, 1.02, d)) + bowl * Math.max(0, 1 - d * d);
}
function distPoly(x, y, P) {
  let best = 1e9;
  for (let i = 0; i < P.length - 2; i += 2) {
    const ax = P[i], ay = P[i + 1], bx = P[i + 2], by = P[i + 3], vx = bx - ax, vy = by - ay;
    const t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy), 0, 1);
    const d = Math.hypot(x - ax - vx * t, y - ay - vy * t); if (d < best) best = d;
  }
  return best;
}
function genH(u, v) {
  const wx = fbm(u * 1.5 + 11.3, v * 1.5 + 3.1, 4) - 0.5, wy = fbm(u * 1.5 + 7.7, v * 1.5 + 19.9, 4) - 0.5;
  const qx = u + 0.28 * wx, qy = v + 0.28 * wy;
  let h = 0.69 + 0.36 * (fbm(qx * 2.2, qy * 2.2, 5) - 0.5);
  // slate bedding: parallel ridges, the grain of the shore
  const bd = qx * F.bx + qy * F.by, s = Math.sin(bd * 24 + 11 * wx + 6 * (fbm(qx * 4 + 5, qy * 4, 3) - 0.5));
  h += 0.024 * Math.pow(1 - Math.abs(s), 2) * (0.4 + fbm(qx * 3 + 9, qy * 3 + 2, 3)) - 0.01;
  h -= basin(qx, qy, F.c1, F.r1, F.a1, F.e1, 0.36, 0.13);
  h -= basin(qx, qy, F.c2, F.r2, F.a2, F.e2, 0.3, 0.05);
  const gd = distPoly(qx, qy, F.gully); h -= 0.17 * (1 - smooth(0.022, 0.07, gd));
  for (const b of F.boulders) {
    const d = Math.hypot(qx - b[0], qy - b[1]) / b[2] + 0.22 * (fbm(qx * 6 + b[0] * 9, qy * 6, 3) - 0.5);
    if (d < 1.3) { const dome = Math.max(0, 1 - d * d); h = Math.max(h, b[3] - (1 - Math.sqrt(dome)) * 0.75); }
  }
  h += 0.018 * (vn(u * 60, v * 60) - 0.5);
  return clamp(h, 0, 1);
}

function buildTerrain() {
  const A = W / S, B = H / S;
  F = {};
  const ba = R(0, TAU); F.bx = Math.cos(ba); F.by = Math.sin(ba);
  F.c1 = [A * R(0.42, 0.58), B * R(0.44, 0.56)]; F.r1 = 0.4; F.a1 = R(0, TAU); F.e1 = R(1.1, 1.4);
  F.c2 = [A * (rnd() < 0.5 ? 0.15 : 0.85), B * (rnd() < 0.5 ? 0.18 : 0.82)]; F.r2 = 0.16; F.a2 = R(0, TAU); F.e2 = R(1, 1.3);
  // gully to the open sea
  const ga = Math.atan2(F.c1[1] - F.c2[1], F.c1[0] - F.c2[0]) + R(-0.7, 0.7), gp = R(0, TAU);
  F.gDir = [Math.cos(ga), Math.sin(ga)]; F.gully = [];
  for (let k = 0; k <= 24; k++) {
    const t = k / 24, off = 0.07 * Math.sin(t * 7 + gp) * t;
    F.gully.push(F.c1[0] + F.gDir[0] * t * 1.8 - F.gDir[1] * off, F.c1[1] + F.gDir[1] * t * 1.8 + F.gDir[0] * off);
  }
  F.boulders = [];
  const rb = R(0, TAU);
  F.boulders.push([F.c1[0] + Math.cos(rb) * F.r1 * 0.95, F.c1[1] + Math.sin(rb) * F.r1 * 0.95, R(0.1, 0.13), R(0.95, 1.0)]);
  for (let k = 0, tries = 0; k < 4 && tries < 200; tries++) {
    const x = R(0.05, A - 0.05), y = R(0.05, B - 0.05), r = R(0.06, 0.11);
    if (Math.hypot(x - F.c1[0], y - F.c1[1]) < F.r1 * 1.3 + r) continue;
    if (Math.hypot(x - F.c2[0], y - F.c2[1]) < F.r2 * 1.3 + r) continue;
    if (F.boulders.some(b => Math.hypot(b[0] - x, b[1] - y) < b[2] + r + 0.05)) continue;
    F.boulders.push([x, y, r, R(0.9, 1.0)]); k++;
  }
  cell = Math.max(W, H) / 300;
  hmW = Math.ceil(W / cell) + 2; hmH = Math.ceil(H / cell) + 2;
  HM = new Float32Array(hmW * hmH); WET = new Float32Array(hmW * hmH); DRY = new Float32Array(hmW * hmH);
  WBYTES = new Uint8Array(hmW * hmH);
  const bytes = new Uint8Array(hmW * hmH * 2);
  for (let j = 0; j < hmH; j++) for (let i = 0; i < hmW; i++) {
    const k = j * hmW + i, h = genH(i * cell / S, j * cell / S);
    HM[k] = h; const v = Math.round(h * 65535); bytes[k * 2] = v >> 8; bytes[k * 2 + 1] = v & 255;
    DRY[k] = (1 + 1.5 * Math.max(0, h - 0.6)) / (38 + 70 * fbm(i * 0.05 + 3, j * 0.05, 3));
    WET[k] = h < LO + (HI - LO) * 0.75 ? 1 : 0.3;
  }
  rc = Math.max(W, H) / 230; rW = Math.ceil(W / rc) + 2; rH = Math.ceil(H / rc) + 2;
  RA = new Float32Array(rW * rH); RB = new Float32Array(rW * rH); RHt = new Float32Array(rW * rH); RBYTES = new Uint8Array(rW * rH);
  for (let j = 0; j < rH; j++) for (let i = 0; i < rW; i++) RHt[j * rW + i] = hAt(i * rc, j * rc);
  return bytes;
}

// ---------- tide, sun ----------
function updateTide() {
  const th = TAU * simT / CYCLE;
  tideV = 0.5 + 0.5 * Math.cos(th);
  rising = Math.sin(th) < 0;
  level = LO + (HI - LO) * tideV;
  // swell breathing in through the gully
  const sw = Math.sin(clock * TAU / 8.3) * 0.7 + Math.sin(clock * TAU / 3.7 + 1) * 0.3;
  levelEff = level + sw * (0.004 + 0.004 * tideV);
  const sa = 18 * U * (0.3 + 0.7 * tideV) * Math.cos(clock * TAU / 8.3);
  surgeX = F.gDir[0] * sa; surgeY = F.gDir[1] * sa;
  const p = ((simT % CYCLE) + CYCLE) % CYCLE / CYCLE;
  const az = TAU * p + 2.3, el = 0.55 - 0.32 * Math.cos(TAU * p);
  sunL = [Math.cos(az) * Math.cos(el), Math.sin(az) * Math.cos(el), Math.sin(el)];
  const k = smooth(0.25, 0.8, el), inten = 0.8 + 0.26 * k;
  light = [inten * 1.0, inten * lerp(0.8, 0.975, k), inten * lerp(0.64, 0.93, k)];
  sky = [lerp(0.55, 0.62, k), lerp(0.58, 0.78, k), lerp(0.75, 0.95, k)];
  const cot = Math.min(2.4, 1 / Math.tan(el));
  shX = -Math.cos(az) * cot; shY = -Math.sin(az) * cot;
}

// ---------- water: ripples, wetness, flow ----------
function rippleAt(x, y, rad, amp) {
  const ci = x / rc, cj = y / rc, rr = Math.max(1.2, rad / rc);
  for (let j = Math.max(1, Math.floor(cj - rr)); j <= Math.min(rH - 2, Math.ceil(cj + rr)); j++)
    for (let i = Math.max(1, Math.floor(ci - rr)); i <= Math.min(rW - 2, Math.ceil(ci + rr)); i++) {
      const d = Math.hypot(i - ci, j - cj); if (d < rr) RA[j * rW + i] += amp * (0.5 + 0.5 * Math.cos(d / rr * Math.PI));
    }
}
function stepRipples() {
  const a = RA, b = RB, w = rW, lv = levelEff;
  for (let j = 1; j < rH - 1; j++) for (let i = 1, k = j * w + 1; i < w - 1; i++, k++) {
    if (RHt[k] > lv) { b[k] = 0; continue; }
    b[k] = ((a[k - 1] + a[k + 1] + a[k - w] + a[k + w]) * 0.5 - b[k]) * 0.986;
  }
  RA = b; RB = a;
}
function updateWet(dt) {
  const lv = levelEff;
  for (let k = 0, n = HM.length; k < n; k++) {
    let w = WET[k];
    if (HM[k] < lv) w = 1; else { w -= dt * DRY[k]; if (w < 0) w = 0; }
    WET[k] = w; WBYTES[k] = w * 255;
  }
}
function wetSplash(x, y, rad) {
  const ci = x / cell, cj = y / cell, rr = rad / cell;
  for (let j = Math.max(0, Math.floor(cj - rr)); j <= Math.min(hmH - 1, Math.ceil(cj + rr)); j++)
    for (let i = Math.max(0, Math.floor(ci - rr)); i <= Math.min(hmW - 1, Math.ceil(ci + rr)); i++) {
      const d = Math.hypot(i - ci, j - cj) / rr + 0.5 * (vn(i * 0.7, j * 0.7) - 0.5);
      if (d < 1) { const k = j * hmW + i; WET[k] = Math.max(WET[k], 1 - d * d * 0.6); }
    }
}
function flowAt(x, y) {
  let fx = surgeX * 0.4, fy = surgeY * 0.4;
  for (let i = 0; i < flows.length; i++) {
    const f = flows[i], dx = x - f.x, dy = y - f.y, d2 = dx * dx + dy * dy, r2 = f.r * f.r;
    if (d2 < r2 * 4) { const w = Math.exp(-d2 / r2) * f.a; fx += f.vx * w; fy += f.vy * w; }
  }
  return [fx, fy];
}

// ---------- placement helpers ----------
let occ = [];
const free = (x, y, r) => occ.every(o => Math.hypot(o[0] - x, o[1] - y) > o[2] + r);
function place(test, r, tries = 400, keep = true) {
  for (let k = 0; k < tries; k++) {
    const x = R(0.03, 0.97) * W, y = R(0.03, 0.97) * H, h = hAt(x, y);
    if (test(h, x, y) && free(x, y, r)) { if (keep) occ.push([x, y, r]); return [x, y]; }
  }
  return null;
}
function pickWater(x, y, rad, minD) {
  for (let k = 0; k < 14; k++) {
    const a = R(0, TAU), d = R(0.25, 1) * rad, nx = x + Math.cos(a) * d, ny = y + Math.sin(a) * d;
    if (inside(nx, ny, 10) && depthAt(nx, ny) > minD) return [nx, ny];
  }
  return null;
}
function nearestShelter(x, y, wantWater) {
  let best = null, bd = 1e9;
  for (const s of shelters) {
    let d = Math.hypot(s.x - x, s.y - y);
    if (wantWater && depthAt(s.x, s.y) < 0.004) d += 220 * U;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function disturb(x, y, rad, str) {
  for (const c of all) {
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < rad) { const s = str * (1 - d / rad); c.scare = Math.max(c.scare || 0, s * R(4, 8)); c.fx = x; c.fy = y; if (c.startle) c.startle(c, s); }
  }
}

function disturbOnly(groups, x, y, rad, str) {
  for (const arr of groups) for (const c of arr) {
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < rad) { c.scare = Math.max(c.scare || 0, str * (1 - d / rad) * R(3, 6)); c.fx = x; c.fy = y; }
  }
}
// The pool keeps itself busy: swell through the gully, drips at low water, the odd squabble.
let swellT = 0, dripT = 2, squabbleT = 25;
function ambient(dt, idleFor) {
  swellT -= dt;
  if (swellT <= 0) {
    swellT = 8.3 * R(0.8, 1.25);
    if (tideV > 0.25) { // a wavelet rolls in from the seaward edge
      const gx = F.gDir[0], gy = F.gDir[1], cx = W / 2 + gx * W * 0.55, cy = H / 2 + gy * H * 0.55;
      for (let k = -6; k <= 6; k++) { const x = cx - gy * k * 30 * U, y = cy + gx * k * 30 * U; if (inside(x, y, 2) && depthAt(x, y) > 0.01) rippleAt(x, y, 22 * U, 0.5 * tideV * mo()); }
    }
  }
  dripT -= dt;
  if (dripT <= 0) {
    dripT = R(1.2, 4.5) * (0.5 + tideV * 2);
    for (let k = 0; k < 12; k++) { // drip from a wet ledge into the water
      const x = R(0.05, 0.95) * W, y = R(0.05, 0.95) * H, d = depthAt(x, y);
      if (d > 0.002 && d < 0.04) { rippleAt(x, y, 3 * U, 0.7 * mo()); break; }

// ---------- population ----------
function populate() {
  occ = []; all = []; anemones = []; crabs = []; fish = []; weeds = []; shelters = []; pebbles = [];
  barnacles = []; limpets = []; snails = []; stars = []; prawns = []; tufts = []; lettuce = [];
  const area = clamp(W * H / (S * S), 1, 2.2);
  for (const b of F.boulders) {
    const bx = b[0] * S, by = b[1] * S, a = Math.atan2(F.c1[1] * S - by, F.c1[0] * S - bx);
    for (const da of [-0.6, 0, 0.6]) { const sx = bx + Math.cos(a + da) * b[2] * S * 0.95, sy = by + Math.sin(a + da) * b[2] * S * 0.95; if (inside(sx, sy, 8) && hAt(sx, sy) < 0.72) shelters.push({ x: sx, y: sy, r: 14 * U }); }
  }
  const nw = Math.round(5 * area);
  for (let i = 0; i < nw; i++) {
    const p = place(h => h > 0.47 && h < 0.78, 40 * U); if (!p) continue;
    const w = makeWrack(p[0], p[1], hAt(p[0], p[1]) < 0.6 ? 'serrated' : 'bladder'); weeds.push(w); shelters.push({ x: w.x, y: w.y, r: 24 * U });
  }
  const add = (arr, o) => { arr.push(o); all.push(o); };
  for (let i = 0; i < Math.round(8 * area); i++) { const p = place(h => h > 0.42 && h < 0.7, 18 * U); if (p) add(anemones, makeAnemone('beadlet', p[0], p[1])); }
  for (let i = 0; i < 2; i++) { const p = place(h => h > 0.38 && h < 0.56, 24 * U); if (p) add(anemones, makeAnemone('strawberry', p[0], p[1])); }
  for (let i = 0; i < Math.round(3 * area); i++) { const p = place(h => h < 0.4, 30 * U); if (p) add(anemones, makeAnemone('snakelocks', p[0], p[1])); }
  for (let i = 0; i < 4; i++) { const p = place(h => h < 0.48, 20 * U, 400, false); if (p) add(crabs, makeCrab(i === 3 ? 'velvet' : 'shore', p[0], p[1])); }
  for (let i = 0; i < 4; i++) { const p = place(h => h < 0.37, 10 * U, 400, false); if (p) add(fish, makeFish(i % 2 ? 'goby' : 'shanny', p[0], p[1])); }
  for (let i = 0; i < Math.round(7 * area); i++) { const p = place(h => h > 0.62 && h < 0.84, 28 * U); if (p) add(barnacles, makeBarnacles(p[0], p[1])); }
  for (let i = 0; i < Math.round(9 * area); i++) { const p = place(h => h > 0.55 && h < 0.82, 12 * U); if (p) add(limpets, makeLimpet(p[0], p[1])); }
  const sk = ['winkle', 'winkle', 'flat', 'top'];
  for (let i = 0; i < Math.round(9 * area); i++) { const p = place(h => h > 0.44 && h < 0.7, 8 * U); if (p) add(snails, makeSnail(sk[i % 4], p[0], p[1])); }
  for (let i = 0; i < 4; i++) { const p = place(h => h < (i < 2 ? 0.4 : 0.46), (i < 2 ? 34 : 12) * U); if (p) add(stars, makeStar(i < 2 ? 'common' : 'cushion', p[0], p[1])); }
  for (let i = 0; i < Math.round(3 * area) + 2; i++) { const p = place(h => h < 0.36, 8 * U, 400, false); if (p) add(prawns, makePrawn(p[0], p[1])); }
  for (let i = 0; i < 3; i++) { const p = place(h => h > 0.34 && h < 0.5, 30 * U); if (p) { const l = makeLettuce(p[0], p[1]); lettuce.push(l); all.push(l); shelters.push({ x: l.x, y: l.y, r: 16 * U }); } }
  for (let i = 0; i < Math.round(6 * area); i++) { const p = place(h => h > 0.3 && h < 0.55, 14 * U); if (p) { const t = makeTuft(p[0], p[1]); tufts.push(t); all.push(t); } }
  for (let i = 0; i < 2; i++) { const p = place(h => h < 0.31, 50 * U); if (p) { const k = makeKelp(p[0], p[1]); weeds.push(k); shelters.push({ x: k.x + Math.cos(k.base) * 40 * U, y: k.y + Math.sin(k.base) * 40 * U, r: 26 * U }); } }
  for (const w of weeds) all.push(w);
}

// ---------- gulls ----------
const gulls = [];
let nextGull = 14;
function updGulls(dt) {
  nextGull -= dt;
  if (nextGull <= 0 && gulls.length < 2) {
    nextGull = R(22, 55);
    const a = R(0, TAU), sz = R(0.3, 0.42) * S, cx = W / 2 + R(-0.3, 0.3) * W, cy = H / 2 + R(-0.3, 0.3) * H, D = Math.hypot(W, H) * 0.5 + sz;
    const sp = R(0.16, 0.24) * Math.hypot(W, H);

  }
  for (let i = gulls.length - 1; i >= 0; i--) {
    const g = gulls[i]; g.t += dt; g.a += g.turn * dt;
    const sp = Math.hypot(g.vx, g.vy); g.vx = Math.cos(g.a) * sp; g.vy = Math.sin(g.a) * sp;
    g.x += g.vx * dt; g.y += g.vy * dt;

  if (!c) { if (labelFor) { elLabel.style.opacity = '0'; labelFor = null; } return; }
  if (labelFor !== c) {
    elLabel.textContent = ''; elLabel.append(c.name); const i = document.createElement('i'); i.textContent = c.latin; elLabel.append(i); labelFor = c;
  }
  const w = elLabel.offsetWidth, h = elLabel.offsetHeight;
  const lx = clamp(x - w / 2, 8, innerWidth - w - 8), ly = y - h - 18 < 8 ? y + 22 : y - h - 18;
  elLabel.style.transform = `translate(${lx}px,${ly}px)`; elLabel.style.opacity = '1';
}

let pd = null, idle = 0;
function pos(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
stage.addEventListener('pointerdown', e => {
  if (WALL) return;
  const [x, y] = pos(e); pd = { x, y, lx: x, ly: y, id: e.pointerId, moved: false, type: e.pointerType };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  idle = 0; hideHint();
});
stage.addEventListener('pointermove', e => {
  if (WALL) return;
  const [x, y] = pos(e);
  if (e.pointerType !== 'touch' && !pd) showLabel(hitTest(x, y), x, y);
  if (!pd || pd.id !== e.pointerId) return;
  idle = 0;
  if (!pd.moved && Math.hypot(x - pd.x, y - pd.y) > 8) { pd.moved = true; showLabel(null); }
  if (pd.moved) {
    const dx = x - pd.lx, dy = y - pd.ly, l = Math.hypot(dx, dy);
    if (l < 6) return;
    const n = Math.ceil(l / (10 * U));
    for (let i = 1; i <= n; i++) {
      const sx = pd.lx + dx * i / n, sy = pd.ly + dy * i / n;
      if (depthAt(sx, sy) > 0.002) rippleAt(sx, sy, 9 * U, 0.55 * mo());
    }
    if (depthAt(x, y) > 0.002) {
      flows.push({ x, y, vx: clamp(dx / l * 120 * U, -200 * U, 200 * U), vy: clamp(dy / l * 120 * U, -200 * U, 200 * U), r: 60 * U, a: 1 });
      if (flows.length > 60) flows.shift();
      disturb(x, y, 110 * U, 0.4);
      audio.stir();
    }
    pd.lx = x; pd.ly = y;
  }
});
function endPointer(e) {
  if (!pd || pd.id !== e.pointerId) return;
  const [x, y] = pos(e);
  if (!pd.moved) {
    const hit = pd.type === 'touch' ? hitTest(x, y) : null;
    if (hit) { showLabel(hit, x, y); labelTimer = 2.6; }
    else dropPebble(x, y);
  }
  pd = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', e => { pd = null; });
stage.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') showLabel(null); });
stage.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); hideHint();
    const p = pickWater(F.c1[0] * S, F.c1[1] * S, F.r1 * S * 0.8, 0.02) || [W / 2, H / 2];
    dropPebble(p[0], p[1]);
  }
});

// ---------- loop ----------
let last = performance.now(), rAcc = 0;
function update(dt) {
  updateTide();
  rAcc += dt; let n = 0; while (rAcc > 1 / 60 && n < 3) { stepRipples(); rAcc -= 1 / 60; n++; } if (n === 3) rAcc = 0;
  updateWet(dt);
  for (let i = flows.length - 1; i >= 0; i--) { flows[i].a *= Math.exp(-dt * 1.3); if (flows[i].a < 0.03) flows.splice(i, 1); }
  updGulls(dt);
  for (const a of anemones) updAnemone(a, dt);
  for (const k of crabs) updCrab(k, dt, gullOver);
  for (const f of fish) updFish(f, dt);
  for (const w of weeds) w.type === 'kelp' ? updKelp(w, dt) : updWeed(w, dt);
  for (const b of barnacles) updBarnacles(b, dt);
  for (const l of limpets) updLimpet(l, dt);
  for (const s of snails) updSnail(s, dt);
  for (const s of stars) updStar(s, dt);
  for (const p of prawns) updPrawn(p, dt);
  for (const l of lettuce) l.s += ((depthAt(l.x, l.y) > 0.003 ? 1 : 0) - l.s) * Math.min(1, dt * 0.8);
  updAir(dt);
  ambient(dt, idle);
  audio.tick(dt);
  if (labelTimer > 0) { labelTimer -= dt; if (labelTimer <= 0) showLabel(null); }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (WALL && now - last < 31) return;
  let dt = (now - last) / 1000; last = now;
  if (dt <= 0) return; if (dt > 0.1) dt = 0.1;
  clock += dt; simT += dt; idle += dt;
  update(dt); drawLife(); drawAir(); render(); updateUI(dt);
}

if (!initGL()) gl = null;
build();
update(0.016); drawLife(); render(); updateUI(1);
requestAnimationFrame(t => { last = t; frame(t); });
})();
