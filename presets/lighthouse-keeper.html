<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lighthouse Keeper</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Kalam:wght@300;400&display=swap');
:root{
  color-scheme: dark;
  --night:#0a1219;
  --glass:rgba(11,21,29,.64);
  --glass-edge:rgba(196,216,226,.16);
  --text:#e6ece9;
  --muted:#a6b5ba;
  --flare:#c4307f;      /* Admiralty chart light-flare magenta */
  --flare-hi:#f07cbb;
  --paper:#e3e8e4;      /* ledger paper, blue-ruled */
  --paper-shade:#cfd8d5;
  --rule:#a9c1d0;
  --margin:#c66b66;
  --ink:#26314a;        /* iron-gall blue-black */
  --ink-soft:#5a6480;
  --focus:#f07cbb;
  --hand:'Kalam','Bradley Hand','Segoe Print',cursive;
  --ui:'Alegreya Sans','Gill Sans','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
button,input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* lantern hit target */
#lantern{position:fixed;width:56px;height:56px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:3}
#lantern:focus-visible{outline:2px solid var(--focus);outline-offset:0}
#tip{position:fixed;z-index:6;max-width:270px;padding:12px 14px 11px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-edge);border-radius:10px;font-size:14px;line-height:1.4;color:var(--muted);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
#tip.show{opacity:1;transform:none}
#tip b{display:block;color:var(--text);font-weight:500;font-size:15px}
#tip .ch{display:block;margin:2px 0 6px;color:var(--flare-hi);font-size:20px;font-weight:700;letter-spacing:.01em}
#tip .st{display:block;margin-top:7px;color:var(--text)}
#hint{position:fixed;z-index:4;padding:5px 11px 6px;border-radius:999px;background:var(--flare);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:0 2px 14px rgba(196,48,127,.45)}
#hint.show{opacity:1}

/* log slip */
#slip{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));width:min(360px,calc(100vw - 32px));padding:10px 16px 12px 40px;color:var(--ink);font-family:var(--hand);font-size:16px;line-height:26px;
  background:
    linear-gradient(90deg,transparent 28px,var(--margin) 28px,var(--margin) 29px,transparent 29px),
    repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px),
    var(--paper);
  background-position:0 0,0 9px,0 0;
  border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5) inset;transform:rotate(-.6deg);transition:opacity .4s;cursor:pointer;border:0;text-align:left;display:block}
#slip .d{display:block;font-weight:400;color:var(--ink)}
#slip .l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
#slip .t{color:var(--ink-soft);margin-right:.5em}
.new .tx{display:inline-block;animation:write var(--dur,1.6s) steps(28,end) both;vertical-align:top}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* control bar */
#bar{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:min(452px,calc(100vw - 32px));padding:12px 14px 12px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-edge);border-radius:12px}
#when{display:flex;align-items:baseline;gap:10px;margin:0 2px 9px}
#date{font-size:17px;font-weight:500}
#time{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
#wx{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--glass-edge);background:rgba(255,255,255,.05);cursor:pointer;font-size:15px;line-height:1}
.btn:hover{background:rgba(255,255,255,.11)}
.btn[aria-pressed="true"]{background:rgba(240,124,187,.16);border-color:rgba(240,124,187,.55)}
.seg{display:flex;border:1px solid var(--glass-edge);border-radius:8px;overflow:hidden}
.seg .btn{border:0;border-radius:0;padding:0 10px;min-width:40px}
.seg .btn+.btn{border-left:1px solid var(--glass-edge)}
.grow{flex:1}
#scrub{display:flex;align-items:center;gap:10px;margin-top:10px}
#scrub label{font-size:14px;color:var(--muted);min-width:64px}
#scrub output{color:var(--text);font-variant-numeric:tabular-nums}
#year{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0}
#year::-webkit-slider-runnable-track{height:2px;background:rgba(220,232,236,.32);border-radius:2px}
#year::-moz-range-track{height:2px;background:rgba(220,232,236,.32)}
#year::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--text);border:3px solid #24333d}
#year::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:3px solid #24333d}

/* logbook */
#log{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(470px,100vw);display:flex;flex-direction:column;color:var(--ink);background:var(--paper);box-shadow:-20px 0 50px rgba(0,0,0,.4);transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#log.open{transform:none;visibility:visible}
#log header{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 18px 12px 22px;background:var(--paper-shade);border-bottom:1px solid #b9c5c3}
#log h2{margin:0;font-size:18px;font-weight:500;color:var(--ink)}
#log header p{margin:1px 0 0;font-size:14px;color:var(--ink-soft)}
#log .close{margin-left:auto;height:34px;padding:0 12px;border-radius:8px;border:1px solid #9fb0b2;background:transparent;color:var(--ink);cursor:pointer}
#logbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 40px 58px;font-family:var(--hand);font-size:17px;line-height:30px;
  background:
    linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 45px,transparent 45px,transparent 47px,var(--margin) 47px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(180deg,transparent 0 29px,var(--rule) 29px 30px);
  background-attachment:local;background-color:var(--paper)}
.day{margin:0 0 30px}
.day h3{margin:0;font-family:var(--hand);font-weight:400;font-size:19px;line-height:30px;color:var(--ink)}
.day .yr{margin:30px 0 0 -40px;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--margin);line-height:30px}
.ln{display:flex;gap:10px;font-weight:300}
.ln .t{flex:0 0 3.1em;color:var(--ink-soft)}
.sig{text-align:right;color:var(--ink-soft);font-weight:300;padding-right:8px}

body.wall #bar,body.wall #slip,body.wall #lantern,body.wall #tip,body.wall #hint,body.wall #log{display:none!important}

@media (max-width:640px){
  #slip{font-size:15px;line-height:24px;padding:8px 12px 10px 36px;background-position:0 0,0 7px,0 0}
  #slip .l:nth-of-type(n+3){display:none}
  #wx{display:none}
  #bar{padding:10px 10px 10px}
  .btn{padding:0 10px}
  .seg .btn{min-width:34px;padding:0 8px}
  .row{gap:5px}
  #log{width:100vw}
}
@media (prefers-reduced-motion:reduce){
  .new .tx{animation:none}
  #log,#tip,#hint{transition:none}
}
</style>

<canvas id="sea" role="img" aria-label="A lighthouse on a rocky island at sea"></canvas>
<button id="lantern" type="button" aria-label="The lantern" aria-describedby="tip"></button>
<div id="tip" role="tooltip"></div>
<div id="hint" aria-hidden="true">Light the lamp</div>
<button id="slip" type="button" aria-label="Open the logbook"></button>

<div id="bar" role="group" aria-label="Time and sound">
  <div id="when"><span id="date">20 September 1890</span><span id="time">17:00</span><span id="wx"></span></div>
  <div class="row">
    <button class="btn" id="openlog" type="button">Logbook</button>
    <div class="seg" role="group" aria-label="Speed">
      <button class="btn" type="button" data-speed="0" aria-pressed="false">Pause</button>
      <button class="btn" type="button" data-speed="1" aria-pressed="true" title="A day in two minutes">1×</button>
      <button class="btn" type="button" data-speed="6" aria-pressed="false">6×</button>
      <button class="btn" type="button" data-speed="40" aria-pressed="false">40×</button>
    </div>
    <span class="grow"></span>
    <button class="btn" id="sound" type="button" aria-pressed="false">Sound off</button>
  </div>
  <div id="scrub"><label for="year">Year <output id="yearout">1890</output></label><input id="year" type="range" min="0" max="7300" step="1" value="0"></div>
</div>

<aside id="log" role="dialog" aria-modal="false" aria-labelledby="logtitle" aria-hidden="true">
  <header><div><h2 id="logtitle">Carra Skerry light</h2><p id="logsub">Keeper's journal</p></div><button class="close" id="closelog" type="button">Close</button></header>
  <div id="logbody" tabindex="0"></div>
</aside>

<script>
(() => {
'use strict';
const WALL = location.hash === '#wallpaper';
if (WALL) document.body.classList.add('wall');
const mqRM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let RM = !!(mqRM && mqRM.matches);
if (mqRM) { const f = e => { RM = e.matches; }; mqRM.addEventListener ? mqRM.addEventListener('change', f) : mqRM.addListener && mqRM.addListener(f); }
const $ = s => document.querySelector(s);

// ---------- helpers
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mulc = (a, m) => [a[0] * m[0], a[1] * m[1], a[2] * m[2]];
const scl = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const c255 = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
const rgba = (c, a = 1) => 'rgba(' + c255(c[0]) + ',' + c255(c[1]) + ',' + c255(c[2]) + ',' + clamp(a).toFixed(3) + ')';
function hash(a, b) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 0x9e37, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const pick = (arr, r) => arr[Math.floor(r() * arr.length) % arr.length];
const pad = n => (n < 10 ? '0' : '') + n;
const fmt = h => { h = ((h % 24) + 24) % 24; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return pad(hh) + ':' + pad(mm); };
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- the light
const LIGHT = { name: 'Carra Skerry', ch: 'Fl(2) W 15s', ht: 42, range: 22, period: 15, gap: 2.2, fog: 'Horn(2) 60s' };
const BEAM_SEP = TAU * LIGHT.gap / LIGHT.period;

// ---------- calendar and sky
const DAY = 864e5, STEP = 7;               // each turn of the sun moves the calendar a week on
const EPOCH = Date.UTC(1890, 8, 20);
const MAXC = Math.floor((Date.UTC(2030, 11, 24) - EPOCH) / (STEP * DAY));
const SEC_PER_DAY = 120;
const cdate = n => new Date(EPOCH + n * STEP * DAY);
const LAT = 58.6 * Math.PI / 180;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const longDate = d => WEEKDAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
const shortDate = d => d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
const sunCache = new Map();
function sunInfo(n) {
  let s = sunCache.get(n); if (s) return s;
  const d = cdate(n), y0 = Date.UTC(d.getUTCFullYear(), 0, 1), dy = (d.getTime() - y0) / DAY;
  const decl = 23.44 * Math.PI / 180 * Math.sin(TAU * (dy - 81) / 365);
  const H0 = Math.acos(clamp(-Math.tan(LAT) * Math.tan(decl), -1, 1));
  const L = H0 * 24 / Math.PI;
  s = { decl, H0, rise: 12.25 - L / 2, set: 12.25 + L / 2, doy: dy, month: d.getUTCMonth(), year: d.getUTCFullYear(), date: d };
  if (sunCache.size > 300) sunCache.clear();
  sunCache.set(n, s); return s;
}
const altOf = (decl, ha) => Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(ha)) * 180 / Math.PI;
const SYNODIC = 29.530588, NEWMOON = Date.UTC(2000, 0, 6, 18, 14);

// ---------- weather
const WX = {
  clear:  { cloud: .3,  wind: 3, fog: 0, rain: 0, snow: 0 },
  calm:   { cloud: .07, wind: 1, fog: 0, rain: 0, snow: 0 },
  cloudy: { cloud: .78, wind: 4, fog: 0, rain: 0, snow: 0 },
  rain:   { cloud: .96, wind: 5, fog: .15, rain: .75, snow: 0 },
  gale:   { cloud: .93, wind: 9, fog: .1, rain: .45, snow: 0 },
  snow:   { cloud: .9,  wind: 5, fog: .2, rain: 0, snow: .85 },
  fog:    { cloud: .4,  wind: 2, fog: 1, rain: 0, snow: 0 }
};
const SEASON_WX = [
  [['clear', .17], ['calm', .05], ['cloudy', .25], ['rain', .15], ['gale', .2], ['snow', .12], ['fog', .06]],
  [['clear', .3], ['calm', .1], ['cloudy', .22], ['rain', .14], ['gale', .07], ['fog', .17]],
  [['clear', .36], ['calm', .16], ['cloudy', .18], ['rain', .1], ['gale', .03], ['fog', .17]],
  [['clear', .22], ['calm', .06], ['cloudy', .24], ['rain', .18], ['gale', .2], ['fog', .1]]
];
const seasonOf = m => (m === 11 || m < 2) ? 0 : m < 5 ? 1 : m < 8 ? 2 : 3;
const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const DIRW = [.07, .07, .08, .08, .12, .24, .22, .12];
function rawTypeS(s) {
  const m = sunInfo(Math.floor(s / 2)).month;
  let x = hash(s, 101);
  for (const [t, pr] of SEASON_WX[seasonOf(m)]) { if ((x -= pr) < 0) return t; }
  return 'cloudy';
}
function segType(s) { if (s < 2) return 'clear'; return hash(s, 57) < 0.5 ? rawTypeS(s - 1) : rawTypeS(s); }
const wxCache = new Map();
function segWx(s) {
  let w = wxCache.get(s); if (w) return w;
  const type = segType(s), b = WX[type];
  let wind = Math.round(b.wind + (hash(s, 31) - .5) * 3);
  wind = clamp(wind, type === 'calm' ? 0 : 1, type === 'gale' ? 11 : 7);
  if (type === 'gale') wind = Math.max(8, wind);
  let x = hash(s, 37), di = 0;
  for (; di < 7; di++) { if ((x -= DIRW[di]) < 0) break; }
  const wave = (type === 'fog' || type === 'calm') ? .04 + wind * .03 : clamp(.06 + Math.pow(wind / 10, 1.5), 0, 1.15);
  const bar = (30.35 - wind * 0.08 - (b.rain + b.snow) * .25 + (hash(s, 41) - .5) * .2).toFixed(2);
  w = { type, wind, dir: DIRS[di], windX: Math.sin(di * Math.PI / 4) || .3, cloud: b.cloud, fog: b.fog, rain: b.rain, snow: b.snow, wave, bar };
  if (wxCache.size > 500) wxCache.clear();
  wxCache.set(s, w); return w;
}
const wx = { cloud: 0, wind: 0, fog: 0, rain: 0, snow: 0, wave: 0, windX: 0, type: 'clear' };
function weatherAt(habs) {
  const s = Math.max(0, Math.floor(habs / 12)), loc = habs - s * 12;
  const a = segWx(s);
  const f = loc < 9 ? 0 : smooth(9, 12, loc);
  const b = f > 0 ? segWx(s + 1) : a;
  for (const k of ['cloud', 'wind', 'fog', 'rain', 'snow', 'wave', 'windX']) wx[k] = lerp(a[k], b[k], f);
  wx.type = f < .5 ? a.type : b.type;
  wx.seg = f < .5 ? a : b;
  return wx;
}

// ---------- people, ships, small events
const KEEPERS = [[1890, 'J. Morrison'], [1919, 'A. Gunn'], [1947, 'D. MacLeod'], [1976, 'R. Sinclair'], [2004, 'E. Sutherland']];
function keeperOf(year) { let k = KEEPERS[0][1]; for (const [y, nm] of KEEPERS) if (year >= y) k = nm; return k; }
const initials = nm => nm.replace(/[^A-Z]/g, '').split('').join('.') + '.';
const MILESTONES = [
  [1891, 4, 'Superintendent landed with the new burner. Brighter by a third, he says.'],
  [1902, 6, 'Telegraph cable brought ashore at the landing. We can speak to the mainland now, after a fashion.'],
  [1915, 2, 'Light reduced by order. A dark coast these nights.'],
  [1919, 1, 'Full light again by order. The coast looks like itself.'],
  [1924, 9, 'Wireless set came with the relief. Heard dance music from London, very faint.'],
  [1940, 3, 'Light dimmed by order. Aircraft about.'],
  [1945, 5, 'Full light again. Stood on the gallery a long while.'],
  [1958, 7, 'Lamp converted to electric. Engines in the old oil store. I miss the smell of the burner.'],
  [1972, 4, 'First relief by helicopter. Landed on the new pad by the wall.'],
  [1988, 8, 'Radar beacon fitted on the gallery.'],
  [2009, 5, 'Solar panels on the store roof. The engines run less.']
];
const NAMES = {
  steamer: [['SS Ardmore', 'SS Clan Ross', 'SS Fulmar', 'SS St Fergus', 'SS Hebridean', 'SS Earl of Caithness', 'SS Copeland', 'SS Norseman', 'SS Kildonan', 'SS Strathy'],
            ['MV Loch Shiel', 'MV Pentland Trader', 'MV Sound of Hoy', 'MV Highland Pride', 'MV Ben Hope', 'MV Nordkyn', 'MV Lerwick Star']],
  tall:    [['barque Loch Carron', 'full-rigger Glenalvon', 'barquentine Hannah Lea', 'barque Margaret Dow', 'full-rigger County of Ross'],
            ['sail training ship Ardent', 'brigantine Spirit of Thurso', 'barque Christiania', 'schooner Ellen Grant']],
  fishing: [['fifie Brighter Hope', 'Zulu boat Morning Star', 'fifie Guide Me', 'drifter Lily of the Valley', 'Zulu boat Fisher Lassie', 'fifie Day Dawn'],
            ['seiner Fortuna', 'trawler Ocean Harvest', 'creel boat Shearwater', 'seiner Good Design', 'trawler Star of Hope', 'creel boat Kittiwake']],
  coaster: [['steam coaster Elsie May', 'puffer Glenrosa', 'steam coaster Thrift', 'steam coaster Pomona'],
            ['MV Elsie May', 'MV Kyle Venture', 'MV Saxon Trader', 'MV Orkney Lass']],
  container: [['Nordic Tern', 'Baltic Clipper', 'Atlantic Ranger', 'Hanse Endeavour', 'Cape Wrath Express', 'North Star Bridge', 'Skagen Trader']]
};
const PORTS_W = ['for the Clyde', 'for Stornoway', 'for Liverpool', 'for Belfast', 'round for the west', 'for Halifax'];
const PORTS_E = ['for Leith', 'for Aberdeen', 'for Bergen', 'for Wick', 'for Hamburg', 'for Kirkwall'];
function eraTypes(y) {
  if (y < 1920) return [['steamer', .34], ['tall', .2], ['fishing', .36], ['coaster', .1]];
  if (y < 1960) return [['steamer', .44], ['tall', .04], ['fishing', .36], ['coaster', .16]];
  if (y < 1980) return [['steamer', .32], ['tall', .04], ['fishing', .34], ['coaster', .2], ['container', .1]];
  return [['steamer', .14], ['tall', .05], ['fishing', .3], ['coaster', .18], ['container', .33]];
}
const SHIPLEN = { steamer: 250, tall: 230, fishing: 64, coaster: 140, container: 430 };
const EVENTS = {
  any: ['Mended the gutter.', 'Cleaned and polished the lens.', 'Whitewashed the boundary wall.', 'Painted the gallery rail.', 'Seal on the landing rock most of the afternoon.',
        'Relief boat landed stores and letters.', 'Relief boat could not land. Heavy swell at the steps.', 'Lost a shirt off the line to the wind.', 'Baked bread. Passable.',
        'Repaired the derrick rope.', 'Wrote home.', 'Mended the garden wall where the sea took it.', 'Inspection by the Superintendent. Found satisfactory.',
        'Polished the brass. Again.', 'Porpoises off the south side.', 'Otter on the landing at first light.', 'Cleaned the lantern glass inside and out.',
        'Rehung the storm door.', 'Gannets diving west of the reef.', 'Read the almanac twice over.', 'Mended a pane in the cottage window.', 'Fiddle out after supper.'],

  const vis = env.day * (1 - wx.fog * .8) * (1 - clamp(wx.wind - 7, 0, 3) / 4);
  if (vis < .05) return;
  const st = sunInfo(cyc);
  const n = st.month >= 3 && st.month <= 7 ? 8 : 4;
  ctx.strokeStyle = rgba(mixc(ambC([238, 240, 240]), env.top, .1), vis);
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const g = GULLS[i];
    const a = g.a + T * g.w * g.sp;
    const x = IX + Math.cos(a) * g.rx * IS * (1 + wx.windX * .1) + Math.sin(T * .3 + i) * 30 * IS;
    const y = IY + g.cy * IS + Math.sin(a * 2) * g.ry * IS * .4;
    const sz = 9 * g.sz * IS * 1.2;
    const flap = Math.sin(T * (5 + i) + g.ph);
    const glide = Math.sin(T * .4 + i) > .2 ? .25 : 1;
    const f = flap * glide;
    ctx.lineWidth = Math.max(1, sz * .16);
    ctx.beginPath();
    ctx.moveTo(x - sz, y - f * sz * .5);
    ctx.quadraticCurveTo(x - sz * .45, y - sz * .35 - f * sz * .2, x, y);
    ctx.quadraticCurveTo(x + sz * .45, y - sz * .35 - f * sz * .2, x + sz, y - f * sz * .5);
    ctx.stroke();
  }
}

// ---------- fog banks
function fogWash(a) {
  if (a < .01) return;
  ctx.fillStyle = rgba(env.fogc, a);
  ctx.fillRect(0, 0, W, H);
}
function fogBanks() {
  const f = wx.fog; if (f < .05) return;
  for (let k = 0; k < 5; k++) {
    const x = ((k * .27 + T * .006 * (1 + k * .3) * env.windDir) % 1.4 + 1.4) % 1.4 * W * 1.1 - W * .25;
    const y = HZ + (k - 2) * H * .06;
    const rx = W * (.35 + k * .04), ry = H * (.1 + (k % 2) * .06);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
    g.addColorStop(0, rgba(env.fogc, f * .32)); g.addColorStop(1, rgba(env.fogc, 0));
    ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y);
    ctx.fillStyle = g; ctx.fillRect(x - rx, y - rx, rx * 2, rx * 2);
    ctx.restore();
  }
}

// ---------- the beam
let lensAngle = 0;
function drawBeam() {
  const vis = env.lampVis;
  flashNow = 0;
  if (vis < .01) return;
  const base = .045 + wx.fog * .3 + (wx.rain + wx.snow) * .12 + wx.cloud * .03;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  let flash = 0;
  for (const off of [0, BEAM_SEP]) {
    const th = lensAngle + off, c = Math.cos(th), sn = Math.sin(th);
    flash += Math.pow(Math.max(0, sn), 40);
    const side = c >= 0 ? 1 : -1;
    const len = Math.max(W, 900) * 1.3 * (.12 + .88 * Math.abs(c));
    const spread = .03 + .2 * Math.pow(Math.max(0, sn), 3);
    const a = base * vis * (.4 + .6 * (sn + 1) / 2) * (.6 + .4 * Math.abs(c));
    const ex = LX + side * len, ey = LY + (HZ - LY) * .3 * Math.abs(c);
    const g = ctx.createLinearGradient(LX, LY, ex, ey);
    g.addColorStop(0, rgba([255, 240, 206], a)); g.addColorStop(.35, rgba([255, 236, 200], a * .45)); g.addColorStop(1, rgba([255, 236, 200], 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(LX, LY - 2.5 * IS * 4); ctx.lineTo(ex, ey - len * spread); ctx.lineTo(ex, ey + len * spread); ctx.lineTo(LX, LY + 2.5 * IS * 4); ctx.closePath(); ctx.fill();
  }
  flash = Math.min(1, flash);
  flashNow = flash * vis;
  // steady glow of the lamp
  const r0 = 26 * IS * 2;
  let g = ctx.createRadialGradient(LX, LY, 0, LX, LY, r0);
  g.addColorStop(0, rgba([255, 244, 214], .55 * vis)); g.addColorStop(1, 'rgba(255,240,210,0)');
  ctx.fillStyle = g; ctx.fillRect(LX - r0, LY - r0, r0 * 2, r0 * 2);
  if (flash > .01) {
    const R = (40 + 300 * flash) * Math.max(.7, IS);
    g = ctx.createRadialGradient(LX, LY, 0, LX, LY, R);
    g.addColorStop(0, rgba([255, 252, 236], vis * flash)); g.addColorStop(.12, rgba([255, 240, 200], vis * flash * .5)); g.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = g; ctx.fillRect(LX - R, LY - R, R * 2, R * 2);
    ctx.fillStyle = rgba([255, 246, 220], vis * flash * .5);
    ctx.beginPath(); ctx.ellipse(LX, LY, R * 1.6, 1.4 + flash * 2, 0, 0, TAU); ctx.fill();
    if (wx.fog > .1 || wx.rain > .2) { ctx.fillStyle = rgba([255, 236, 200], vis * flash * .06 * (wx.fog + wx.rain)); ctx.fillRect(0, 0, W, H); }
  }
  ctx.restore();
}
function drawFlareSymbol() {
  // Admiralty chart light flare: magenta teardrop from the light
  if (!needsHint) return;
  const pulse = RM ? .85 : .55 + .45 * Math.sin(T * 3);
  ctx.save(); ctx.translate(LX, LY); ctx.rotate(-Math.PI * .78);
  const L = 70 * Math.max(.75, IS);
  ctx.fillStyle = 'rgba(196,48,127,' + (.75 * pulse).toFixed(3) + ')';
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(L * .2, -L * .28, L * .95, -L * .26, L, 0);
  ctx.bezierCurveTo(L * .95, L * .26, L * .2, L * .28, 0, 0);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(240,124,187,' + (.9 * pulse).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(LX, LY, 3.5, 0, TAU); ctx.fill();
}

// ---------- frame
function drawVignette() {
  const g = ctx.createRadialGradient(W * .55, H * .5, Math.min(W, H) * .35, W * .55, H * .5, Math.max(W, H) * .8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,6,10,' + (.32 + (1 - env.day) * .2).toFixed(3) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeEnv();
  WP = waveParams();
  lensAngle = (performance.now() / 1000 % LIGHT.period) / LIGHT.period * TAU + 1.1;
  drawSky();
  drawClouds();
  // haze at the horizon
  const hg = ctx.createLinearGradient(0, HZ - H * .08, 0, HZ + 4);
  hg.addColorStop(0, rgba(env.hor, 0)); hg.addColorStop(1, rgba(env.hor, .55));
  ctx.fillStyle = hg; ctx.fillRect(0, HZ - H * .08, W, H * .08 + 4);
  drawGulls();
  const objs = [];
  objs.push({ p: .15, fn: () => fogWash(wx.fog * .45) });
  objs.push({ p: P_SK, fn: drawSkerry });
  objs.push({ p: P_IS, fn: () => { drawIsland(); drawSmoke(); fogWash(wx.fog * .22); drawSpray(); } });
  shipObjects(objs);
  objs.sort((a, b) => a.p - b.p);
  let oi = 0;
  ctx.lineJoin = 'round';
  for (let i = 0; i <= ROWS; i++) {
    const p = rowP(i);
    while (oi < objs.length && objs[oi].p < p) { objs[oi].fn(); oi++; }
    drawRow(i, p);
  }
  while (oi < objs.length) { objs[oi].fn(); oi++; }
  fogBanks();
  drawBeam();
  drawPrecip(dt);
  drawFlareSymbol();
  drawVignette();
}

// ---------- clock and UI
const elDate = $('#date'), elTime = $('#time'), elWx = $('#wx'), elYear = $('#year'), elYearOut = $('#yearout');
elYear.max = MAXC;
let lastClock = '', scrubbing = false;
function updateClock(force) {
  const t = fmt(hour);
  if (!force && t === lastClock) return;
  lastClock = t;
  const d = cdate(cyc);
  elDate.textContent = shortDate(d);
  elTime.textContent = t;
  const s = wx.seg || segWx(Math.floor(habs / 12));
  elWx.textContent = s.wind <= 1 ? 'Calm' : { fog: 'Fog', gale: 'Gale', rain: 'Rain', snow: 'Snow', cloudy: 'Overcast', clear: 'Fair', calm: 'Calm' }[s.type] + ', wind ' + s.dir + ' ' + s.wind;
  if (!scrubbing) { elYear.value = cyc; elYearOut.textContent = d.getUTCFullYear(); }
  if (tipOpen) renderTip();
}
let tipOpen = false;
function renderTip() {
  const st = sunInfo(cyc);
  const oil = st.year < 1958;
  let state;
  if (lamp.on) state = 'Lit at ' + fmt(lamp.litAt) + '. ' + (oil ? 'Paraffin burner, wick trimmed.' : 'Electric lamp.');
  else if (canLight()) state = oil ? 'Unlit. Click the lantern to trim the wick and light it.' : 'Unlit. Click the lantern to switch it on.';
  else state = 'Curtains drawn for the day. Lighting-up time ' + fmt(st.set) + '.';
  elTip.innerHTML = '<b>Carra Skerry</b><span class="ch">' + LIGHT.ch + ' ' + LIGHT.ht + 'm ' + LIGHT.range + 'M</span>' +
    'Two white flashes every 15 seconds, ' + LIGHT.ht + ' m above high water, seen ' + LIGHT.range + ' sea miles off. Fog signal ' + LIGHT.fog + '.' +
    '<span class="st">' + state + '</span>';
  const tw = Math.min(270, W - 32);
  let x = LX - tw - 34; if (x < 16) x = Math.min(W - tw - 16, LX + 34);
  let y = LY - 40; y = clamp(y, 16, H - 260);
  elTip.style.left = x + 'px'; elTip.style.top = y + 'px';
}
function showTip(v) { tipOpen = v; if (v) renderTip(); elTip.classList.toggle('show', v); }
elLantern.addEventListener('mouseenter', () => showTip(true));
elLantern.addEventListener('mouseleave', () => { if (document.activeElement !== elLantern) showTip(false); });
elLantern.addEventListener('focus', () => showTip(true));
elLantern.addEventListener('blur', () => showTip(false));
elLantern.addEventListener('click', () => {
  if (canLight()) { light('you'); renderTip(); }
  else showTip(true);
  if (!tipOpen) showTip(true);
});
cv.addEventListener('click', e => {
  if (Math.hypot(e.clientX - LX, e.clientY - LY) < Math.max(60, 80 * IS) && canLight()) light('you');
  else showTip(false);
});
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
}));
$('#openlog').addEventListener('click', () => openLog(!logOpen));
$('#closelog').addEventListener('click', () => openLog(false));
elSlip.addEventListener('click', () => openLog(true));
elYear.addEventListener('input', () => {
  scrubbing = true;
  const n = +elYear.value;
  elYearOut.textContent = cdate(n).getUTCFullYear();
  cyc = n; habs = cyc * 24 + hour;
  special = null;
  const st = sunInfo(cyc);
  const night = hour < st.rise || hour >= st.set - .6;
  lamp.on = night; lamp.level = night ? 1 : 0;
  elDate.textContent = shortDate(cdate(n));
  planNow = plan(cyc); evPtr = 0;
  while (evPtr < planNow.ev.length && planNow.ev[evPtr].h <= hour) evPtr++;
});
elYear.addEventListener('change', () => { scrubbing = false; jump(+elYear.value, hour); save(); });
const markInput = () => { lastInput = performance.now(); };
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(t => window.addEventListener(t, markInput, { passive: true }));
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (logOpen) openLog(false); showTip(false); }
  else if ((e.key === 'l' || e.key === 'L') && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') { if (canLight()) light('you'); }
});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------- sound: sea, wind, rain, gulls, the fog signal
const snd = { ac: null, on: false, master: null, verb: null, nextHorn: 0, nextGull: 0, lastSurf: 0, upd: 0 };
function audioInit() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const ac = new AC(); snd.ac = ac;
  const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); snd.master = master;
  const len = ac.sampleRate * 3;
  const white = ac.createBuffer(1, len, ac.sampleRate), brown = ac.createBuffer(1, len, ac.sampleRate);
  const dw = white.getChannelData(0), db = brown.getChannelData(0);
  let b = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; dw[i] = w; b = (b + .02 * w) / 1.02; db[i] = b * 3.2; }
  snd.white = white;
  const bed = (buf, type, f, q) => {
    const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0;
    s.connect(fl); fl.connect(g); g.connect(master); s.start(0, Math.random() * 2.5);
    return { fl, g };
  };
  snd.sea = bed(brown, 'lowpass', 380, .6);
  snd.wash = bed(white, 'bandpass', 900, .4);
  snd.wind = bed(white, 'bandpass', 500, 5);
  snd.rain = bed(white, 'highpass', 3200, .7);
  // a little distance for the horn and the birds
  const d = ac.createDelay(1); d.delayTime.value = .31;
  const fb = ac.createGain(); fb.gain.value = .32;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
  snd.verb = d;
  return true;
}
function setSound(on) {
  if (on && !snd.ac && !audioInit()) return;
  snd.on = on;
  const el = $('#sound');
  el.setAttribute('aria-pressed', on ? 'true' : 'false');
  el.textContent = on ? 'Sound on' : 'Sound off';
  if (!snd.ac) return;
  if (on && snd.ac.resume) snd.ac.resume();
  snd.master.gain.setTargetAtTime(on ? .85 : 0, snd.ac.currentTime, .4);
  snd.nextHorn = 0;
}
$('#sound').addEventListener('click', () => setSound(!snd.on));
function audioUpdate(dt) {
  if (!snd.on || !snd.ac) return;
  snd.upd += dt; if (snd.upd < .1) return; snd.upd = 0;
  const ac = snd.ac, t = ac.currentTime;
  const swell = .5 + .5 * Math.sin(T * TAU / (6 + wx.wave * 3));
  snd.sea.g.gain.setTargetAtTime((.2 + wx.wave * .4) * (.55 + .45 * swell), t, .25);
  snd.sea.fl.frequency.setTargetAtTime(240 + wx.wave * 420 * swell, t, .3);
  snd.wash.g.gain.setTargetAtTime((.012 + wx.wave * .05) * Math.pow(swell, 3), t, .3);
  snd.wind.g.gain.setTargetAtTime(clamp((wx.wind - 1.5) / 9) * .14 * (.7 + .3 * env.gust), t, .3);
  snd.wind.fl.frequency.setTargetAtTime(360 + wx.wind * 70 + env.gust * 180, t, .3);
  snd.rain.g.gain.setTargetAtTime(wx.rain * .07 + wx.snow * .012, t, .5);
  const nowS = performance.now() / 1000;
  if (wx.fog > .45) {
    if (snd.nextHorn < nowS) { horn(t + .1); horn(t + 4.1); snd.nextHorn = nowS + 60; }
  } else if (wx.fog < .3) snd.nextHorn = 0;
  if (env.day > .5 && wx.fog < .6 && wx.wind < 8 && nowS > snd.nextGull) {
    if (snd.nextGull) gull();
    snd.nextGull = nowS + 5 + Math.random() * 15;
  }
}
function horn(t) {
  const ac = snd.ac;
  const g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 460; f.Q.value = 1.4;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.type = 'sawtooth'; o2.type = 'square';
  for (const [o, f0] of [[o1, 98], [o2, 98.7]]) {
    o.frequency.setValueAtTime(f0, t); o.frequency.setValueAtTime(f0, t + 1.9); o.frequency.exponentialRampToValueAtTime(f0 * .72, t + 2.5);
    o.connect(f); o.start(t); o.stop(t + 2.8);
  }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .25); g.gain.setValueAtTime(.2, t + 1.9); g.gain.exponentialRampToValueAtTime(.001, t + 2.7);
  f.connect(g); g.connect(snd.master); g.connect(snd.verb);
}
function gull() {
  const ac = snd.ac, t = ac.currentTime + .05;
  const n = 2 + (Math.random() * 3 | 0);
  const out = ac.createGain(); out.gain.value = .55; out.connect(snd.master); out.connect(snd.verb);
  for (let i = 0; i < n; i++) {
    const t0 = t + i * (.26 + Math.random() * .12), base = 1000 + Math.random() * 260;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 2.5;
    o.frequency.setValueAtTime(base, t0); o.frequency.linearRampToValueAtTime(base * 1.5, t0 + .07); o.frequency.exponentialRampToValueAtTime(base * .78, t0 + .24);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.05, t0 + .03); g.gain.exponentialRampToValueAtTime(.001, t0 + .26);
    o.connect(f); f.connect(g); g.connect(out); o.start(t0); o.stop(t0 + .3);
  }
}
function noiseShot(t, dur, f0, f1, peak) {
  const ac = snd.ac;
  const s = ac.createBufferSource(); s.buffer = snd.white;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(snd.master);
  s.start(t, Math.random() * 2); s.stop(t + dur + .1);
}
function sfx(kind, k = 1) {
  if (!snd.on || !snd.ac) return;
  const t = snd.ac.currentTime;
  if (kind === 'surf') {
    if (t - snd.lastSurf < .7) return;
    snd.lastSurf = t;
    noiseShot(t, 1.4 + k * 1.4, 2600, 380, .13 * k);
  } else if (kind === 'light') {
    // a click of the brass, then the burner taking
    const o = snd.ac.createOscillator(), g = snd.ac.createGain();
    o.type = 'sine'; o.frequency.value = 2350;
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.connect(g); g.connect(snd.master); o.start(t); o.stop(t + .4);
    noiseShot(t + .15, 1.2, 1400, 300, .05);
  }
}

// ---------- simulation step
function step(dt) {
  const st = sunInfo(cyc);
  const idle = performance.now() - lastInput > IDLE_GRACE;
  const auto = WALL || speed > 1 || idle;
  let rate = speed;
  needsHint = false;
  if (evening.phase === 'window' && !auto && !lamp.on) { rate *= .5; needsHint = true; }
  hour += dt * 24 / SEC_PER_DAY * rate;
  while (hour >= 24) { hour -= 24; newCycle(); }
  habs = cyc * 24 + hour;
  // scheduled log lines
  const p = planNow || plan(cyc);
  while (evPtr < p.ev.length && p.ev[evPtr].h <= hour) {
    const e = p.ev[evPtr++];
    if (e.k === 'lit' || e.k === 'ext') continue;
    addLine(e.h, e.s);
  }
  for (let i = pending.length - 1; i >= 0; i--) {
    const q = pending[i];
    if (cyc > q.n || (cyc === q.n && hour >= q.h)) {
      pending.splice(i, 1);
      addLine(hour, q.s, 'x');
      if (q.act === 'refloat' && special && special.state === 'aground') { special.state = 'refloat'; special.t0 = habs; special.x0 = special.x; }
    }
  }
  // lamp
  if (lamp.on && hour >= st.rise && hour < st.set - 1) { lamp.on = false; addLine(hour, 'Extinguished.', 'ext'); keeperFig.walk = 0; }
  if (evening.phase === 'day' && hour >= st.set - .6) evening.phase = lamp.on ? 'done' : 'window';
  if (evening.phase === 'window') {
    if (lamp.on) evening.phase = 'done';
    else if (auto) { if (hour >= st.set + evening.autoDelay) light('keeper'); }
    else {
      if (!evening.tried && hour >= st.set - .4) {
        evening.tried = true;
        if (cyc !== firstCycle && hash(cyc, 555) < .55 && !special) spawnSpecial();
      }
      if (hour >= st.set + 1.6) light('late');
    }
  }
  const target = lamp.on ? 1 : 0;
  lamp.level += (target - lamp.level) * Math.min(1, dt * (target ? 1.4 : 3));
  cloudOff += dt * .0035 * (.4 + wx.wind * .22) * Math.sign(wx.windX || 1) * (RM ? .5 : 1);
  updateParticles(dt);
  audioUpdate(dt);
  elHint.classList.toggle('show', needsHint);
  elLantern.setAttribute('aria-label', canLight() ? 'Light the lamp' : 'The lantern');
  updateClock(false);
}

// ---------- boot
resize();
const saved = WALL ? null : store.get('carra-skerry-v1');
let startC = 0;
if (saved && typeof saved.cyc === 'number') { startC = clamp(saved.cyc | 0, 0, MAXC); dyn = saved.dyn || {}; }
firstCycle = startC;
jump(startC, sunInfo(startC).set - 1.05);
render(0);
let last = performance.now(), lastDraw = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (WALL && now - lastDraw < 1000 / 30 - 2) return;
  lastDraw = now;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  T += dt * (RM ? .6 : 1);
  step(dt);
  render(dt);
}
requestAnimationFrame(loop);
})();
</script>
