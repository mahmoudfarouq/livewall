<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tawaf</title>
<style>
/* The mataf fills the screen. A quiet caption sits bottom left, three soft controls bottom right,
   and when you walk with someone, their circuit shows at the top centre. */
:root{
  color-scheme: dark;
  --marble:#ece8df;     /* the mataf floor */
  --kiswah:#0b0b0c;     /* the cloth of the Kaaba */
  --gold:#d2b06a;       /* the band and the door */
  --dusk:#25324f;       /* blue hour over the Haram */
  --ink:#f7f2e7;
  --ink-soft:rgba(247,242,231,.78);
  --rule:rgba(247,242,231,.32);
  --btn:rgba(16,18,26,.34);
  --btn-hover:rgba(16,18,26,.55);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--dusk);overscroll-behavior:none}
body{font-family:"Amiri",Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(10,12,22,0) 55%,rgba(10,12,22,.32) 100%)}
.ui,.count{z-index:2}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  padding:48px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  pointer-events:none;transition:opacity 1.4s ease;
  background:linear-gradient(to top,rgba(8,10,18,.55),rgba(8,10,18,.22) 55%,rgba(8,10,18,0))}
.ui.dim{opacity:.3}
.ui:focus-within{opacity:1}
.ui[hidden]{display:none}
.caption h1{margin:0;font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.05;letter-spacing:.01em;
  text-shadow:0 1px 14px rgba(0,0,0,.45)}
.caption p{margin:4px 0 0;font-size:16px;line-height:1.4;color:var(--ink);opacity:.86;max-width:34ch;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.controls button{font:inherit;font-size:16px;line-height:1;color:var(--ink);background:var(--btn);
  border:1px solid var(--rule);border-radius:999px;padding:11px 17px 10px;min-height:42px;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s ease,border-color .2s ease}
.controls button:hover{background:var(--btn-hover);border-color:var(--ink-soft)}
.controls button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(210,176,106,.35)}
.controls button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.count{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 22px 13px;border-radius:28px;
  background:rgba(14,16,24,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none;
  transition:opacity 1.2s ease;opacity:1}
.count.out{opacity:0}
.count[hidden]{display:none}
.count .num{font-size:34px;line-height:1;font-weight:400;text-shadow:0 1px 12px rgba(0,0,0,.5);min-height:34px}
.count .dots{display:flex;gap:7px}
.count .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink-soft);box-sizing:border-box}
.count .dots i.done{background:var(--ink);border-color:var(--ink)}
.count .dots i.now{background:var(--gold);border-color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:18px;color:var(--ink-soft)}
.fallback[hidden]{display:none}
@media (max-width:560px){
  .ui{flex-direction:column;align-items:stretch;gap:12px}
  .controls{justify-content:flex-start}
  .caption p{font-size:15px}
  .controls button{font-size:15px;padding:10px 14px 9px}
}
@media (prefers-reduced-motion:reduce){ .ui,.count{transition:none} .controls button{transition:none} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="vignette" aria-hidden="true"></div>
<main id="stage" aria-label="Pilgrims walking around the Kaaba in the Masjid al-Haram, seen from above"></main>
<div class="count" id="count" hidden>
  <span class="num" id="num" aria-hidden="true"></span>
  <span class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  <span class="sr" id="countSr" aria-live="polite"></span>
</div>
<div class="ui" id="ui">
  <div class="caption">
    <h1>Tawaf</h1>
    <p id="note">The mataf in Makkah. Tap someone to walk beside them.</p>
  </div>
  <div class="controls">
    <button type="button" id="exp" aria-pressed="false">Long exposure</button>
    <button type="button" id="light">Makkah time</button>
    <button type="button" id="snd" aria-pressed="false">Sound</button>
  </div>
</div>
<p class="fallback" id="fallback" hidden>This piece needs WebGL to draw the mataf.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const WALL = location.hash === '#wallpaper';
const Q = new URLSearchParams(location.search);       // for looking at a fixed moment: ?hour=17&el=89&az=0&long=1&follow=1&keep=1
const rmq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = rmq.matches;
try { rmq.addEventListener('change', e => { reduced = e.matches; }); } catch (e) { try { rmq.addListener(e => { reduced = e.matches; }); } catch (_) {} }

const store = {
  get(k){ try { return localStorage.getItem('tawaf:' + k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem('tawaf:' + k, v); } catch (e) {} }
};

const ui = document.getElementById('ui');
const stage = document.getElementById('stage');
function fail(){ document.getElementById('fallback').hidden = false; ui.hidden = true; }
if (!window.THREE) { fail(); return; }

const TAU = Math.PI * 2;
const coarse = matchMedia('(pointer: coarse)').matches;
const smallScreen = Math.min(screen.width, screen.height) < 700;
const LOW = coarse || smallScreen;
const NMAX = LOW ? 3000 : 5000;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const lin = h => new THREE.Color(h).convertSRGBToLinear();

// ---------------------------------------------------------------------------
// The place. World x is east, world -z is north, the Kaaba sits at the origin.
// Its corners point roughly to the compass: the Black Stone east, the Iraqi corner north,
// the Shami corner west, the Yemeni corner south. Local axes: p along the north-east
// normal (the door face), q along the north-west normal (the Hijr face).
// ---------------------------------------------------------------------------
const KH = 13.1, HA = 5.1, HB = 6.0;           // height, half depth along p, half length of the door face
const AX = Math.SQRT1_2, AZ = -Math.SQRT1_2;   // north-east
const BX = -Math.SQRT1_2, BZ = -Math.SQRT1_2;  // north-west
const HC = HB + 1.2, HEA = 5.3, HEB = 7.0, HT = 1.5, HH = 1.31; // Hijr Ismail: start, inner semi-axes, thickness, height
const toWorld = (p, q) => [p * AX + q * BX, p * AZ + q * BZ];
const [MQX, MQZ] = toWorld(HA + 10.8, -2.4);   // Maqam Ibrahim, in front of the door face
const [BSX, BSZ] = toWorld(HA, -HB);           // the Black Stone corner
const TH0 = Math.atan2(-BSZ, BSX);             // the line level with it
const R_COL = 46, R_OUT = 56, ROOF = 10.3, SPAWN_R = 50.5;

// distance to the Kaaba and the Hijr wall (treated as solid, as walkers go round it)
function sdf(x, z){
  const p = x * AX + z * AZ, q = x * BX + z * BZ;
  const dx = Math.abs(p) - (HA + 0.45), dq = Math.abs(q) - (HB + 0.45);
  const box = Math.hypot(Math.max(dx, 0), Math.max(dq, 0)) + Math.min(Math.max(dx, dq), 0);
  const ea = HEA + HT + 0.2, eb = HEB + HT + 0.2;
  const qq = Math.max(q - HC, 0), k = Math.hypot(p / ea, qq / eb);
  const r = Math.hypot(p, qq);
  const e = k > 1e-5 ? r * (k - 1) / k : -Math.min(ea, eb);
  const hijr = Math.max(e, (HB - 0.5) - q);
  return Math.min(box, hijr);
}
let GX = 0, GZ = 0;
function grad(x, z){
  const h = 0.2;
  let gx = sdf(x + h, z) - sdf(x - h, z), gz = sdf(x, z + h) - sdf(x, z - h);
  const l = Math.hypot(gx, gz) || 1;
  GX = gx / l; GZ = gz / l;
}

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) { fail(); return; }
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.setAttribute('aria-hidden', 'true');
let lost = false;
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; });
renderer.domElement.addEventListener('webglcontextrestored', () => location.reload());

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x888888, 240, 760);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 2000);

// ---------------------------------------------------------------------------
// textures, drawn once
// ---------------------------------------------------------------------------
function canvasTex(w, h, draw, srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

// the gold band: an abstract geometric border, no lettering
function drawBand(g, x, y, w, h){
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, '#7a5a26'); gr.addColorStop(.18, '#d1ad5f'); gr.addColorStop(.5, '#ead08e');
  gr.addColorStop(.82, '#d1ad5f'); gr.addColorStop(1, '#7a5a26');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  const m = Math.round(h * .17), ih = h - 2 * m;
  g.fillStyle = '#17120a'; g.fillRect(x, y + m, w, ih);
  g.fillStyle = gr;
  const cell = ih;
  let k = 0;
  for (let cx = x; cx < x + w; cx += cell, k++){
    const mx = cx + cell / 2, my = y + m + ih / 2;
    if (k % 6 === 5){ g.fillRect(cx + cell * .44, y + m + 2, cell * .12, ih - 4); continue; }
    g.beginPath();
    g.moveTo(mx, my - ih * .4); g.lineTo(mx + cell * .4, my); g.lineTo(mx, my + ih * .4); g.lineTo(mx - cell * .4, my); g.closePath();
    g.fill();
    g.fillStyle = '#17120a';
    g.beginPath();
    g.moveTo(mx, my - ih * .22); g.lineTo(mx + cell * .22, my); g.lineTo(mx, my + ih * .22); g.lineTo(mx - cell * .22, my); g.closePath();
    g.fill();
    g.fillStyle = gr;
    g.beginPath(); g.arc(mx, my, ih * .08, 0, TAU); g.fill();
    g.beginPath(); g.arc(cx, y + m + ih * .18, ih * .05, 0, TAU); g.arc(cx, y + m + ih * .82, ih * .05, 0, TAU); g.fill();
  }
}
const kiswahTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#0c0c0d'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,0.03)'; g.lineWidth = 2;
  for (let k = -w; k < 2 * w; k += 40){
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke();
    g.beginPath(); g.moveTo(k, h); g.lineTo(k + h, 0); g.stroke();
  }
  // band about two-thirds up: 8.6 m to 9.55 m of 13.1 m
  const y0 = Math.round((1 - 9.55 / KH) * h), y1 = Math.round((1 - 8.6 / KH) * h);
  drawBand(g, 0, y0, w, y1 - y0);
});
const roofTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#131313'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#181818'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
});
// the door and the curtain over it: gold geometry on black
const doorTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#0c0c0d'; g.fillRect(0, 0, w, h);
  const gold = g.createLinearGradient(0, 0, w, 0);
  gold.addColorStop(0, '#a9853f'); gold.addColorStop(.5, '#ecd38f'); gold.addColorStop(1, '#a9853f');
  g.strokeStyle = gold; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
  g.lineWidth = 2; g.strokeRect(22, 22, w - 44, h - 44);
  g.fillStyle = gold;
  for (let y = 40; y < 190; y += 26) for (let x = 40 + ((y / 26) % 2) * 13; x < w - 30; x += 26){
    g.beginPath(); g.moveTo(x, y - 9); g.lineTo(x + 9, y); g.lineTo(x, y + 9); g.lineTo(x - 9, y); g.closePath(); g.fill();
  }
  // the door itself, two leaves
  const dx = 53, dy = 206, dw = 150, dh = 256;
  const dg = g.createLinearGradient(dx, 0, dx + dw, 0);
  dg.addColorStop(0, '#b58f45'); dg.addColorStop(.5, '#f0d996'); dg.addColorStop(1, '#b58f45');
  g.fillStyle = dg; g.fillRect(dx, dy, dw, dh);
  g.strokeStyle = 'rgba(80,58,20,.7)'; g.lineWidth = 3;
  g.strokeRect(dx + 6, dy + 6, dw - 12, dh - 12);
  g.beginPath(); g.moveTo(dx + dw / 2, dy); g.lineTo(dx + dw / 2, dy + dh); g.stroke();
  g.fillStyle = 'rgba(90,64,22,.55)';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++){
    g.beginPath(); g.arc(dx + 20 + c * 37, dy + 26 + r * 40, 6, 0, TAU); g.fill();
  }
  g.fillStyle = gold;
  for (let x = 40; x < w - 30; x += 26){
    g.beginPath(); g.moveTo(x, 480 - 8); g.lineTo(x + 8, 480); g.lineTo(x, 488); g.lineTo(x - 8, 480); g.closePath(); g.fill();
  }
});
// white marble, laid in slabs, with faint veins
const MARBLE_R = 56;
const marbleTex = canvasTex(LOW ? 1024 : 2048, LOW ? 1024 : 2048, (g, w, h) => {
  g.fillStyle = '#efece6'; g.fillRect(0, 0, w, h);
  const ppm = w / (2 * MARBLE_R), slab = 1.25 * ppm;
  for (let y = 0; y < h; y += slab) for (let x = 0; x < w; x += slab){
    const v = Math.random();
    g.fillStyle = v < .5 ? `rgba(255,255,255,${(.5 - v) * .5})` : `rgba(160,150,138,${(v - .5) * .09})`;
    g.fillRect(x, y, slab, slab);
  }
  g.strokeStyle = 'rgba(140,130,118,0.16)'; g.lineWidth = 1;
  g.beginPath();
  for (let x = 0; x < w; x += slab){ g.moveTo(x, 0); g.lineTo(x, h); }
  for (let y = 0; y < h; y += slab){ g.moveTo(0, y); g.lineTo(w, y); }
  g.stroke();
  for (let k = 0; k < 260; k++){
    g.strokeStyle = `rgba(150,146,142,${rnd(.03, .09)})`; g.lineWidth = rnd(.6, 1.6);
    let x = rnd(0, w), y = rnd(0, h);
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 4; s++){ const nx = x + rnd(-40, 40), ny = y + rnd(-40, 40); g.quadraticCurveTo(x + rnd(-25, 25), y + rnd(-25, 25), nx, ny); x = nx; y = ny; }
    g.stroke();
  }
});
// the inner face of the colonnade: pointed arches
const BAYS = 72;
const facadeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e8dfcf'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(120,100,80,.18)'; g.fillRect(0, 0, w, 7); g.fillRect(0, 13, w, 2);
  const arch = () => { g.beginPath(); g.moveTo(42, h); g.lineTo(42, 112); g.quadraticCurveTo(42, 44, 128, 26); g.quadraticCurveTo(214, 44, 214, 112); g.lineTo(214, h); g.closePath(); };
  g.strokeStyle = 'rgba(130,104,78,.45)'; g.lineWidth = 12; arch(); g.stroke();
  g.strokeStyle = 'rgba(255,250,240,.6)'; g.lineWidth = 3; arch(); g.stroke();
  g.globalCompositeOperation = 'destination-out'; arch(); g.fill(); g.globalCompositeOperation = 'source-over';
});
facadeTex.wrapS = THREE.RepeatWrapping; facadeTex.repeat.set(BAYS, 1);

// ---------------------------------------------------------------------------
// the Kaaba, the Hijr, the Maqam
// ---------------------------------------------------------------------------
const std = (o) => new THREE.MeshStandardMaterial(o);
const goldMat = std({ color: lin('#c9a24e'), roughness: .38, metalness: .35, emissive: lin('#3a2a0c'), emissiveIntensity: .25 });
const marbleWhite = std({ color: lin('#f1eee8'), roughness: .5 });
const kaaba = new THREE.Group();
kaaba.rotation.y = Math.PI / 4;           // local +x is north-east (p), local -z is north-west (q)
scene.add(kaaba);
{
  const side = std({ map: kiswahTex, roughness: .82, metalness: 0 });
  const roof = std({ map: roofTex, roughness: .9 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(2 * HA, KH, 2 * HB), [side, side, roof, side, side, side]);
  box.position.y = KH / 2; box.castShadow = true; box.receiveShadow = true;
  kaaba.add(box);
  const shad = new THREE.Mesh(new THREE.BoxGeometry(2 * HA + .8, .32, 2 * HB + .8), std({ color: lin('#ddd7cd'), roughness: .5 }));
  shad.position.y = .16; shad.receiveShadow = true; shad.castShadow = true; kaaba.add(shad);
  // door and curtain on the north-east face, nearer the Black Stone corner
  const door = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 6.2), std({ map: doorTex, roughness: .55, metalness: .15 }));
  door.rotation.y = Math.PI / 2; door.position.set(HA + .04, 4.7, 3.0); kaaba.add(door);
  // the Black Stone, in its silver frame, at the east corner
  const frame = new THREE.Mesh(new THREE.TorusGeometry(.27, .085, 10, 28), std({ color: lin('#d9dde0'), roughness: .25, metalness: .6, emissive: lin('#30343a'), emissiveIntensity: .4 }));
  frame.rotation.y = Math.PI / 4; frame.scale.set(1, 1.3, 1); frame.position.set(HA + .1, 1.5, HB + .1); kaaba.add(frame);
  const stone = new THREE.Mesh(new THREE.CircleGeometry(.22, 20), std({ color: lin('#2a1f1b'), roughness: .3 }));
  stone.rotation.y = Math.PI / 4; stone.scale.set(1, 1.3, 1); stone.position.set(HA + .07, 1.5, HB + .07); kaaba.add(stone);
  // the golden spout over the Hijr
  const mizab = new THREE.Mesh(new THREE.BoxGeometry(.32, .22, 1.6), goldMat);
  mizab.position.set(0, KH - .3, -(HB + .7)); mizab.castShadow = true; kaaba.add(mizab);
  // Hijr Ismail: a low white semicircular wall on the north-west side
  const s = new THREE.Shape(), N = 56;
  for (let k = 0; k <= N; k++){ const t = k / N * Math.PI; const x = (HEA + HT) * Math.cos(t), y = HC + (HEB + HT) * Math.sin(t); k ? s.lineTo(x, y) : s.moveTo(x, y); }
  for (let k = N; k >= 0; k--){ const t = k / N * Math.PI; s.lineTo(HEA * Math.cos(t), HC + HEB * Math.sin(t)); }
  const hg = new THREE.ExtrudeGeometry(s, { depth: HH, bevelEnabled: false, curveSegments: 4 });
  hg.rotateX(-Math.PI / 2);
  const hijr = new THREE.Mesh(hg, marbleWhite); hijr.castShadow = true; hijr.receiveShadow = true; kaaba.add(hijr);
  // Maqam Ibrahim: a small gold-and-glass enclosure out from the door face
  const mq = new THREE.Group(); mq.position.set(HA + 10.8, 0, 2.4); kaaba.add(mq);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.1, .42, 8), std({ color: lin('#cfc9bf'), roughness: .45 }));
  base.position.y = .21; base.castShadow = true; base.receiveShadow = true; mq.add(base);
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, 1.6, 8, 1, true), std({ color: lin('#cfe2e6'), roughness: .1, metalness: .1, transparent: true, opacity: .38, side: THREE.DoubleSide, depthWrite: false }));
  glass.position.y = 1.22; mq.add(glass);
  for (let k = 0; k < 8; k++){
    const a = k / 8 * TAU + Math.PI / 8;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(.07, 1.6, .07), goldMat);
    bar.position.set(Math.cos(a) * .6, 1.22, Math.sin(a) * .6); mq.add(bar);
  }
  for (const y of [.46, 2.0]){ const ring = new THREE.Mesh(new THREE.CylinderGeometry(.68, .68, .14, 8), goldMat); ring.position.y = y; ring.castShadow = true; mq.add(ring); }
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.66, 18, 8, 0, TAU, 0, Math.PI / 2), goldMat);
  dome.position.y = 2.06; dome.castShadow = true; mq.add(dome);
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(.025, .06, .55, 6), goldMat); spire.position.y = 2.95; mq.add(spire);
}

// ---------------------------------------------------------------------------
// the floor and the colonnades
// ---------------------------------------------------------------------------
const trailU = { value: null }, trailGainU = { value: 0 }, dimU = { value: new THREE.Vector3(1, 1, 1) };
const floorMat = std({ map: marbleTex, roughness: .42, metalness: 0 });

function mergeIndexed(list){
  let vc = 0, ic = 0;
  for (const { geo } of list){ vc += geo.attributes.position.count; ic += geo.index.count; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), part = new Float32Array(vc), hh = new Float32Array(vc);
  const idx = new Uint32Array(ic);
  let vo = 0, io = 0;
  for (const { geo, p, hfn } of list){
    const P = geo.attributes.position, Nn = geo.attributes.normal, I = geo.index;
    for (let k = 0; k < P.count; k++){
      pos[(vo + k) * 3] = P.getX(k); pos[(vo + k) * 3 + 1] = P.getY(k); pos[(vo + k) * 3 + 2] = P.getZ(k);
      nor[(vo + k) * 3] = Nn.getX(k); nor[(vo + k) * 3 + 1] = Nn.getY(k); nor[(vo + k) * 3 + 2] = Nn.getZ(k);
      part[vo + k] = p || 0; hh[vo + k] = hfn ? hfn(P.getY(k)) : 1;
    }
    for (let k = 0; k < I.count; k++) idx[io + k] = I.getX(k) + vo;
    vo += P.count; io += I.count;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('aPart', new THREE.BufferAttribute(part, 1));
  g.setAttribute('aH', new THREE.BufferAttribute(hh, 1));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

const vec2 KA = vec2(0.70710678, -0.70710678);
const vec2 KB = vec2(-0.70710678, -0.70710678);
float kaabaShadow(vec3 o, vec3 L){
  vec3 lo = vec3(dot(o.xz, KA), o.y, dot(o.xz, KB));
  vec3 ld = vec3(dot(L.xz, KA), L.y, dot(L.xz, KB)) + vec3(1e-5);
  vec3 inv = 1.0 / ld;
  vec3 t0 = (vec3(-${HA.toFixed(2)}, 0.0, -${HB.toFixed(2)}) - lo) * inv;
  vec3 t1 = (vec3(${HA.toFixed(2)}, ${KH.toFixed(2)}, ${HB.toFixed(2)}) - lo) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), tn.z), b = min(min(tf.x, tf.y), tf.z);

varying vec3 vN; varying vec3 vAlb; varying float vSh; varying float vA; varying float vH; varying float vF;

function dressPerson(i, kind, o = {}){
  const elder = !!o.elder, sit = !!o.seated;
  const skin = pick(SKIN);
  let h, w, fl = 0, bare = 0, garment, head, covered = 0;
  if (kind === 'man' || kind === 'boy'){
    garment = pick(IHRAM);
    bare = Math.random() < .72 ? 1 : 0;           // the right shoulder bare (idtiba)
    head = Math.random() < .14 ? skin : elder ? pick(HAIR.slice(5)) : pick(HAIR.slice(0, 6));
    h = kind === 'boy' ? rnd(1.0, 1.4) : rnd(1.62, 1.86) - (elder ? .06 : 0);
    w = kind === 'boy' ? .78 : rnd(.95, 1.14); fl = .06;
  } else if (kind === 'manC'){
    garment = pick(THOBE);
    head = Math.random() < .35 ? '#f4f2ee' : Math.random() < .4 ? '#d8d2c6' : pick(HAIR.slice(0, 7));
    h = rnd(1.62, 1.86) - (elder ? .06 : 0); w = rnd(.94, 1.12); fl = .14;
  } else {
    garment = dress();
    head = Math.random() < .5 ? garment : Math.random() < .5 ? pick(['#f3f0e9', '#18181b', '#f3f0e9']) : dress();
    covered = 1;
    if (kind === 'girl'){ h = rnd(.95, 1.35); w = .76; if (Math.random() < .35){ covered = 0; head = pick(HAIR.slice(0, 5)); } }
    else { h = rnd(1.5, 1.72) - (elder ? .05 : 0); w = rnd(.94, 1.1); }

  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const d = fitDist(WALL ? 33 : 30);
  if (follow < 0) cam.wantDist = d;
  if (!cam.ready){ cam.dist = cam.wantDist = d; cam.ready = true; }
}
function placeCamera(){
  const ce = Math.cos(cam.el);
  camera.position.set(cam.tx + cam.dist * ce * Math.sin(cam.az), cam.dist * Math.sin(cam.el), cam.tz + cam.dist * ce * Math.cos(cam.az));
  camera.lookAt(cam.tx, 0, cam.tz);
}

// ---------------------------------------------------------------------------
// walking with someone
// ---------------------------------------------------------------------------
let follow = -1, followFade = 0;
const countEl = document.getElementById('count'), numEl = document.getElementById('num'), countSr = document.getElementById('countSr');
const dots = [...document.querySelectorAll('#dots i')];
const note = document.getElementById('note');
let lastShown = '';
function release(){
  if (follow < 0) return;
  follow = -1;
  lightU.uFollow.value.set(1e5, 1e5);
  countEl.classList.add('out');
  cam.wantDist = fitDist(30);
  setNote();
}
function startFollow(i){
  follow = i;
  countEl.hidden = false; countEl.classList.remove('out');
  cam.wantDist = Math.min(cam.dist, fitDist(13));
  lastShown = '';
  updateCount();
  setNote();
}
function updateCount(){
  if (follow < 0) return;
  const u = unitOf[follow];
  let k = 0, done = 0, txt;
  if (uState[u] === 2){ k = 7; done = 7; txt = 'Seven circuits complete'; }
  else if (uStarted[u]){ k = Math.min(7, Math.floor(uProg[u] / TAU) + 1); done = k - 1; txt = `Circuit ${k} of 7`; }
  else txt = 'Walking to the line of the Black Stone';
  const key = k + ':' + done;
  if (key === lastShown) return;
  lastShown = key;
  numEl.textContent = k ? String(k) : '';
  dots.forEach((d, j) => { d.className = j < done ? 'done' : (j === k - 1 && uState[u] !== 2) ? 'now' : ''; });
  countSr.textContent = txt;
}
function pick3D(clientX, clientY){
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(clientX / W * 2 - 1, -(clientY / H) * 2 + 1), camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  if (d.y > -1e-4) return -1;
  const t = (0.9 - o.y) / d.y, x = o.x + d.x * t, z = o.z + d.z * t;
  let best = -1, bd = Math.max(.9, cam.dist * .012);
  for (let i = 0; i < n; i++){
    if (stat[i]) continue;
    const dd = Math.hypot(px[i] - x, pz[i] - z);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}

// ---------------------------------------------------------------------------
// input
// ---------------------------------------------------------------------------
const pointers = new Map();
let dragMoved = 0, downAt = 0, pinch0 = 0, dist0 = 0, lastInput = -1e9;
if (!WALL){
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1){ dragMoved = 0; downAt = performance.now(); }
    if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.wantDist; }
    lastInput = performance.now(); wake();
  });
  stage.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1){
      dragMoved += Math.abs(dx) + Math.abs(dy);
      if (dragMoved > 6) stage.classList.add('dragging');
      cam.az -= dx * .0055;
      cam.el = clamp(cam.el + dy * .004, cam.minEl, cam.maxEl);
    } else if (pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const dd = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0 > 0) cam.wantDist = clamp(dist0 * pinch0 / dd, 12, fitDist(75));
      dragMoved = 99;
    }
    lastInput = performance.now();
  });
  const up = e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    stage.classList.remove('dragging');
    if (pointers.size === 0 && dragMoved < 7 && performance.now() - downAt < 600){
      const i = pick3D(e.clientX, e.clientY);
      if (i >= 0) startFollow(i); else release();
    }
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    cam.wantDist = clamp(cam.wantDist * Math.exp(e.deltaY * .0012), 12, fitDist(75));
    lastInput = performance.now(); wake();
  }, { passive: false });
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    let used = true;
    if (e.key === 'ArrowLeft') cam.az += .08;
    else if (e.key === 'ArrowRight') cam.az -= .08;
    else if (e.key === 'ArrowUp') cam.el = clamp(cam.el + .05, cam.minEl, cam.maxEl);
    else if (e.key === 'ArrowDown') cam.el = clamp(cam.el - .05, cam.minEl, cam.maxEl);
    else if (e.key === '+' || e.key === '=') cam.wantDist = clamp(cam.wantDist * .88, 12, fitDist(75));
    else if (e.key === '-' || e.key === '_') cam.wantDist = clamp(cam.wantDist / .88, 12, fitDist(75));
    else if (e.key === 'Escape') release();
    else used = false;
    if (used){ lastInput = performance.now(); e.preventDefault(); }
    wake();
  });
}

// ---------------------------------------------------------------------------
// controls
// ---------------------------------------------------------------------------
const expBtn = document.getElementById('exp'), lightBtn = document.getElementById('light'), sndBtn = document.getElementById('snd');
let longOn = Q.has('long') ? Q.get('long') === '1' : WALL ? true : store.get('long') === '1';
let LX = longOn ? 1 : 0;
function syncButtons(){
  expBtn.setAttribute('aria-pressed', String(longOn));
  lightBtn.textContent = MODE_LABEL[lightMode];
  lightBtn.setAttribute('aria-label', 'Light: ' + MODE_LABEL[lightMode] + '. Change the light');
  sndBtn.setAttribute('aria-pressed', String(soundOn));
}
expBtn.addEventListener('click', () => { longOn = !longOn; store.set('long', longOn ? '1' : '0'); syncButtons(); wake(); });
lightBtn.addEventListener('click', () => {
  lightMode = MODES[(MODES.indexOf(lightMode) + 1) % MODES.length];
  store.set('light', lightMode); syncButtons(); setNote(); wake();
});
function fmtTime(h){
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  const h12 = (hh % 12) || 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'am' : 'pm'}`;
}
function setNote(){
  const t = `It is ${fmtTime(makkahHour())} in Makkah.`;
  note.textContent = follow >= 0 ? `${t} Tap anywhere else to let them go.` : `${t} Tap someone to walk beside them.`;
}

// sound: a soft hush of many people and moving air. No voices.
let AC = null, master = null, hush = null, shuffle = null, air = null, soundOn = false, sndTimer = 0;
function noiseBuffer(){
  const len = AC.sampleRate * 6, buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
    for (let k = 0; k < len; k++){
      const w = Math.random() * 2 - 1;
      b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
      b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
      d[k] = (b0 + b1 + b2 + b3 + b4 + b5 + w * .5362) * .11;
    }
    // soften the loop seam
    const fade = AC.sampleRate * .5;
    for (let k = 0; k < fade; k++){ const a = k / fade; d[k] = d[k] * a + d[len - fade + k] * (1 - a); }
  }
  return buf;
}
function startSound(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  if (!AC){
    AC = new Ctx();
    const buf = noiseBuffer();
    master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    const chain = (rate, nodes, g) => {
      const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = rate;
      let last = s; for (const nd of nodes){ last.connect(nd); last = nd; }
      const gn = AC.createGain(); gn.gain.value = g; last.connect(gn); gn.connect(master);
      s.start(0, Math.random() * 5);
      return gn;
    };
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    air = chain(.9, [lp], .5);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = .8;
    const lp2 = AC.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 1400;
    hush = chain(1.07, [bp, lp2], .32);
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
    const lp3 = AC.createBiquadFilter(); lp3.type = 'lowpass'; lp3.frequency.value = 6000;
    shuffle = chain(.97, [hp, lp3], .05);
  }
  if (AC.resume) AC.resume();
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(.55, AC.currentTime, 1.4);
  return true;
}
function stopSound(){
  if (!AC) return;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(0, AC.currentTime, .35);
  clearTimeout(sndTimer);
  sndTimer = setTimeout(() => { if (!soundOn && AC.suspend) AC.suspend(); }, 1800);
}
let sndClock = 0, hushLvl = .32, shufLvl = .05;
function updateSound(dt){
  if (!soundOn || !AC) return;
  sndClock += dt;
  if (sndClock < .4) return;
  sndClock = 0;
  const near = clamp(1.25 - cam.dist / 200, .55, 1.15);
  hushLvl += (rnd(.22, .42) - hushLvl) * .3; shufLvl += (rnd(.025, .07) - shufLvl) * .4;
  const t = AC.currentTime;
  hush.gain.setTargetAtTime(hushLvl * near, t, 1.2);
  shuffle.gain.setTargetAtTime(shufLvl * near, t, .6);
  air.gain.setTargetAtTime(.5 * (1.4 - near * .5), t, 2);
}
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn){ if (!startSound()) soundOn = false; } else stopSound();
  syncButtons(); wake();
});
document.addEventListener('visibilitychange', () => {
  lastFrame = 0;
  if (!AC || !soundOn) return;
  if (document.hidden){ if (AC.suspend) AC.suspend(); } else if (AC.resume) AC.resume();
});

let dimTimer = 0;
function wake(){
  ui.classList.remove('dim');
  clearTimeout(dimTimer);
  dimTimer = setTimeout(() => { if (!ui.contains(document.activeElement)) ui.classList.add('dim'); }, 6000);
}
ui.addEventListener('focusin', wake);
if (WALL){ ui.hidden = true; countEl.hidden = true; stage.style.cursor = 'none'; }

// ---------------------------------------------------------------------------
// frame
// ---------------------------------------------------------------------------
let lastFrame = 0, lastDraw = 0, workAvg = 0, lastTrim = 0, clock = 0, uiClock = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (lost) return;
  if (WALL && now - lastDraw < 31) return;               // about 30 fps on the desktop
  lastDraw = now;
  const t0 = performance.now();
  let dt = lastFrame ? (now - lastFrame) / 1000 : 1 / 30;
  lastFrame = now;
  dt = Math.min(dt, 1 / 15);
  clock += dt;

  step(Math.min(dt, 1 / 20));
  upload();

  // light: ease toward the chosen hour
  const th = targetHour();
  let dh = ((th - hourShown + 12) % 24 + 24) % 24 - 12;
  hourShown = Math.abs(dh) < .002 || reduced ? th : hourShown + dh * Math.min(1, dt * 1.1);
  applyLight(hourShown);

  // long exposure: on its own, or in wallpaper mode mostly on with an occasional return to the figures
  let want = longOn ? 1 : 0;
  if (WALL && !reduced){ const c = clock % 480; want = c < 360 ? 1 : 0; }
  LX += (want - LX) * (reduced ? 1 : Math.min(1, dt / 3));
  const ease = LX * LX * (3 - 2 * LX);
  lightU.uAlpha.value = 1 - ease;
  chairMat.opacity = 1 - ease; chairs.visible = ease < .99;
  trailGainU.value = ease * 1.0;
  dimU.value.set(1 - .86 * ease, 1 - .84 * ease, 1 - .8 * ease);
  renderTrails(Math.min(dt, 1 / 20));

  // camera
  if (!reduced && follow < 0 && now - lastInput > 9000) cam.az += dt * TAU / 1800;
  if (WALL && !reduced) cam.el = (64 + 7 * Math.sin(clock * TAU / 700)) * Math.PI / 180;
  const ck = reduced ? 1 : Math.min(1, dt * 1.6);
  if (follow >= 0){
    cam.tx += (px[follow] - cam.tx) * ck; cam.tz += (pz[follow] - cam.tz) * ck;
    lightU.uFollow.value.set(px[follow], pz[follow]);
    followRing.position.x = px[follow]; followRing.position.z = pz[follow];
    // stand on their outward side, so the Kaaba stays beyond them rather than in front
    if (now - lastInput > 5000){
      const want = Math.atan2(px[follow], pz[follow]);
      cam.az += wrapA(want - cam.az) * (reduced ? 1 : Math.min(1, dt * .5));
    }
    followFade = Math.min(1, followFade + dt * 1.5);
  } else {
    cam.tx += (0 - cam.tx) * ck * .6; cam.tz += (0 - cam.tz) * ck * .6;
    followFade = Math.max(0, followFade - dt * 1.5);
  }
  followRing.material.opacity = followFade * (.85 + (reduced ? 0 : .15 * Math.sin(clock * 1.6)));
  followRing.visible = followFade > .01;
  cam.dist += (cam.wantDist - cam.dist) * (reduced ? 1 : Math.min(1, dt * 2.4));
  placeCamera();

  renderer.render(scene, camera);

  uiClock += dt;
  if (uiClock > .25){
    uiClock = 0; updateCount();
    if (!WALL && Math.floor(clock / 30) !== Math.floor((clock - .25) / 30)) setNote();
  }
  updateSound(dt);

  // keep it smooth: walk with fewer people if the machine is struggling
  const work = Math.min(performance.now() - t0, 40);
  workAvg += (work - workAvg) * .05;
  if (clock > 5 && !Q.has('keep') && workAvg > (WALL ? 24 : 14) && now - lastTrim > 3000 && n > 1400){
    let u = U - 1, target = Math.round(n * .85);
    while (u > HIJR_UNITS && uStart[u] > target) u--;
    if (follow >= uStart[u]) release();
    n = uStart[u]; lastTrim = now; workAvg *= .8;
  }
}

addEventListener('resize', resize);
resize();
syncButtons();
setNote();
applyLight(hourShown);
// let the river settle and the long exposure gather before the first frame
for (let k = 0; k < 40; k++) step(1 / 20);
for (let k = 0; k < 160; k++){ step(1 / 20); upload(); renderTrails(1 / 20); }
if (Q.has('follow') && !WALL){ for (let u = HIJR_UNITS + 40; u < U; u++) if (uState[u] === 1 && uStarted[u]){ startFollow(uStart[u]); break; } }
placeCamera();
wake();
requestAnimationFrame(frame);
})();
</script>
