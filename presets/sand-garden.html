<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand Garden</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap');
:root{
  color-scheme: dark;
  --veranda:#3a3029;
  --board:rgba(36,30,25,.80);
  --board-line:rgba(255,244,228,.11);
  --ink:#ece6da;
  --ink-soft:rgba(236,230,218,.68);
  --sand:#e6e2d8;
  --sand-ink:#2b2723;
  --focus:#b7c78a;
  --cap-bg:rgba(230,226,216,.62);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--veranda)}
body{font-family:'Zen Kaku Gothic New',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:crosshair}
#ui{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;background:var(--board);border:1px solid var(--board-line);border-radius:12px;box-shadow:0 8px 22px rgba(12,9,6,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:calc(100vw - 20px);box-sizing:border-box}
#ui button{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:8px;height:38px;min-width:38px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:background-color .2s,color .2s}
#ui button:hover{background:rgba(255,244,228,.08)}
#ui button[aria-pressed="true"]{background:var(--sand);color:var(--sand-ink)}
#ui button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#ui svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:22px;background:var(--board-line);margin:0 3px;flex:none}
#tines{display:flex;align-items:center}
#tines button{padding:0;width:34px;font-size:17px}
#tcount{min-width:56px;text-align:center;font-size:13px;color:var(--ink-soft);white-space:nowrap}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;margin:0;padding:6px 12px;border-radius:999px;background:var(--cap-bg);color:var(--sand-ink);font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity 1.2s ease;pointer-events:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#cap.on{opacity:1}
body.wp #ui, body.wp #cap{display:none}
@media (max-width:640px){
  .lbl{display:none}
  #ui{gap:2px;padding:4px}
  #ui button{height:44px;min-width:44px;padding:0 9px}
  #tines button{width:36px}
  #tcount{min-width:20px}
  .tw{display:none}
  .sep{margin:0 1px}
  #cap{font-size:13px;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 40px)}
}
@media (prefers-reduced-motion: reduce){ #ui button,#cap{transition:none} }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" role="img" aria-label="A dry rock garden of raked white gravel, moss and stones, seen from above"></canvas>

<div id="ui" role="toolbar" aria-label="Garden tools">
  <button type="button" data-tool="rake" aria-pressed="true" title="Rake (R)">
    <svg viewBox="0 0 20 20"><path d="M3 12h14M4.5 12v4M8.2 12v4M11.8 12v4M15.5 12v4M10 12l3.5-9"/></svg><span class="lbl">Rake</span>
  </button>
  <button type="button" data-tool="stick" aria-pressed="false" title="Stick (S)">
    <svg viewBox="0 0 20 20"><path d="M6 17L14.5 3"/><circle cx="5.6" cy="17.6" r=".6"/></svg><span class="lbl">Stick</span>
  </button>
  <button type="button" data-tool="board" aria-pressed="false" title="Smoothing board (B)">
    <svg viewBox="0 0 20 20"><path d="M2.5 14.5h15M2.5 16.5h15M10 14.5l3-11"/></svg><span class="lbl">Board</span>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <div id="tines" role="group" aria-label="Rake tines">
    <button type="button" id="tless" aria-label="Fewer tines" title="Fewer tines ([)">&minus;</button>
    <span id="tcount" aria-live="polite">5<span class="tw"> tines</span></span>
    <button type="button" id="tmore" aria-label="More tines" title="More tines (])">+</button>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="monkb" aria-pressed="false" title="Let the monk rake (M)">
    <svg viewBox="0 0 20 20"><circle cx="10" cy="5" r="2.4"/><path d="M4.5 18c0-4.2 2.4-7.4 5.5-7.4s5.5 3.2 5.5 7.4"/></svg><span class="lbl">Monk</span>
  </button>
  <button type="button" id="soundb" aria-pressed="false" title="Sound">
    <svg viewBox="0 0 20 20"><path d="M3.5 8h3l4-3.2v10.4l-4-3.2h-3z"/><path class="w1" d="M13.5 7.6c1.1 1.3 1.1 3.5 0 4.8"/><path class="w2" d="M15.8 5.6c2.2 2.5 2.2 6.3 0 8.8"/></svg><span class="lbl">Sound</span>
  </button>
</div>
<p id="cap" role="status" aria-live="polite"></p>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- basics */
const WALL = location.hash === '#wallpaper';
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
let RM = RMQ.matches;
if (RMQ.addEventListener) RMQ.addEventListener('change', e => { RM = e.matches; });
if (WALL) document.body.classList.add('wp');

const glc = document.getElementById('gl');
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
const cap = document.getElementById('cap');

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash1 = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vn1 = x => { const i = Math.floor(x), f = x - i; return mix(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const S = 5;          // groove spacing (cells)
const AMP = 0.55;     // half ridge height (cells)
const TALUS = 0.95;   // max stable height step between cells (angle of repose)
const MAXST = 12;
const TAU = Math.PI * 2;

// groove profile: narrow tine cut, broad rounded crest. groove at integer t.
const PL = new Float32Array(1024);
for (let i = 0; i < 1024; i++) { const x = 0.5 + 0.5 * Math.cos(TAU * i / 1024); PL[i] = 1 - 2 * Math.pow(x, 1.6); }
const P = t => PL[((t - Math.floor(t)) * 1024) | 0];

/* ---------------------------------------------------------------- layout + grid */
let W = 0, H = 0, dpr = 1, lay = null;
let gw = 0, gh = 0, N = 0, cellX = 1, cellY = 1, longX = true;
let hf, D, solid, mossM, blocked, sandBytes, solidBytes, rowG;
let stones = [];
let sandDirty = true, solidDirty = true, stonesDirty = true, shadowDirty = true;

function computeLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const verH = Math.round(WALL ? clamp(h * 0.055, 26, 60) : clamp(h * 0.095, 64, 100));
  const wallH = Math.round(clamp(h * 0.032, 12, 30));
  const gut = Math.round(clamp(Math.min(w, h) * 0.026, 9, 24));
  const rect = [gut, wallH + gut, w - 2 * gut, h - verH - wallH - 2 * gut];
  const c = Math.max(1.8, Math.max(rect[2], rect[3]) / 520);
  return { w, h, verH, wallH, gut, rect, gw: Math.max(48, Math.round(rect[2] / c)), gh: Math.max(48, Math.round(rect[3] / c)) };
}

function alloc() {
  N = gw * gh;
  hf = new Float32Array(N); D = new Float32Array(N); solid = new Float32Array(N); mossM = new Float32Array(N);
  blocked = new Uint8Array(N); sandBytes = new Uint8ClampedArray(N * 4); solidBytes = new Uint8ClampedArray(N * 4);
  rowG = new Float32Array(gh);
}

// Ryoan-ji: fifteen stones in five groups; here twelve in five, on moss islands.
const GROUPS = [
  { c: [0.15, 0.50], s: [[0, 0, 1.25, 1.25, 0], [1.45, -0.75, 0.72, 0.75, 1], [-1.15, 0.85, 0.55, 0.5, 2]] },
  { c: [0.36, 0.30], s: [[0, 0, 0.95, 0.95, 3], [1.2, 0.55, 0.5, 0.45, 1]] },
  { c: [0.555, 0.62], s: [[0, 0, 1.05, 1.55, 2], [-1.35, -0.35, 0.6, 0.55, 0], [1.05, 0.85, 0.45, 0.35, 3]] },
  { c: [0.74, 0.30], s: [[0, 0, 0.85, 0.8, 0], [-1.05, 0.65, 0.48, 0.42, 2]] },
  { c: [0.885, 0.62], s: [[0, 0, 1.0, 1.05, 1], [1.15, -0.8, 0.55, 0.5, 3]] },
];
const STONE_COL = [[0.13, 0.15, 0.14], [0.20, 0.17, 0.14], [0.08, 0.08, 0.085], [0.23, 0.22, 0.21]];

function placeStones() {
  const r = rng(1499);
  const base = Math.sqrt(gw * gh) * 0.052;
  stones = [];
  for (const g of GROUPS) {
    for (const s of g.s) {
      let cx = g.c[0], cy = g.c[1], ox = s[0], oy = s[1];
      if (!longX) { [cx, cy] = [cy, cx]; [ox, oy] = [oy, ox]; }
      const rot = r() * TAU;
      const st = {
        x: cx * gw + ox * base, y: cy * gh + oy * base,
        r: s[2] * base * 0.9, h: s[3] * base * 0.85,
        c: Math.cos(rot), s: Math.sin(rot), asp: 1.12 + r() * 0.38, seed: r() * 6.28,
        col: STONE_COL[s[4]].map(v => v * (0.9 + r() * 0.2)),
      };
      st.x = clamp(st.x, st.r + 4, gw - st.r - 4); st.y = clamp(st.y, st.r + 4, gh - st.r - 4);
      stones.push(st);
    }
  }
}

function stoneShape(st, px, py) {
  const qx = px * st.c + py * st.s, qy = (-px * st.s + py * st.c) * st.asp;
  const rho = Math.sqrt(qx * qx + qy * qy), th = Math.atan2(qy, qx);
  const R = st.r * (1 + 0.12 * Math.sin(3 * th + st.seed) + 0.06 * Math.sin(5 * th + st.seed * 1.7) + 0.035 * Math.sin(8 * th + st.seed * 2.9));
  return [rho, R, th];
}

// island distance field D (<0 inside moss), stone heights, moss mask
function rebuildSolid(full) {
  D.fill(1e3); solid.fill(0);
  const ringMax = full ? 9 * S + 10 : 3;
  for (const st of stones) {
    const reach = st.r * 1.75 + 8 + ringMax;
    const x0 = Math.max(0, Math.floor(st.x - reach)), x1 = Math.min(gw - 1, Math.ceil(st.x + reach));
    const y0 = Math.max(0, Math.floor(st.y - reach)), y1 = Math.min(gh - 1, Math.ceil(st.y + reach));
    for (let y = y0; y <= y1; y++) {
      const py = y + 0.5 - st.y;
      let i = y * gw + x0;
      for (let x = x0; x <= x1; x++, i++) {
        const px = x + 0.5 - st.x;
        const sh = stoneShape(st, px, py), rho = sh[0], R = sh[1], th = sh[2];
        const sd = rho - R;
        if (sd < 0) { const u = rho / R; const hs = st.h * Math.pow(1 - u * u, 0.45); if (hs > solid[i]) solid[i] = hs; }
        const di = sd - (st.r * 0.42 + 4 + 2.2 * Math.sin(2 * th + st.seed * 3.1) + 1.2 * Math.sin(5 * th + st.seed));
        if (di > ringMax + 3) continue;
        const a = D[i], k = 9, hh = Math.max(k - Math.abs(a - di), 0) / k;
        D[i] = Math.min(a, di) - hh * hh * k * 0.25;
      }
    }
  }
  const b = solidBytes;
  for (let i = 0; i < N; i++) {
    const d = D[i];
    const m = clamp(0.5 - d / 2.5, 0, 1);
    mossM[i] = m;
    const mh = d < 0 ? Math.min(-d / 4, 1) * 0.8 : 0;
    const s = Math.max(solid[i], mh);
    const o = i * 4;
    b[o] = s * 6.375; b[o + 1] = m * 255; b[o + 2] = 0; b[o + 3] = 255;
    blocked[i] = d < 0.6 ? 1 : 0;
  }
  solidDirty = true; stonesDirty = true; shadowDirty = true;
}
const Dat = (x, y) => (x < 0 || y < 0 || x >= gw || y >= gh) ? 1e3 : D[(y | 0) * gw + (x | 0)];

/* ---------------------------------------------------------------- patterns */
const ORDER = ['waves', 'seigaiha', 'lines', 'spiral'];
const NAMES = { lines: 'straight lines', waves: 'waves', seigaiha: 'overlapping waves', spiral: 'a spiral' };
let pat = { name: 'lines', cx: 0, cy: 0 };
let monkN = 5;
const WAMP = 1.8 * S, WK = TAU / (17 * S), SEIG_R = 5.5 * S;

function seig(u, v) {
  const R = SEIG_R, jr = Math.floor(v / (R * 0.5));
  for (let j = jr + 2; j >= jr - 2; j--) {
    const off = (j & 1) ? R : 0, cy = j * R * 0.5;
    const cx = Math.round((u - off) / (2 * R)) * 2 * R + off;
    const dx = u - cx, dy = v - cy, d = Math.sqrt(dx * dx + dy * dy);
    if (d < R) return d / S - 0.5;
  }
  return 0;
}
function phaseAt(x, y) {
  const a = longX ? y : x, b = longX ? x : y;
  switch (pat.name) {
    case 'lines': return a / S;
    case 'waves': return (a + WAMP * Math.sin(b * WK)) / S;
    case 'seigaiha': return seig(b + 0.5 * SEIG_R, a);
    default: { const dx = x - pat.cx, dy = y - pat.cy; return Math.sqrt(dx * dx + dy * dy) / S - monkN * Math.atan2(dy, dx) / TAU; }
  }
}
function target(i, x, y) {
  const d = D[i], rw = monkN * S;
  if (d < rw) return AMP * P((d - 0.5 * S) / S);
  const v = AMP * P(phaseAt(x, y));
  if (d < rw + 2.5) return mix(AMP * P((d - 0.5 * S) / S), v, (d - rw) / 2.5);
  return v;
}
function spiralCenter() {
  let best = -1e9, bx = gw / 2, by = gh / 2;
  for (let y = 10; y < gh - 10; y += 6) for (let x = 10; x < gw - 10; x += 6) {
    let m = 1e9;
    for (const st of stones) m = Math.min(m, Math.hypot(x - st.x, y - st.y) - st.r * 1.7);
    m = Math.min(m, x * 0.8, y * 0.8, (gw - x) * 0.8, (gh - y) * 0.8);
    const sc = m - 0.12 * Math.hypot(x - gw / 2, y - gh / 2);
    if (sc > best) { best = sc; bx = x; by = y; }
  }
  return [bx, by];
}
function setPattern(name) {
  pat.name = name;
  if (name === 'spiral') { const c = spiralCenter(); pat.cx = c[0]; pat.cy = c[1]; }
}
function fillPattern() {
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const i = y * gw + x; hf[i] = target(i, x + 0.5, y + 0.5); }
}

/* ---------------------------------------------------------------- tools (stamps) */
function box(cx, cy, e) {
  return [Math.max(0, Math.floor(cx - e)), Math.min(gw - 1, Math.ceil(cx + e)), Math.max(0, Math.floor(cy - e)), Math.min(gh - 1, Math.ceil(cy + e))];
}
function stampRake(cx, cy, dx, dy, n, k, monk) {
  const half = n * S * 0.5, ax = -dy, ay = dx, th = monk ? 2.0 : 1.8;
  const b = box(cx, cy, half + 3);
  for (let y = b[2]; y <= b[3]; y++) {
    const py = y + 0.5 - cy;
    for (let x = b[0]; x <= b[1]; x++) {
      const px = x + 0.5 - cx;
      const v = px * dx + py * dy; if (v > th || v < -th) continue;
      const u = px * ax + py * ay, au = Math.abs(u); if (au > half + 1.5) continue;
      const i = y * gw + x, d = D[i]; if (d < 0.6) continue;
      const w = (au < half - 0.5 ? 1 : (half + 1.5 - au) * 0.5) * (1 - Math.abs(v) / th) * k * Math.min(1, (d - 0.6) * 0.5);
      const t = monk ? target(i, x + 0.5, y + 0.5) : AMP * P((u + half) / S - 0.5);
      hf[i] += (t - hf[i]) * w;
    }
  }
}
function stampStick(cx, cy, k) {
  const b = box(cx, cy, 4);
  for (let y = b[2]; y <= b[3]; y++) for (let x = b[0]; x <= b[1]; x++) {
    const r = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (r > 3.6) continue;
    const i = y * gw + x, d = D[i]; if (d < 0.6) continue;
    const g = -1.2 * Math.exp(-(r / 1.2) * (r / 1.2)) + 0.6 * Math.exp(-((r - 2.3) / 0.85) * ((r - 2.3) / 0.85));
    const w = (r < 2.6 ? 1 : (3.6 - r)) * k * Math.min(1, (d - 0.6) * 0.5);
    hf[i] += (AMP * 1.25 * g - hf[i]) * w;
  }
}
function stampBoard(cx, cy, dx, dy, k) {
  const half = 22, ax = -dy, ay = dx, th = 2.4;
  const b = box(cx, cy, half + 3);
  for (let y = b[2]; y <= b[3]; y++) for (let x = b[0]; x <= b[1]; x++) {
    const px = x + 0.5 - cx, py = y + 0.5 - cy;
    const v = px * dx + py * dy; if (v > th || v < -th) continue;
    const au = Math.abs(px * ax + py * ay); if (au > half + 2) continue;
    const i = y * gw + x, d = D[i]; if (d < 0.6) continue;
    const w = (au < half ? 1 : (half + 2 - au) * 0.5) * (1 - Math.abs(v) / th) * k * Math.min(1, (d - 0.6) * 0.5);
    hf[i] += (0.04 * Math.sin(x * 0.9 + y * 0.4) - hf[i]) * w;
  }
}

/* ---------------------------------------------------------------- sand physics: angle of repose + wind */
let windK = 1e-4;
function simStep(t) {
  const w = gw, h = gh, R = 0.22;
  for (let y = 0; y < h; y++) rowG[y] = 0.55 + 0.45 * Math.sin(y * 0.031 + t * 0.21) * Math.sin(y * 0.011 - t * 0.13);
  for (let y = 0; y < h; y++) {
    const k = windK * (0.4 + rowG[y]);
    let i = y * w;
    for (let x = 0; x < w - 1; x++, i++) {
      if (blocked[i] | blocked[i + 1]) continue;
      const d = hf[i] - hf[i + 1];
      let f = d * k;
      if (d > TALUS) f += (d - TALUS) * R; else if (d < -TALUS) f += (d + TALUS) * R;
      hf[i] -= f; hf[i + 1] += f;
    }
  }
  for (let y = 0; y < h - 1; y++) {
    const k = windK * (0.4 + rowG[y]);
    let i = y * w;
    for (let x = 0; x < w; x++, i++) {
      const j = i + w;
      if (blocked[i] | blocked[j]) continue;
      const d = hf[i] - hf[j];
      let f = d * k;
      if (d > TALUS) f += (d - TALUS) * R; else if (d < -TALUS) f += (d + TALUS) * R;
      hf[i] -= f; hf[j] += f;
    }
  }
}
function packSand() {
  const w = gw, h = gh, b = sandBytes;
  for (let y = 0; y < h; y++) {
    const ym = y > 0 ? -w : 0, yp = y < h - 1 ? w : 0;
    let i = y * w;
    for (let x = 0; x < w; x++, i++) {
      const xm = x > 0 ? -1 : 0, xp = x < w - 1 ? 1 : 0;
      const o = i * 4;
      b[o] = 128 + (hf[i + xp] - hf[i + xm]) * 25.5;
      b[o + 1] = 128 + (hf[i + yp] - hf[i + ym]) * 25.5;
      b[o + 2] = 128 + hf[i] * 42.5;
      b[o + 3] = 255;
    }
  }
  sandDirty = true; shadowDirty = true;
}

/* ---------------------------------------------------------------- light: time of day */
// u in [0,1): 0 sunrise, 0.78 sunset, then night.
const KEYS = [
  [0.000, [0.90, 0.45, 0.25], 0.7, [0.20, 0.20, 0.30], 1.7],
  [0.060, [1.00, 0.68, 0.42], 2.4, [0.30, 0.32, 0.42], 1.25],
  [0.200, [1.00, 0.92, 0.82], 2.8, [0.34, 0.40, 0.50], 1.1],
  [0.390, [1.00, 0.96, 0.90], 3.0, [0.36, 0.42, 0.52], 1.0],
  [0.600, [1.00, 0.90, 0.78], 2.8, [0.34, 0.39, 0.48], 1.1],
  [0.700, [1.00, 0.66, 0.38], 2.6, [0.30, 0.30, 0.40], 1.2],
  [0.760, [1.00, 0.46, 0.22], 1.5, [0.27, 0.22, 0.32], 1.45],
  [0.780, [1.00, 0.40, 0.20], 0.0, [0.15, 0.15, 0.27], 2.0],
  [0.820, [0.30, 0.38, 0.58], 0.0, [0.06, 0.07, 0.13], 2.7],
  [0.860, [0.30, 0.38, 0.58], 0.9, [0.035, 0.045, 0.085], 3.1],
  [0.960, [0.30, 0.38, 0.58], 0.9, [0.035, 0.045, 0.085], 3.1],

function spawnLeaf(rest) {

}
function updateLeaves(dt) {
  leafT -= dt;
  if (leafT <= 0) { spawnLeaf(false); leafT = (WALL ? 30 : 22) + Math.random() * 40; }
  const wx = Math.cos(wind.ang), wy = Math.sin(wind.ang);

function drawLeaves(c) {

/* ---------------------------------------------------------------- sound */
let AC = null, au = null, soundOn = false, knockT = 14, lastLen = 0;

  const grit = noiseBuf(2.0, d => { let v = 0; for (let i = 0; i < d.length; i++) { if (Math.random() < 0.004) v = Math.random() * 2 - 1; d[i] = v; v *= 0.55; } });

// shishi-odoshi: the bamboo tips, strikes the stone, rocks back

/* ---------------------------------------------------------------- sizing */
function sizeCanvases() {

  glc.width = Math.round(W * dpr); glc.height = Math.round(H * dpr);
  fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr);

  cap.style.bottom = `${lay.verH + lay.gut + 12}px`;
}
function setup(first) {

window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => setup(false), 150); });

/* ---------------------------------------------------------------- loop */
let last = 0, simAcc = 0, tSim = 0, lightAcc = 1, lastFrame = 0;
let tick = () => {};

  updateMonk(dt);
  tick(dt);

let render2D = () => {};

/* ---------------------------------------------------------------- 2D fallback (no WebGL) */
let c2 = null, off = null, offCtx = null, img = null, r2T = 0;
render2D = () => {
