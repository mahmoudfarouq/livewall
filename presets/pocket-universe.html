<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-bleed sky; a cinematic title card, then quiet type pinned to the corners and one caption line for the universe's milestones */
:root {
  --void: #070817;      /* interstellar indigo, never neutral black */
  --ink: #e7e5f6;
  --ink-dim: #9195c0;
  --life: #86e8d3;      /* bioluminescence, the habitable band */
  --line: rgba(145, 149, 192, .32);
  --display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --edge: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); font-family: var(--body); font-weight: 300; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.hud { position: fixed; pointer-events: none; display: flex; gap: 10px; transition: opacity 2s ease; }
.tl { top: calc(16px + env(safe-area-inset-top, 0px)); left: var(--edge); flex-direction: column; gap: 2px; }
.tr { top: calc(16px + env(safe-area-inset-top, 0px)); right: var(--edge); }
.bl { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: var(--edge); flex-direction: column; gap: 2px; }
.br { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: var(--edge); }
.intro .hud.fade { opacity: 0; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .03em; line-height: 1; }
.dim { margin: 0; color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
button {
  pointer-events: auto; font: 400 13px/1 var(--body); color: var(--ink); background: rgba(7, 8, 23, .5);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: border-color .2s;
}
button:hover { border-color: var(--ink-dim); }
button:focus-visible { outline: 2px solid var(--life); outline-offset: 2px; }
.br button { width: 38px; height: 38px; padding: 0; font-size: 18px; font-weight: 300; }
#hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: min(34rem, calc(100% - 32px)); margin: 0; text-align: center; font-size: 15px; line-height: 1.5;
  color: var(--ink); text-wrap: balance; pointer-events: none; transition: opacity 1.2s ease; text-shadow: 0 0 18px var(--void);
}
.off { opacity: 0 !important; }
#title, #end {
  position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px;
  padding-inline: 16px; pointer-events: none; transition: opacity 2.5s ease;
}
#title h2 {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(54px, 12vw, 148px); line-height: .95;
  letter-spacing: .02em; text-wrap: balance; animation: rise 3.5s cubic-bezier(.2, .7, .1, 1) both;
  background: linear-gradient(180deg, #fff 10%, #c9c6f0 55%, #7f84c4 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
#title p { margin: 0 auto; max-width: 30rem; color: var(--ink-dim); font-size: 16px; line-height: 1.6; text-wrap: balance; animation: rise 3.5s .6s cubic-bezier(.2, .7, .1, 1) both; }
#title .go { color: var(--ink); font-size: 15px; animation: rise 3s 1.4s both, breathe 3.2s 4s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); letter-spacing: .12em; } to { opacity: 1; transform: none; } }
@keyframes breathe { 50% { opacity: .45; } }
#end h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 56px); text-wrap: balance; }
#end p { margin: 0 auto; max-width: 30rem; color: var(--ink-dim); font-size: 15px; line-height: 1.6; text-wrap: balance; }
#cap {
  position: fixed; left: 50%; top: 17%; transform: translateX(-50%); width: min(40rem, calc(100% - 32px));
  text-align: center; pointer-events: none; transition: opacity 1.4s ease, letter-spacing 4s ease;
}
#cap h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5.5vw, 60px); letter-spacing: .04em; text-wrap: balance; text-shadow: 0 0 30px var(--void); }
#cap p { margin: 8px auto 0; color: var(--ink-dim); font-size: 14px; line-height: 1.5; max-width: 28rem; text-wrap: balance; }
#cap.off h3 { letter-spacing: .12em; }
@media (max-width: 480px) { h1 { font-size: 25px; } #hint { font-size: 14px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { #title h2, #title p, #title .go { animation: none; } }
</style>

<canvas id="sky" aria-label="A universe in a canvas. Press and hold to form a star; pull back and release to throw a planet."></canvas>
<div class="hud tl fade"><h1>Pocket Universe</h1><p class="dim" id="uni">Universe 1</p></div>
<div class="hud tr"><button id="snd" type="button" aria-pressed="true">Sound on</button></div>
<div class="hud bl fade"><p class="dim" id="stats">No stars yet</p><p class="dim" id="age">Age 0 years</p></div>
<div class="hud br fade"><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zin" type="button" aria-label="Zoom in">+</button></div>
<p id="hint" class="off"></p>
<div id="cap" class="off" aria-live="polite"><h3 id="capT"></h3><p id="capS"></p></div>
<div id="title"><h2>Pocket Universe</h2><p>Gather dust into stars, set worlds in orbit and listen to them play. Best with sound on.</p><p class="go">Press anywhere to begin</p></div>
<div id="end" class="off" aria-live="polite"><h2>This universe has gone quiet</h2><p id="endtxt"></p></div>

<script>
(() => {
const cv = document.getElementById('sky'), v = cv.getContext('2d');
const S = document.createElement('canvas'), c = S.getContext('2d');           // scene with motion trails
const B1 = document.createElement('canvas'), b1 = B1.getContext('2d');        // bloom, quarter size
const B2 = document.createElement('canvas'), b2 = B2.getContext('2d');        // bloom, tenth size
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VOID = '7,8,23';
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(1.5, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = S.width = Math.round(W * DPR); cv.height = S.height = Math.round(H * DPR);
  B1.width = Math.ceil(W / 4); B1.height = Math.ceil(H / 4); B2.width = Math.ceil(W / 10); B2.height = Math.ceil(H / 10);
}
addEventListener('resize', resize); resize();

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
const TAU = Math.PI * 2;

// camera
const cam = { x: 0, y: 0, z: 1, zT: 1, ax: 0, ay: 0 };
const sx = x => (x - cam.x) * cam.z + W / 2, sy = y => (y - cam.y) * cam.z + H / 2;
const wx = X => (X - W / 2) / cam.z + cam.x, wy = Y => (Y - H / 2) / cam.z + cam.y;
function zoomAt(X, Y, z) {
  const bx = wx(X), by = wy(Y);
  cam.z = clamp(z, 0.0035, 3);
  cam.x = bx - (X - W / 2) / cam.z; cam.y = by - (Y - H / 2) / cam.z;
}

// ---- stars: colour from blackbody temperature, spectral class, lifetime falls with mass
function kelvinRGB(k) {
  const t = k / 100; let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708 * Math.log(t) - 161.1196; b = t <= 19 ? 0 : 138.5177 * Math.log(t - 10) - 305.0448; }
  else { r = 329.6987 * Math.pow(t - 60, -0.1332); g = 288.1222 * Math.pow(t - 60, -0.0755); b = 255; }
  return [clamp(r, 0, 255) | 0, clamp(g, 0, 255) | 0, clamp(b, 0, 255) | 0];
}
const tempOf = m => clamp(5800 * Math.pow(m, 0.55), 2400, 42000);
const classOf = T => T >= 30000 ? 'O' : T >= 10000 ? 'B' : T >= 7500 ? 'A' : T >= 6000 ? 'F' : T >= 5200 ? 'G' : T >= 3700 ? 'K' : 'M';
const fateOf = m => m >= 25 ? 'Will explode and leave a black hole' : m >= 8 ? 'Will explode and leave a pulsar' : m >= 0.5 ? 'Will swell into a red giant' : 'Will glow for a very long time';
const massAt = t => Math.min(60, 0.08 * Math.exp(1.6 * t));
const fmtMass = m => m < 1 ? m.toFixed(2) : m < 10 ? m.toFixed(1) : String(Math.round(m));
const fmtK = T => (Math.round(T / 100) * 100).toLocaleString('en-US');

function sprite(w, h, paint) { const s = document.createElement('canvas'); s.width = w; s.height = h; paint(s.getContext('2d')); return s; }
const glowSprite = rgb => sprite(128, 128, g => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.07, `rgba(${rgb},1)`);
  gr.addColorStop(0.22, `rgba(${rgb},.33)`); gr.addColorStop(0.55, `rgba(${rgb},.07)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const raySprite = rgb => sprite(256, 256, g => {
  g.translate(128, 128);
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * TAU + rand(-0.15, 0.15), L = rand(40, 126), lg = g.createLinearGradient(0, 0, Math.cos(a) * L, Math.sin(a) * L);
    lg.addColorStop(0, `rgba(${rgb},.55)`); lg.addColorStop(1, `rgba(${rgb},0)`);
    g.strokeStyle = lg; g.lineWidth = rand(0.6, 2); g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * L, Math.sin(a) * L); g.stroke();
  }
});
const streakSprite = rgb => sprite(256, 16, g => {
  const lg = g.createLinearGradient(0, 0, 256, 0);
  lg.addColorStop(0, `rgba(${rgb},0)`); lg.addColorStop(0.5, `rgba(${rgb},.5)`); lg.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = lg; g.fillRect(0, 6, 256, 4); g.fillRect(0, 7.5, 256, 1);
});
const RED = glowSprite([255, 112, 64]), WARM = glowSprite([255, 196, 140]);

let stars = [], planets = [], sparks = [], rings = [], holes = [], pulsars = [], grav = [];
let made = 0, worldsEver = 0, metal = 0, universe = 1, cosmic = 0, quiet = 0, flash = 0, shake = 0;
let phase = 'intro';   // intro → live → ended
const seen = new Set();

function makeStar(x, y, m, vx = 0, vy = 0) {
  const T = tempOf(m), rgb = kelvinRGB(T);
  const s = { kind: 'star', x, y, vx, vy, m, T, rgb, col: `rgb(${rgb})`, r: 3 + 4 * Math.pow(m, 0.4), mu: 7e6 * Math.pow(m, 0.6),
    hz: 160 * Math.pow(m, 0.6), life: clamp(260 * Math.pow(m, -0.85), 22, 1400), age: 0, dying: 0, label: 5,
    glow: glowSprite(rgb), rays: raySprite(rgb), streak: streakSprite(rgb), phase: Math.random() * TAU, voice: null, scale: 1 };
  s.rr = s.r;
  stars.push(s); made++;
  s.voice = drone(s);
  lightGalaxy(s.col);
  milestone('star', 'First light', 'Gravity has lit a star. Its colour is its temperature.');
  return s;
}

// ---- nebula: a soft value-noise cloud in world space; supernovae and dying stars paint into it
const NS = 512;
let BOX = Math.max(W, H) * 0.9;
const NEB = BOX * 2.4;
const N = document.createElement('canvas'); N.width = N.height = NS; const nb = N.getContext('2d');
function paintNebula() {
  const P1 = new Float32Array(65536).map(Math.random), P2 = new Float32Array(65536).map(Math.random);
  const noise = (P, x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const at = (a, b) => P[((b & 255) << 8) | (a & 255)];
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), w);
  };
  const fbm = (P, x, y) => { let s = 0, a = 0.5; for (let o = 0; o < 5; o++) { s += a * noise(P, x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return s; };
  const img = nb.createImageData(NS, NS), d = img.data;
  for (let j = 0; j < NS; j++) for (let i = 0; i < NS; i++) {
    const u = i / NS, w = j / NS, n1 = fbm(P1, u * 5, w * 5), n2 = fbm(P2, u * 4 + 9, w * 4 + 3);
    const edge = 1 - clamp((Math.hypot(u - 0.5, w - 0.5) - 0.3) / 0.2, 0, 1);
    const dens = Math.pow(clamp((n1 - 0.42) * 2.4, 0, 1), 1.5) * edge;
    const k = (j * NS + i) * 4;
    d[k] = lerp(92, 36, n2) + (n2 > 0.66 ? 90 : 0); d[k + 1] = lerp(56, 118, n2); d[k + 2] = lerp(170, 150, n2);
    d[k + 3] = dens * 150;
  }
  nb.putImageData(img, 0, 0);
}
paintNebula();
const nx = x => (x + NEB) / (2 * NEB) * NS;
function nebulaSplash(x, y, R, cols, ring) {
  nb.globalCompositeOperation = 'lighter';
  const X = nx(x), Y = nx(y), r = R / (2 * NEB) * NS;
  for (let k = 0; k < (ring ? 2 : 7); k++) {
    const col = cols[k % cols.length], ox = ring ? 0 : rand(-r, r) * 0.6, oy = ring ? 0 : rand(-r, r) * 0.6, rr = ring ? r * (1 - k * 0.25) : r * rand(0.3, 0.8);
    const gr = nb.createRadialGradient(X + ox, Y + oy, ring ? rr * 0.55 : 0, X + ox, Y + oy, rr);
    gr.addColorStop(0, `rgba(${col},${ring ? 0 : 0.28})`); gr.addColorStop(ring ? 0.75 : 0.4, `rgba(${col},${ring ? 0.5 : 0.12})`); gr.addColorStop(1, `rgba(${col},0)`);
    nb.fillStyle = gr; nb.beginPath(); nb.arc(X + ox, Y + oy, rr, 0, TAU); nb.fill();
  }
  nb.globalCompositeOperation = 'source-over';
}

// ---- dust
const ND = W * H < 500000 ? 1100 : 2200;
const dX = new Float32Array(ND), dY = new Float32Array(ND), dVX = new Float32Array(ND), dVY = new Float32Array(ND), dK = new Uint8Array(ND);
// 0 primordial hydrogen haze, then supernova products: iron gold, oxygen teal, hydrogen-alpha rose
const ELEM = ['176,182,235', '255,206,128', '124,232,218', '255,138,192'];
const DUST = ELEM.map((e, k) => `rgba(${e},${k ? 0.85 : 0.5})`);
const respawn = i => { dX[i] = rand(-BOX, BOX); dY[i] = rand(-BOX, BOX); dVX[i] = dVY[i] = 0; };
for (let i = 0; i < ND; i++) { dX[i] = dY[i] = 0; }

function kickDust(x, y, R, power) {
  for (let i = 0; i < ND; i++) {
    const ex = dX[i] - x, ey = dY[i] - y, d = Math.hypot(ex, ey) + 1;
    if (d < R) { const f = power * (1 - d / R) / d; dVX[i] += ex * f; dVY[i] += ey * f; }
  }
}

// ---- gesture state: hold = gather a star, aim = slingshot a planet
let g = null;
const pointers = new Map();
let pinch0 = 0, pinchZ = 1;

function stepDust(dt, t) {
  const hold = g && g.mode === 'hold';
  const R = 240 / cam.z, R2 = R * R, eat = Math.max(8 / cam.z, g ? g.rad / cam.z * 0.5 : 0);
  for (let i = 0; i < ND; i++) {
    const x = dX[i], y = dY[i];
    let ax = Math.sin(y * 0.004 + t * 0.07) * 6, ay = Math.cos(x * 0.004 - t * 0.05) * 6, gone = false;
    if (hold) {
      const ex = g.wx - x, ey = g.wy - y, d2 = ex * ex + ey * ey;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 1;
        if (d < eat) { respawn(i); continue; }
        const f = 3.2 * R * (1.15 - d / R) / d;
        ax += ex * f - ey * f * 0.75; ay += ey * f + ex * f * 0.75;
      }
    }
    for (let k = 0; k < stars.length; k++) {
      const s = stars[k], ex = s.x - x, ey = s.y - y, d2 = ex * ex + ey * ey;
      if (d2 < s.rr * s.rr) { gone = true; break; }
      if (d2 < 9 * s.hz * s.hz) { const f = s.mu * 0.01 / ((d2 + 900) * Math.sqrt(d2 + 900)); ax += ex * f; ay += ey * f; }
    }
    for (let k = 0; !gone && k < holes.length; k++) {
      const h = holes[k], ex = h.x - x, ey = h.y - y, d2 = ex * ex + ey * ey;
      if (d2 < h.r * h.r * 2.2) { gone = true; break; }
      if (d2 < 1.6e6) { const d = Math.sqrt(d2), f = h.mu * 0.03 / ((d2 + 400) * d); ax += ex * f - ey * f * 1.4; ay += ey * f + ex * f * 1.4; }
    }
    if (gone) { respawn(i); continue; }
    dVX[i] = (dVX[i] + ax * dt) * (1 - 0.6 * dt); dVY[i] = (dVY[i] + ay * dt) * (1 - 0.6 * dt);
    let nx2 = x + dVX[i] * dt, ny2 = y + dVY[i] * dt;
    if (nx2 > BOX) nx2 -= 2 * BOX; else if (nx2 < -BOX) nx2 += 2 * BOX;
    if (ny2 > BOX) ny2 -= 2 * BOX; else if (ny2 < -BOX) ny2 += 2 * BOX;
    dX[i] = nx2; dY[i] = ny2;
  }
}

// ---- gravity for planets and the aiming preview (stars, pulsars and black holes all pull)
let AX = 0, AY = 0, HOST = null, HIT = null;
function accel(x, y) {
  AX = AY = 0; HOST = HIT = null; let best = 0;
  for (const b of grav) {
    const ex = b.x - x, ey = b.y - y, d2 = ex * ex + ey * ey;
    if (d2 < b.rr * b.rr) { HIT = b; return; }
    const q = d2 + 60, a = b.mu / q, inv = a / Math.sqrt(q);
    AX += ex * inv; AY += ey * inv;
    if (a > best) { best = a; HOST = b; }
  }
}
function predict(x, y, vx, vy) {
  const pts = [], h = 1 / 120;
  for (let i = 0; i < 480; i++) {
    for (let k = 0; k < 2; k++) {
      accel(x, y); if (HIT) return pts;
      vx += AX * h; vy += AY * h; x += vx * h; y += vy * h;
    }
    if (i % 3 === 0) pts.push(x, y);
  }
  return pts;
}

const HUES = [205, 22, 40, 190];
const RICH = [285, 330, 160, 55, 0];
function launch(x, y, vx, vy) {
  const pool = metal > 0 ? HUES.concat(RICH) : HUES;
  planets.push({ x, y, vx, vy, r: rand(2.4, 4.8), hue: pool[Math.random() * pool.length | 0], ring: metal > 0 && Math.random() < 0.45,
    lifeT: 0, alive: false, fossil: false, lived: 0, cells: new Uint8Array(28), caT: 0, host: null, lastAng: null, trail: [] });
  pluck(330, panOf(sx(x)));
  milestone('planet', 'First orbit', 'Each time a world comes round, it plays a note.');
}

// one-dimensional cellular automaton around each living world; richer rule once heavy elements exist
function stepCA(p) {
  const n = p.cells.length, next = new Uint8Array(n), rule = metal > 0 ? 110 : 30;
  for (let i = 0; i < n; i++) {
    const l = p.cells[(i + n - 1) % n], m = p.cells[i], r = p.cells[(i + 1) % n];
    next[i] = (rule >> (l << 2 | m << 1 | r)) & 1;
  }
  if (!next.some(x => x)) next[Math.random() * n | 0] = 1;
  p.cells = next;
}

const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27];
function consume(p, b) {
  burst(p.x, p.y, b.kind === 'hole' ? 80 : 40, 160, b.kind === 'hole' ? 'rgb(255,190,130)' : b.col, 0, b.kind === 'hole' ? b : null);
  rings.push({ x: p.x, y: p.y, t: 0, dur: 0.8, max: 60, col: b.rgb || [255, 190, 130] });
  pluck(82, panOf(sx(p.x)));
  if (b.kind === 'hole') b.m += 0.2;
}
function stepPlanets(dt) {
  const h = dt / 3;
  for (let i = planets.length - 1; i >= 0; i--) {
    const p = planets[i];
    for (let k = 0; k < 3; k++) {
      accel(p.x, p.y);
      if (HIT) break;
      p.vx += AX * h; p.vy += AY * h; p.x += p.vx * h; p.y += p.vy * h;
    }
    if (HIT) { consume(p, HIT); planets.splice(i, 1); continue; }
    if (Math.abs(p.x) > 60000 || Math.abs(p.y) > 60000) { planets.splice(i, 1); continue; }
    p.trail.push(p.x, p.y); if (p.trail.length > 200) p.trail.splice(0, 2);

    const host = HOST;
    if (p.alive && !stars.includes(p.host)) { p.alive = false; p.fossil = true; p.cells.fill(0); }
    if (host) {
      const ex = p.x - host.x, ey = p.y - host.y, d = Math.hypot(ex, ey), ang = Math.atan2(ey, ex);
      if (p.host === host && p.lastAng !== null && Math.abs(ang - p.lastAng) > Math.PI) {
        const idx = clamp(Math.round(11 - Math.log2(d / 30) * 2.2), 0, 11);
        pluck(220 * Math.pow(2, PENTA[idx] / 12), panOf(sx(p.x)), p.alive, true);
      }
      p.host = host; p.lastAng = ang;
      const inZone = host.kind === 'star' && !host.dying && d > host.hz * 0.75 && d < host.hz * 1.35;

    else { const k = 2.4; launch(g.wx, g.wy, (g.wx - wx(g.x)) * k, (g.wy - wy(g.y)) * k); }
  }
  g = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

// ---- hints, one at a time
const HINTS = [
  () => made > 0,
  () => planets.length > 0,
  () => worldsEver > 0 || hintAge > 30,
  () => metal > 0 || hintAge > 40,
  () => cam.z < 0.2 || hintAge > 40,
];
const HINT_TEXT = [
  'Press and hold to gather dust into a star. Hold longer for a bigger, hotter one.',
  'Pull back from empty space and let go to throw a planet. The dotted line shows its path.',
  'Keep a planet inside a star’s green band and life will begin. Each orbit plays a note.',
  'Hold for three seconds or more to make a giant. Giants die young, and they explode.',
  'Zoom out with the scroll wheel, a pinch or the − button to find your galaxy.',
];
let hintIx = 0, hintAge = 0, hintOn = false;
function showHint() { if (phase !== 'live' || hintIx >= HINTS.length) return; $('hint').textContent = HINT_TEXT[hintIx]; $('hint').classList.remove('off'); hintOn = true; }
function stepHints(dt) {
  if (!hintOn) return;
  hintAge += dt;
  if (hintIx < HINTS.length && HINTS[hintIx]()) {
    hintIx++; hintAge = 0; hintOn = false; $('hint').classList.add('off');
    setTimeout(showHint, 2600);

}

// ---- background stars, fixed to the screen for depth
const BG = Array.from({ length: 260 }, () => [Math.random(), Math.random(), Math.random() * 0.5 + 0.1, Math.random() * TAU]);

// ---- drawing helpers
function drawStar(s, X, Y) {
  const dying = s.dying, giant = dying && s.m >= 0.5 && dying < 6 ? dying / 6 : 0, dwarf = dying && (s.m < 0.5 || dying >= 6);
  const fade = dwarf ? clamp(s.m < 0.5 ? 1 - dying / 14 : 1 - (dying - 6) / 8, 0, 1) : 1;
  const birth = Math.min(1, s.age * 1.5);
  const D = (s.r * cam.z * 11 + 16) * s.scale * birth * (1 + 0.04 * Math.sin(T * 2 + s.phase));
  c.globalAlpha = fade;
  if (!dwarf) {
    c.save(); c.translate(X, Y); c.rotate(T * 0.04 + s.phase); c.globalAlpha = 0.55 * birth * (1 - giant);
    c.drawImage(s.rays, -D * 1.1, -D * 1.1, D * 2.2, D * 2.2); c.restore();
    c.globalAlpha = 0.6 * birth * (1 - giant); c.drawImage(s.streak, X - D * 2, Y - D * 0.06, D * 4, D * 0.12);
  }
  c.globalAlpha = fade * (1 - giant);
  c.drawImage(dwarf ? WARM : s.glow, X - D / 2, Y - D / 2, D, D);
  if (giant) { c.globalAlpha = giant; c.drawImage(RED, X - D / 2, Y - D / 2, D, D); }
  if (s.m > 2.5 && !dying) {
    const L = D * 0.9; c.strokeStyle = s.col; c.lineWidth = 1; c.globalAlpha = 0.28 * birth;
    c.beginPath(); c.moveTo(X - L, Y); c.lineTo(X + L, Y); c.moveTo(X, Y - L); c.lineTo(X, Y + L); c.stroke();
  }
  c.globalAlpha = fade; c.fillStyle = giant ? `rgb(255,${200 - giant * 80 | 0},${170 - giant * 100 | 0})` : '#fff';
  c.beginPath(); c.arc(X, Y, Math.max(1.2, s.r * cam.z * 0.8 * (dwarf ? Math.max(s.scale * 2, 0.3) : s.scale)), 0, TAU); c.fill();
  c.globalAlpha = 1;
}

function drawHole(h) {
  const X = sx(h.x), Y = sy(h.y), R = Math.max(3, h.r * cam.z), fade = clamp((h.life - h.age) / 8, 0, 1);
  v.save(); v.translate(X, Y); v.globalAlpha = fade;
  v.globalCompositeOperation = 'lighter';
  v.drawImage(WARM, -R * 9, -R * 9, R * 18, R * 18);
  // the far side of the disk, bent up over the top by lensing
  v.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    v.strokeStyle = `rgba(255,${210 - k * 40},${150 - k * 40},${0.55 - k * 0.12})`; v.lineWidth = R * (0.5 - k * 0.12);
    v.setLineDash([R * 0.6, R * 0.35]); v.lineDashOffset = -T * 30 * (k + 1);
    v.beginPath(); v.ellipse(0, 0, R * (1.7 + k * 0.4), R * (1.35 + k * 0.3), 0, Math.PI, TAU); v.stroke();
  }
  v.globalCompositeOperation = 'source-over'; v.setLineDash([]);
  v.fillStyle = '#000'; v.beginPath(); v.arc(0, 0, R, 0, TAU); v.fill();
  v.globalCompositeOperation = 'lighter';
  v.strokeStyle = 'rgba(255,236,210,.9)'; v.lineWidth = Math.max(1, R * 0.08); v.beginPath(); v.arc(0, 0, R * 1.08, 0, TAU); v.stroke();
  // the near side of the disk, flat, crossing in front
  v.rotate(-0.12);
  for (let k = 0; k < 4; k++) {
    v.strokeStyle = `rgba(255,${220 - k * 35},${160 - k * 35},${0.7 - k * 0.14})`; v.lineWidth = R * (0.42 - k * 0.08);
    v.setLineDash([R * 0.8, R * 0.3]); v.lineDashOffset = T * 40 * (k + 1);
    v.beginPath(); v.ellipse(0, 0, R * (1.9 + k * 0.6), R * (0.32 + k * 0.08), 0, 0, Math.PI); v.stroke();
  }
  v.setLineDash([]); v.restore(); v.globalCompositeOperation = 'source-over'; v.globalAlpha = 1;
}

// ---- frame
let last = performance.now(), statT = 0, T = 0;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;

  if (Math.abs(Math.log(cam.zT / cam.z)) > 0.001) zoomAt(cam.ax, cam.ay, cam.z * Math.pow(cam.zT / cam.z, 1 - Math.exp(-dt * 7)));

  if (g && g.mode === 'hold') { g.t += dt; g.m = massAt(g.t); g.rad = 10 + Math.sqrt(g.m) * 9; riseSet(g.m); }
  grav = stars.concat(pulsars, holes);
  if (phase !== 'intro') { stepStars(dt); grav = stars.concat(pulsars, holes); stepPlanets(dt); stepDust(dt, T); stepHints(dt); }
  if (made && phase === 'live') cosmic += dt;

  for (let i = pulsars.length - 1; i >= 0; i--) {
    const p = pulsars[i]; p.age += dt; p.ang += p.spin * dt;
    const tk = Math.floor(p.ang / Math.PI); if (tk !== p.tick) { p.tick = tk; if (p.age < p.life - 10) tick(panOf(sx(p.x))); }
    if (p.age > p.life) pulsars.splice(i, 1);
  }
  for (let i = holes.length - 1; i >= 0; i--) {
    const h = holes[i]; h.age += dt;
    if (h.age > h.life) {
      holes.splice(i, 1); hush(h, 2);
      burst(h.x, h.y, 200, 300, 'rgb(255,236,210)', 0); rings.push({ x: h.x, y: h.y, t: 0, dur: 2, max: 400, col: [255, 236, 210] });
      flash = Math.max(flash, RM ? 0.15 : 0.5);
      milestone('evap', 'A black hole evaporates', 'Over unimaginable time, even black holes leak away.');
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.vx *= 1 - 0.9 * dt; s.vy *= 1 - 0.9 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0) {
      if (s.heavy) { const j = Math.random() * ND | 0; dX[j] = s.x; dY[j] = s.y; dVX[j] = s.vx; dVY[j] = s.vy; dK[j] = s.heavy; }
      sparks.splice(i, 1);
    }
  }

  if (phase === 'live' && made && !stars.length && !holes.length && !pulsars.length && !g) { quiet += dt; if (quiet > 6) endUniverse(); } else quiet = 0;

  // ---------- scene layer: everything that leaves trails
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'destination-out'; c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(0, 0, S.width, S.height);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalCompositeOperation = 'lighter';
  const ga = clamp((0.2 - cam.z) / 0.16, 0, 1);

  if (phase !== 'intro' && cam.z > 0.012) {
    const ds = clamp(1.4 * Math.sqrt(cam.z), 0.8, 2.4);
    for (let k = 0; k < 4; k++) {
      c.fillStyle = DUST[k];
      for (let i = 0; i < ND; i++) if (dK[i] === k) c.fillRect(sx(dX[i]), sy(dY[i]), ds, ds);
    }
  }

  if (cam.z > 0.08) {
    c.globalCompositeOperation = 'source-over';
    for (const s of stars) {
      if (s.dying) continue;
      c.strokeStyle = `rgba(134,232,211,${0.06 * Math.min(1, s.age / 2)})`;
      c.lineWidth = Math.max(1, s.hz * 0.6 * cam.z);
      c.beginPath(); c.arc(sx(s.x), sy(s.y), s.hz * 1.05 * cam.z, 0, TAU); c.stroke();
    }
    c.globalCompositeOperation = 'lighter';
  }

  for (const p of planets) {
    const tr = p.trail, n = tr.length / 2;
    c.lineWidth = 1;
    for (let i = 1; i < n; i++) {
      c.strokeStyle = `hsla(${p.hue},60%,70%,${(i / n) * 0.35})`;
      c.beginPath(); c.moveTo(sx(tr[i * 2 - 2]), sy(tr[i * 2 - 1])); c.lineTo(sx(tr[i * 2]), sy(tr[i * 2 + 1])); c.stroke();
    }
    const X = sx(p.x), Y = sy(p.y), R = Math.max(1.4, p.r * Math.sqrt(cam.z) * 1.15);
    c.globalCompositeOperation = 'source-over';
    // lit from its host: bright limb toward the star, night side away
    let lx = 0, ly = 0; if (p.host) { const d = Math.hypot(p.host.x - p.x, p.host.y - p.y) + 1; lx = (p.host.x - p.x) / d; ly = (p.host.y - p.y) / d; }
    const base = p.fossil ? [230, 8, 52] : [p.hue, 55, p.alive ? 70 : 62];
    const pg = c.createRadialGradient(X + lx * R * 0.5, Y + ly * R * 0.5, 0, X, Y, R * 1.05);
    pg.addColorStop(0, `hsl(${base[0]},${base[1]}%,${Math.min(92, base[2] + 18)}%)`); pg.addColorStop(0.6, `hsl(${base[0]},${base[1]}%,${base[2]}%)`); pg.addColorStop(1, `hsl(${base[0]},${base[1]}%,${base[2] - 40}%)`);
    c.fillStyle = pg; c.beginPath(); c.arc(X, Y, R, 0, TAU); c.fill();
    if (p.ring) { c.strokeStyle = `hsla(${p.hue + 30},50%,78%,.7)`; c.beginPath(); c.ellipse(X, Y, R * 2.1, R * 0.7, -0.4, 0, TAU); c.stroke(); }
    c.globalCompositeOperation = 'lighter';
    if (p.alive) {
      const n2 = p.cells.length, rr = R * 2.6 + 3;
      for (let i = 0; i < n2; i++) if (p.cells[i]) {
        const a = i / n2 * TAU + T * 0.5;
        c.fillStyle = `hsla(${160 + i * 4},85%,72%,.9)`; c.fillRect(X + Math.cos(a) * rr - 1, Y + Math.sin(a) * rr - 1, 2, 2);
      }
      c.fillStyle = `rgba(134,232,211,${0.1 + 0.05 * Math.sin(T * 3)})`; c.beginPath(); c.arc(X, Y, R * 4, 0, TAU); c.fill();
      if (p.lived > 25) for (let k = 0; k < 3; k++) {
        const a = T * (2.2 + k * 0.7) + k * 2, rr2 = R * (1.7 + k * 0.45);
        c.fillStyle = 'rgba(255,255,255,.95)'; c.fillRect(X + Math.cos(a) * rr2 - 0.75, Y + Math.sin(a) * rr2 * 0.6 - 0.75, 1.5, 1.5);
      }
    }
  }

  for (const s of stars) drawStar(s, sx(s.x), sy(s.y));

  for (const p of pulsars) {
    const X = sx(p.x), Y = sy(p.y), fade = clamp((p.life - p.age) / 10, 0, 1), L = Math.max(140, 900 * cam.z);
    for (const side of [0, Math.PI]) {
      const a = p.ang + side, ex = X + Math.cos(a) * L, ey = Y + Math.sin(a) * L, lg = c.createLinearGradient(X, Y, ex, ey);
      lg.addColorStop(0, `rgba(200,220,255,${0.7 * fade})`); lg.addColorStop(1, 'rgba(200,220,255,0)');
      c.fillStyle = lg; c.beginPath(); c.moveTo(X, Y);
      c.lineTo(X + Math.cos(a - 0.06) * L, Y + Math.sin(a - 0.06) * L); c.lineTo(X + Math.cos(a + 0.06) * L, Y + Math.sin(a + 0.06) * L); c.fill();
    }
    c.globalAlpha = fade; c.drawImage(WARM, X - 14, Y - 14, 28, 28); c.fillStyle = '#fff'; c.beginPath(); c.arc(X, Y, 2, 0, TAU); c.fill(); c.globalAlpha = 1;
  }

  for (const s of sparks) { c.fillStyle = s.heavy ? DUST[s.heavy] : s.col; c.globalAlpha = Math.min(1, s.life); c.fillRect(sx(s.x), sy(s.y), 2, 2); }
  c.globalAlpha = 1;
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt; if (r.t > r.dur) { rings.splice(i, 1); continue; }
    const k = r.t / r.dur, X = sx(r.follow ? r.follow.x : r.x), Y = sy(r.follow ? r.follow.y : r.y);
    c.strokeStyle = `rgba(${r.col},${(1 - k) * 0.6})`; c.lineWidth = 1 + (1 - k) * 3;
    c.beginPath(); c.arc(X, Y, Math.max(1, (1 - Math.pow(1 - k, 3)) * r.max * Math.max(cam.z, 0.05)), 0, TAU); c.stroke();
  }

  if (g && g.mode === 'hold') {
    const rgb = kelvinRGB(tempOf(g.m)), X = g.x0, Y = g.y0, R = g.rad * (0.85 + 0.15 * Math.sin(T * 9));
    const gr = c.createRadialGradient(X, Y, 0, X, Y, R * 2.4);
    gr.addColorStop(0, `rgba(${rgb},.9)`); gr.addColorStop(0.3, `rgba(${rgb},.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = gr; c.beginPath(); c.arc(X, Y, R * 2.4, 0, TAU); c.fill();
    // accretion disk spinning up as mass grows
    c.strokeStyle = `rgba(${rgb},.5)`; c.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      c.setLineDash([R * 0.5, R * 0.9]); c.lineDashOffset = -T * (60 + g.m * 4) * (k + 1);
      c.beginPath(); c.ellipse(X, Y, R * (2.8 + k * 0.9), R * (0.9 + k * 0.3), -0.35, 0, TAU); c.stroke();
    }
    c.setLineDash([]);
  }

  // ---------- visible layer: void, nebula, galaxy, then the scene with bloom, then sharp overlays
  v.setTransform(1, 0, 0, 1, 0, 0); v.globalCompositeOperation = 'source-over'; v.globalAlpha = 1;
  v.fillStyle = `rgb(${VOID})`; v.fillRect(0, 0, cv.width, cv.height);
  v.setTransform(DPR, 0, 0, DPR, 0, 0);

  for (const [u, w, b, ph] of BG) { v.fillStyle = `rgba(200,205,255,${b * (0.6 + 0.4 * Math.sin(T * 0.7 + ph)) * 0.5})`; v.fillRect(u * W, w * H, 1.2, 1.2); }

  const nebA = (phase === 'intro' ? 0.85 : 0.6 + Math.min(0.4, metal * 0.08)) * (1 - ga);
  if (nebA > 0.01) { v.globalAlpha = nebA; v.drawImage(N, sx(-NEB), sy(-NEB), 2 * NEB * cam.z, 2 * NEB * cam.z); v.globalAlpha = 1; }

  if (ga > 0.01) {
    v.globalCompositeOperation = 'lighter';
    const glow = 0.4 + 0.6 * Math.min(1, made / 10), sz = cam.z < 0.01 ? 1.3 : 1.8;
    const CX = sx(GCX), CY = sy(GCY), CR = 0.35 * GR * cam.z;
    v.save(); v.translate(CX, CY); v.scale(1, TILT);
    const cg = v.createRadialGradient(0, 0, 0, 0, 0, CR);
    cg.addColorStop(0, `rgba(255,236,206,${0.55 * ga})`); cg.addColorStop(0.25, `rgba(255,200,170,${0.16 * ga})`); cg.addColorStop(1, 'rgba(160,150,255,0)');
    v.fillStyle = cg; v.beginPath(); v.arc(0, 0, CR, 0, TAU); v.fill(); v.restore();
    for (let k = 0; k < 3; k++) {
      v.fillStyle = `rgba(${GCOL[k]},${(k === 0 ? 0.5 : 0.4) * ga * glow})`;
      for (let i = 0; i < NG; i++) if (gK[i] === k) v.fillRect(sx(gX[i]), sy(gY[i]), sz, sz);
    }
    for (const L of lit) {
      const X = sx(gX[L.i]), Y = sy(gY[L.i]);
      v.globalAlpha = ga; v.fillStyle = L.col; v.beginPath(); v.arc(X, Y, 2, 0, TAU); v.fill();
      v.globalAlpha = ga * 0.35; v.beginPath(); v.arc(X, Y, 6, 0, TAU); v.fill(); v.globalAlpha = 1;
    }
    v.globalCompositeOperation = 'source-over';
    if (ga > 0.9) milestone('galaxy', 'Your galaxy', 'Every star you light also lights one of these, in its own colour.');
  }

  v.setTransform(1, 0, 0, 1, 0, 0);
  let ox = 0, oy = 0; if (shake > 0.2) { ox = rand(-shake, shake) * DPR; oy = rand(-shake, shake) * DPR; shake *= 0.9; }
  v.drawImage(S, ox, oy);
  b1.clearRect(0, 0, B1.width, B1.height); b1.drawImage(S, 0, 0, B1.width, B1.height);
  b2.clearRect(0, 0, B2.width, B2.height); b2.drawImage(B1, 0, 0, B2.width, B2.height);
  v.globalCompositeOperation = 'lighter';
  v.globalAlpha = 0.5; v.drawImage(B1, ox, oy, cv.width, cv.height);
  v.globalAlpha = 0.75; v.drawImage(B2, ox, oy, cv.width, cv.height);
  v.globalAlpha = 1; v.globalCompositeOperation = 'source-over';
  v.setTransform(DPR, 0, 0, DPR, 0, 0);

  for (const h of holes) drawHole(h);

  v.font = '300 12px Jost, system-ui, sans-serif'; v.textAlign = 'center';
  for (const s of stars) {
    if (s.label <= 0 || cam.z < 0.1) continue;
    const X = sx(s.x), Y = sy(s.y) + (s.r * cam.z * 11 + 16) * 0.32, a = Math.min(1, s.label) * 0.85;
    v.fillStyle = `rgba(231,229,246,${a})`; v.fillText(`${classOf(s.T)}-type star, ${fmtK(s.T)} K`, X, Y + 18);
    v.fillStyle = `rgba(145,149,192,${a})`; v.fillText(`${fmtMass(s.m)} solar masses`, X, Y + 33);
  }
  if (ga > 0.01 && cam.z < 0.04) {
    const X = sx(0), Y = sy(0);
    v.strokeStyle = `rgba(134,232,211,${ga * 0.8})`; v.lineWidth = 1; v.beginPath(); v.arc(X, Y, 9, 0, TAU); v.stroke();
    v.fillStyle = `rgba(231,229,246,${ga * 0.85})`; v.textAlign = 'left';
    v.fillText('You are here', X + 14, Y + 4);
    if (lit.length) v.fillText(`${plural(lit.length, 'star')} you lit, shown in colour`, X + 14, Y + 20);
  }
  if (g && g.mode === 'hold') {
    const T2 = tempOf(g.m), X = g.x0, Y = g.y0 - g.rad * 2.6;
    v.textAlign = 'center'; v.font = '400 13px Jost, system-ui, sans-serif'; v.fillStyle = 'rgba(231,229,246,.95)';
    v.fillText(`${fmtMass(g.m)} solar masses`, X, Y - 37);
    v.font = '300 12px Jost, system-ui, sans-serif'; v.fillStyle = 'rgba(145,149,192,.95)';
    v.fillText(`${classOf(T2)}-type, ${fmtK(T2)} K`, X, Y - 22);
    v.fillStyle = g.m >= 8 ? 'rgba(255,206,128,.95)' : 'rgba(145,149,192,.8)'; v.fillText(fateOf(g.m), X, Y - 7);
  } else if (g && g.mode === 'aim') {
    const k = 2.4, pts = predict(g.wx, g.wy, (g.wx - wx(g.x)) * k, (g.wy - wy(g.y)) * k);
    v.strokeStyle = 'rgba(145,149,192,.4)'; v.lineWidth = 1; v.setLineDash([3, 5]);
    v.beginPath(); v.moveTo(g.x0, g.y0); v.lineTo(g.x, g.y); v.stroke(); v.setLineDash([]);
    for (let i = 0; i < pts.length; i += 2) { v.fillStyle = `rgba(231,229,246,${0.7 * (1 - i / pts.length)})`; v.fillRect(sx(pts[i]) - 1, sy(pts[i + 1]) - 1, 2, 2); }
    v.fillStyle = 'hsl(205,55%,66%)'; v.beginPath(); v.arc(g.x0, g.y0, 4, 0, TAU); v.fill();
  }

  if (flash > 0.005) { v.setTransform(1, 0, 0, 1, 0, 0); v.fillStyle = `rgba(255,248,236,${flash})`; v.fillRect(0, 0, cv.width, cv.height); flash *= 0.92; }

  if ((statT += dt) > 0.25) { statT = 0; updateStats(); }
  requestAnimationFrame(frame);
}

function ageText() {
  const myr = cosmic * 25; // one second is 25 million years
  return myr < 1000 ? `Age ${Math.round(myr)} million years` : `Age ${(myr / 1000).toFixed(1)} billion years`;
}
function updateStats() {
  const living = planets.filter(p => p.alive).length, extra = holes.length ? `, ${plural(holes.length, 'black hole')}` : '';
  $('stats').textContent = made ? `${plural(stars.length, 'star')}, ${plural(planets.length, 'planet')}, ${living} living ${living === 1 ? 'world' : 'worlds'}${extra}` : 'No stars yet';
  $('age').textContent = ageText();
}
function endUniverse() {
  phase = 'ended'; $('hint').classList.add('off'); hintOn = false;
  $('endtxt').textContent = `It lived ${ageText().slice(4)}, made ${plural(made, 'star')} and ${worldsEver} ${worldsEver === 1 ? 'world that came' : 'worlds that came'} alive. Press anywhere to begin universe ${universe + 1}.`;
  $('end').classList.remove('off');
}

document.body.classList.add('intro');
requestAnimationFrame(frame);
})();
</script>
