<title>Clockwork Orrery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&display=swap');
:root {

  --ebony-2: #1c130c;
  --wood: #2c1d11;
  --brass: #c49a45;

  --gilt: #e8bf5a;

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ebony);
  color: var(--ivory);
  font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
  font-size: 17px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#c {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; cursor: grab; outline: none;
}
#c.dragging { cursor: grabbing; }
#c:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.mast {
  position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left));
  pointer-events: none; max-width: min(320px, 70vw);
}
.mast h1 {
  margin: 0; font-family: 'IM Fell English', Georgia, serif; font-weight: 400;
  font-size: 30px; line-height: 1; color: var(--brass-hi); letter-spacing: 0.01em;
}
.mast p { margin: 6px 0 0; color: var(--ivory-dim); font-size: 15px; line-height: 1.3; transition: opacity 1.2s; }
.mast p.gone { opacity: 0; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  background: linear-gradient(to top, rgba(12, 8, 5, 0.94) 55%, rgba(12, 8, 5, 0));
}
.when { flex: 1 1 260px; min-width: 0; }
.date {
  font-size: 30px; line-height: 1.05; color: var(--ivory);
  font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1;
  white-space: nowrap;
}

  font: inherit; font-size: 16px; color: var(--ivory);
  background: rgba(255, 240, 210, 0.04);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; min-height: 38px; line-height: 1.1;
  font-variant-numeric: tabular-nums lining-nums;

select { padding-right: 8px; }

input[type=date] { color-scheme: dark; min-width: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

<script>

    earth:   [[1.00000018, 0.01673163, -0.00054346, 100.46691572, 102.93005885, -5.11260389],

    saturn:  [[9.54149883, 0.05550825, 2.49424102, 50.07571329, 92.86136063, 113.63998702],

  const EL1 = {
    mercury: [[0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593],
              [0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081]],
    venus:   [[0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255],
              [0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418]],
    earth:   [[1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0],
              [0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0]],
    mars:    [[1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891],

    jupiter: [[5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909],
              [-0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106]],
    saturn:  [[9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448],
              [-0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794]],
    uranus:  [[19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503],
              [-0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589]],
    neptune: [[30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574],
              [0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664]]

  // P. Schlyter's tables; the long great inequality is already carried by the Table 2b terms.
  function perturb(name, jd) {

    const d = jd - 2451543.5, s = x => Math.sin(x * D2R), c = x => Math.cos(x * D2R);
    const Mj = 19.8950 + 0.0830853001 * d, Ms = 316.9670 + 0.0334442282 * d, Mu = 142.5905 + 0.011725806 * d;
    if (name === 'jupiter') return -0.056 * s(2 * Mj - 2 * Ms + 21) + 0.042 * s(3 * Mj - 5 * Ms + 21) - 0.036 * s(Mj - 2 * Ms)
      + 0.022 * c(Mj - Ms) + 0.023 * s(2 * Mj - 3 * Ms + 52) - 0.016 * s(Mj - 5 * Ms - 69);
    if (name === 'saturn') return -0.229 * c(2 * Mj - 4 * Ms - 2) + 0.119 * s(Mj - 2 * Ms - 3) + 0.046 * s(2 * Mj - 6 * Ms - 69) + 0.014 * s(Mj - 3 * Ms + 32);
    return 0.040 * s(Ms - 2 * Mu + 6) + 0.035 * s(Ms - 3 * Mu + 33) - 0.015 * s(Mj - Mu + 20);
  }

  function helio(name, jd) {
    const T = (jd - 2451545.0) / 36525;
    const [k, r, x] = (T > -2 && T < 0.5 && EL1[name][0][0] < 2 ? EL1 : EL)[name];
    const a = k[0] + r[0] * T, e = k[1] + r[1] * T, I = (k[2] + r[2] * T) * D2R;
    const L = k[3] + r[3] * T, wb = k[4] + r[4] * T, Om = (k[5] + r[5] * T) * D2R;
    let M = L - wb;
    if (x) M += x[0] * T * T + x[1] * Math.cos(x[3] * T * D2R) + x[2] * Math.sin(x[3] * T * D2R);
    M = wrap180(M) * D2R;
    const w = wb * D2R - Om;
    let E = M + e * Math.sin(M);
    for (let i = 0; i < 12; i++) {
      const dE = (M - (E - e * Math.sin(E))) / (1 - e * Math.cos(E));
      E += dE; if (Math.abs(dE) < 1e-12) break;
    }
    const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
    const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(Om), sO = Math.sin(Om), cI = Math.cos(I), sI = Math.sin(I);
    let X = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
    let Y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
    const Z = (sw * sI) * xp + (cw * sI) * yp;
    const dl = perturb(name, jd) * D2R;
    if (dl) { const c = Math.cos(dl), s = Math.sin(dl); [X, Y] = [X * c - Y * s, X * s + Y * c]; }
    return { x: X, y: Y, z: Z, a, e };
  }
  const lonOf = p => norm360(Math.atan2(p.y, p.x) * R2D);
  const latOf = p => Math.atan2(p.z, Math.hypot(p.x, p.y)) * R2D;
  // Sidereal period in days from the mean-longitude rate.
  const period = name => 36525 * 360 / EL[name][1][3];

  // Geocentric ecliptic longitude/latitude (J2000 frame) of a planet, or the Sun.
  function geo(name, jd, earth) {
    const E = earth || helio('earth', jd);
    if (name === 'sun') return { lon: lonOf({ x: -E.x, y: -E.y }), lat: 0, d: Math.hypot(E.x, E.y, E.z) };
    const P = helio(name, jd), g = { x: P.x - E.x, y: P.y - E.y, z: P.z - E.z };
    return { lon: lonOf(g), lat: latOf(g), d: Math.hypot(g.x, g.y, g.z) };

    const T = (jd - 2451545.0) / 36525;

      + 0.214 * Math.sin(2 * Mp) - 0.186 * Math.sin(M) - 0.114 * Math.sin(2 * F)
      - 0.059 * Math.sin(2 * D - 2 * Mp) - 0.057 * Math.sin(2 * D - M - Mp) + 0.053 * Math.sin(2 * D + Mp);

  // oppositions of Mars and transits of Mercury and Venus. Planet scan is daily with linear refinement.
  const TITLE = { mercury: 'Mercury', venus: 'Venus', mars: 'Mars', jupiter: 'Jupiter', saturn: 'Saturn' };

  const cap = s => s[0].toUpperCase() + s.slice(1);
  function separation(a, b) {
    const b1 = a.lat * D2R, b2 = b.lat * D2R, dl = (a.lon - b.lon) * D2R;

  }
  function yearEvents(y) {
    const jd0 = toJD(y, 1, 1), jd1 = toJD(y + 1, 1, 1), out = [];
    for (let k = Math.floor((jd0 - 2451550.09766) / 29.530588861) - 1; 2451550.09766 + 29.530588861 * k < jd1 + 2; k += 0.5) {

      const pri = e.type === 'solar'
        ? { total: 4, annular: 3, hybrid: 4, partial: 2 }[e.kind]

  // run the ray out to the inner edge of the calendar ring
  const dx = Math.cos(ang), dy = Math.sin(ang), ox = x0 - cx, oy = y0 - cy, rr = R * 0.8;
  const b = ox * dx + oy * dy, t = -b + Math.sqrt(Math.max(0, b * b - (ox * ox + oy * oy - rr * rr)));
  const x1 = x0 + dx * t, y1 = y0 + dy * t;
  c.save();
  c.lineCap = 'round';
  c.strokeStyle = `rgba(246,214,130,${0.12 * a})`; c.lineWidth = R * 0.02;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = `rgba(255,232,168,${0.75 * a})`; c.lineWidth = Math.max(1, R * 0.0025);
  c.setLineDash([R * 0.012, R * 0.008]);
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.setLineDash([]);
  c.restore();
  S.glow = { ids: ev.bodies, a };
}

const crankUnit = () => S.rate;
const tickUnit = () => S.rate / 3; // three ticks of the escapement for each second of running

// ---------- sound: escapement and the music of the spheres ----------
let AC = null, master = null, verb = null, noiseBuf = null, soundOn = false;
function initAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
  verb = AC.createConvolver();
  const len = Math.floor(AC.sampleRate * 2.4), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  verb.buffer = ir;
  const vg = AC.createGain(); vg.gain.value = 0.22; verb.connect(vg); vg.connect(master);
  noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.04), AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 6);
  return true;
}
// Period to pitch: 0.36 of the period ratio's octaves, folded onto a major pentatonic scale; the Earth sounds C5.
const SCALE = [0, 2, 4, 7, 9, 12];
function noteOf(period) {
  const n = Math.round(-12 * 0.36 * Math.log2(period / A.period('earth'))), o = Math.floor(n / 12), deg = n - o * 12;
  const snapped = SCALE.reduce((b, v) => Math.abs(v - deg) < Math.abs(b - deg) ? v : b, 0);
  return 523.25 * Math.pow(2, (o * 12 + snapped) / 12);
}
PLANETS.forEach(p => { p.freq = noteOf(p.period); p.sector = null; p.lastNote = 0; });
function bell(freq, vol, when) {
  if (!soundOn || !AC) return;
  const t = when || AC.currentTime + 0.01, dur = 1.4 + Math.max(0, Math.log2(523 / freq)) * 0.7;
  const out = AC.createGain(); out.gain.value = vol; out.connect(master); out.connect(verb);
  [[1, 1, 1], [2, 0.32, 0.55], [3.01, 0.16, 0.35], [4.2, 0.07, 0.2]].forEach(([r, a, k]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq * r;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * k);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur * k + 0.05);
  });
}
let tockNext = false, lastTick = 0;
function tick() {
  if (!soundOn || !AC) return;
  const t = AC.currentTime + 0.005, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = tockNext ? 1750 : 2500; f.Q.value = 7;
  g.gain.value = 0.55; src.connect(f); f.connect(g); g.connect(master); src.start(t);
  const o = AC.createOscillator(), og = AC.createGain();
  o.frequency.value = tockNext ? 3100 : 4100;
  og.gain.setValueAtTime(0.05, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.04);
  tockNext = !tockNext;
}
function chime(ev) {
  if (!soundOn || !AC) return;
  let t = AC.currentTime + 0.02;
  ev.bodies.forEach(id => {
    const p = PLANETS.find(q => q.id === id);
    const f = p ? p.freq : id === 'moon' ? 1046.5 : 261.63;
    bell(f, 0.16, t); t += 0.11;
  });
}
let speed = 0;
function sound(j0, j1, dt, now) {
  if (!soundOn || !AC || j0 === j1) return;
  speed = speed * 0.8 + Math.abs(j1 - j0) / Math.max(dt, 1e-3) * 0.2;
  const u = tickUnit();
  if (Math.floor(j0 / u) !== Math.floor(j1 / u) && now - lastTick > 45) { lastTick = now; tick(); }
  if (S.sweep) return;
  PLANETS.forEach(p => {
    const orbitsPerSec = speed / p.period;
    const n = [12, 6, 4, 2, 1].find(k => k * orbitsPerSec <= 2.2) || 1;
    const sec = Math.floor(S.pos[p.id].lon / (360 / n)) + n * 1000;
    if (p.sector !== null && p.sectorN === n && sec !== p.sector && now - p.lastNote > 160) {
      p.lastNote = now; bell(p.freq, 0.1 + 0.05 * (p.idx / 7));
    }
    p.sector = sec; p.sectorN = n;
  });
}
function setSound(on) {
  if (on && !AC && !initAudio()) return;
  soundOn = on;
  const b = qs('#sound'); b.textContent = on ? 'Sound on' : 'Sound off'; b.setAttribute('aria-pressed', String(on));
  if (!AC) return;
  if (on) AC.resume();
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(on ? 0.8 : 0, AC.currentTime, 0.05);
} // one turn of the crank moves the machine as far as a second of running
function advance(dj) {
  const before = S.jd;
  S.jd = clampJD(S.jd + dj);
  S.crank += (S.jd - before) / crankUnit() * TAU;
}
function sweepTo(jd) {
  jd = clampJD(jd);
  S.vel = 0;
  if (reduceMotion) { advance(jd - S.jd); return; }
  const d = Math.abs(jd - S.jd);
  S.sweep = { from: S.jd, to: jd, t0: performance.now(), dur: Math.min(2600, 700 + Math.log10(1 + d / 20) * 520) };
}

// ---------- UI ----------
const yearStr = y => y > 0 ? String(y) : `${1 - y} BC`;
function dateStr(jd) { const d = A.fromJD(jd); return `${d.d} ${MONTHS[d.m - 1]} ${yearStr(d.y)}`; }
const PHASES = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full', 'waning gibbous', 'last quarter', 'waning crescent'];
function moonPhase(P) {
  const e = A.norm360(P.moon.lon - P.sunLon);
  return PHASES[Math.round(e / 45) % 8];
}
let lastDateText = '', lastUI = 0;
function updateUI(now) {
  if (wallpaper || now - lastUI < 90) return;
  lastUI = now;
  const t = dateStr(S.jd);
  if (t !== lastDateText) {
    lastDateText = t;
    qs('#date').textContent = t;
    const wd = DAYS[((Math.floor(S.jd + 1.5) % 7) + 7) % 7];
    qs('#sub').textContent = `${wd}, ${moonPhase(S.pos)} Moon`;
    const inp = qs('#when');
    if (document.activeElement !== inp) {
      const d = A.fromJD(S.jd);
      inp.value = d.y >= 1 && d.y <= 3000 ? `${String(d.y).padStart(4, '0')}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}` : '';
    }
  }
  if (S.selected) fillCard();
}
function fillCard() {
  const id = S.selected, P = S.pos;
  const name = qs('#cardName'), dist = qs('#cardDist'), per = qs('#cardPeriod'), train = qs('#cardTrain');
  if (id === 'sun') {
    name.textContent = 'The Sun';
    dist.textContent = `The Earth is ${P.earth.r.toFixed(3)} AU away today.`;
    per.textContent = 'Fixed on the central arbor; every arm turns about it.';
    train.textContent = '';
  } else if (id === 'moon') {
    const age = A.norm360(P.moon.lon - P.sunLon) / 360 * 29.530589;
    name.textContent = 'The Moon';
    dist.textContent = `About ${P.earth.r.toFixed(3)} AU from the Sun, with the Earth.`;
    per.textContent = 'Goes round the Earth in 27.32 days; new to new in 29.53.';
    train.textContent = `${age.toFixed(1)} days since new Moon.`;
  } else {
    const p = PLANETS.find(q => q.id === id), yrs = p.period / 365.25;
    name.textContent = p.name;
    dist.textContent = `${P[id].r.toFixed(P[id].r < 2 ? 3 : 2)} AU from the Sun`;
    per.textContent = yrs < 2.5 ? `Orbit of ${p.period.toFixed(p.period < 400 ? 1 : 0)} days (${yrs.toFixed(2)} years)` : `Orbit of ${yrs.toFixed(2)} years`;
    train.textContent = p.train || '';
  }
}
function select(id) {
  S.selected = id;
  const card = qs('#card');
  if (!id) { card.hidden = true; return; }
  card.hidden = false; fillCard();
}

// ---------- input ----------
const toCanvas = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function touched() { S.lastInput = performance.now(); const h = qs('#hint'); if (h) h.classList.add('gone'); }
canvas.addEventListener('pointerdown', e => {
  if (wallpaper) return;
  touched();
  const [x, y] = toCanvas(e);
  const k = S.crankAt;
  const nearCrank = k && (Math.hypot(x - k.kx, y - k.ky) < R * 0.07 || Math.hypot(x - k.px, y - k.py) < R * 0.11);
  const pivot = nearCrank ? [k.px, k.py] : [cx, cy];
  S.drag = { id: e.pointerId, x0: x, y0: y, moved: false, crank: nearCrank, pivot, ang: Math.atan2(y - pivot[1], x - pivot[0]), t: performance.now(), v: 0 };
  S.vel = 0; S.sweep = null;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const d = S.drag; if (!d || d.id !== e.pointerId) return;
  const [x, y] = toCanvas(e);
  if (!d.moved && Math.hypot(x - d.x0, y - d.y0) < 5) return;
  if (!d.moved) { d.moved = true; canvas.classList.add('dragging'); }
  const ang = Math.atan2(y - d.pivot[1], x - d.pivot[0]);
  let da = ang - d.ang; if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU;
  d.ang = ang;
  // crank: clockwise winds forward; field: carry the Earth anticlockwise to go forward
  const dj = d.crank ? da / TAU * crankUnit() : -da / TAU * A.period('earth');
  advance(dj);
  const now = performance.now(), dt = Math.max(1, now - d.t) / 1000;
  d.v = d.v * 0.6 + (dj / dt) * 0.4; d.t = now;
  touched();
});
function endDrag(e) {
  const d = S.drag; if (!d || d.id !== e.pointerId) return;
  S.drag = null; canvas.classList.remove('dragging');
  if (!d.moved) { pick(d.x0, d.y0); return; }
  if (!reduceMotion && performance.now() - d.t < 90) S.vel = d.v;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
function pick(x, y) {
  let best = null, bd = Infinity;
  (S.hits || []).forEach(h => { const dd = Math.hypot(x - h.x, y - h.y); if (dd < h.r && dd < bd) { bd = dd; best = h.id; } });
  select(best);
}
canvas.addEventListener('keydown', e => {
  touched();
  const step = crankUnit() / 8;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { advance(step); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { advance(-step); e.preventDefault(); }
  else if (e.key === 'PageUp') { advance(crankUnit() * 2); e.preventDefault(); }
  else if (e.key === 'PageDown') { advance(-crankUnit() * 2); e.preventDefault(); }
  else if (e.key === ' ') { setPlaying(!S.playing); e.preventDefault(); }
  else if (/^[1-8]$/.test(e.key)) select(PLANETS[+e.key - 1].id);
});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
qs('#cardClose').addEventListener('click', () => { select(null); canvas.focus(); });
function setPlaying(on) { S.playing = on; qs('#play').textContent = on ? 'Pause' : 'Run'; touched(); }
qs('#play').addEventListener('click', () => setPlaying(!S.playing));
qs('#sound').addEventListener('click', () => { touched(); setSound(!soundOn); });
const rateSel = qs('#rate');
rateSel.value = String(S.rate);
rateSel.addEventListener('change', () => { S.rate = +rateSel.value; touched(); });
for (const [id, dir] of [['#prev', -1], ['#next', 1]]) qs(id).addEventListener('click', () => {
  touched();
  const ev = findEvent(dir); if (!ev) return;
  setPlaying(false);
  sweepTo(ev.jd);
  if (S.sweep) S.sweep.ev = ev; else announce(ev);
});
qs('#today').addEventListener('click', () => { touched(); sweepTo(A.fromDate(new Date())); });
qs('#when').addEventListener('change', e => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value); if (!m) return;
  touched(); sweepTo(A.toJD(+m[1], +m[2], +m[3]) + 0.5);
});

// ---------- loop ----------
let last = performance.now(), lastPaint = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (wallpaper && now - lastPaint < 32) return;
  lastPaint = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const jdBefore = S.jd;
  if (S.sweep) {
    const k = Math.min(1, (now - S.sweep.t0) / S.sweep.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    advance(S.sweep.from + (S.sweep.to - S.sweep.from) * e - S.jd);
    if (k >= 1) { if (S.sweep.ev) announce(S.sweep.ev); S.sweep = null; }
  } else if (!S.drag) {
    if (S.vel) { advance(S.vel * dt); S.vel *= Math.exp(-dt * 1.4); if (Math.abs(S.vel) < S.rate * 0.05) S.vel = 0; }
    else if (S.playing) advance(S.rate * dt);
    else if (now - S.lastInput > 45000) setPlaying(true);
  }
  if (!S.sweep) watchEvents(jdBefore, S.jd);
  sound(jdBefore, S.jd, dt, now);
  if (wallpaper && now - S.wallStart > 600000) { S.wallStart = now; sweepTo(A.fromDate(new Date())); }
  draw();
  updateUI(now);
}

function setMode() {
  wallpaper = location.hash === '#wallpaper';
  document.body.classList.toggle('wallpaper', wallpaper);
  if (wallpaper) { S.rate = 2; S.playing = true; S.wallStart = performance.now(); select(null); if (soundOn) setSound(false); }
  else { S.rate = +rateSel.value; }
  layout();
}
addEventListener('hashchange', setMode);
addEventListener('resize', layout);
setMode();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load("20px 'IM Fell English'"), document.fonts.load("20px 'EB Garamond'")]).then(() => buildStatic()).catch(() => {});
}
requestAnimationFrame(frame);
})();
</script>
