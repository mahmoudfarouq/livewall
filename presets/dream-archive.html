<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream Archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{
  --sky-top:#8db7d3; --sky-low:#f1d6cd; --ground:#e3c38f; --ground-2:#cf9f63; --night-ground:#2b3346;
  --ink-a:#2c55b0; --ink-b:#e6548b; --ink-c:#f1b032; --ink-d:#13887a; --shade:#3a2d5c;
  --text:#1c2340; --text-soft:#4b506b; --panel:rgba(247,244,242,.8); --line:rgba(28,35,64,.16);
  --focus:#e6548b; --map-bg:#e6ecee; --map-bg-2:#d5e0e6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0c2525; --sky-low:#2f5a4b; --ground:#3d2b1d; --ground-2:#251911; --night-ground:#120e0c;
    --ink-a:#86a7ff; --ink-b:#ff8cb2; --ink-c:#ffcf68; --ink-d:#5ed2be; --shade:#020808;
    --text:#e8f1ec; --text-soft:#a7bcb4; --panel:rgba(9,25,25,.74); --line:rgba(232,241,236,.18);
    --focus:#ffcf68; --map-bg:#0a1b1c; --map-bg-2:#14302d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#0c2525; --sky-low:#2f5a4b; --ground:#3d2b1d; --ground-2:#251911; --night-ground:#120e0c;
  --ink-a:#86a7ff; --ink-b:#ff8cb2; --ink-c:#ffcf68; --ink-d:#5ed2be; --shade:#020808;
  --text:#e8f1ec; --text-soft:#a7bcb4; --panel:rgba(9,25,25,.74); --line:rgba(232,241,236,.18);
  --focus:#ffcf68; --map-bg:#0a1b1c; --map-bg-2:#14302d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky-low);color:var(--text);
  font:15px/1.45 Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:2}
button,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.45em 1em;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:hover{border-color:var(--text-soft)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.bar{top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}
.bar>*{pointer-events:auto}
h1{margin:0;font:italic 400 26px/1 "Instrument Serif",Georgia,serif;letter-spacing:.01em}
.tools{display:flex;gap:8px}
#caption{left:max(16px,env(safe-area-inset-left));bottom:calc(112px + env(safe-area-inset-bottom));margin:0;max-width:min(560px,calc(100vw - 32px));
  pointer-events:none;transition:opacity .8s}
#caption blockquote{margin:0;font:italic 400 clamp(21px,3.2vw,30px)/1.15 "Instrument Serif",Georgia,serif;
  text-shadow:0 0 18px var(--sky-low),0 0 4px var(--sky-low)}
#caption figcaption{margin-top:8px;font-size:13px;color:var(--text-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#caption figcaption button{pointer-events:auto;font-size:13px;padding:.25em .8em}
#dream-form{left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#dream-form .box{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dream-form label{display:block;font-size:13px;color:var(--text-soft);margin-bottom:2px}

  padding:4px 0;height:2.1em;max-height:5.4em}
#dream-input:focus-visible{outline:none}
#dream-form .box:focus-within{border-color:var(--focus)}
#dream-form button[type=submit]{background:var(--text);color:var(--sky-low);border-color:transparent;font-weight:500}
#caption.off{opacity:0}

  max-height:calc(100vh - 250px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dream-list h2{margin:0 0 2px;font:italic 400 21px/1.1 "Instrument Serif",Georgia,serif}
#dream-list p{margin:0 0 8px;font-size:13px;color:var(--text-soft)}

  font:italic 400 17px/1.2 "Instrument Serif",Georgia,serif;-webkit-backdrop-filter:none;backdrop-filter:none}
#dream-list li button:hover,#dream-list li button[aria-current=true]{border-color:var(--line);background:var(--panel)}
#dream-list li small{display:block;font:400 12px/1.3 Figtree,system-ui,sans-serif;color:var(--text-soft);margin-top:2px}
.wall .ui{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
  h1{font-size:22px}
  #caption{bottom:calc(128px + env(safe-area-inset-bottom))}
  #caption blockquote{font-size:20px}
  #dream-list{left:16px;right:16px;width:auto;max-height:34vh}
  .tools button{font-size:14px;padding:.4em .75em}
  .bar{gap:8px}
}
</style>

<canvas id="scene" role="img" aria-label="A drifting dream scene drawn from the words of a dream"></canvas>

<header class="ui bar">
  <h1>Dream Archive</h1>
  <div class="tools"><button type="button" id="map-btn" aria-pressed="false">Map of sleep</button><button type="button" id="sound-btn" aria-pressed="false">Sound off</button></div>
</header>

<figure class="ui" id="caption">
  <blockquote id="cap-text"></blockquote>
  <figcaption><span id="cap-note"></span><button type="button" id="forget-btn" hidden>Forget this dream</button></figcaption>
</figure>

<nav class="ui" id="dream-list" aria-label="Your dreams" hidden>
  <h2>Your dreams</h2>
  <p>Drag to wander, pinch or scroll to zoom. Dreams that share a symbol are threaded together.</p>
  <ol id="dream-ol"></ol>
</nav>

<form class="ui" id="dream-form" autocomplete="off">
  <div class="box">
    <label for="dream-input">Write down a dream</label>
    <div class="row">
      <textarea id="dream-input" name="dream" rows="1" maxlength="400" enterkeyhint="done"
        placeholder="I was late for a train that ran across the sea"></textarea>
      <button type="submit">Keep it</button>
    </div>
  </div>
</form>
<p id="live" class="sr" aria-live="polite"></p>

<script>
(() => {
'use strict';

/*LEXICON-START*/
const DreamLex = (() => {
  // motif -> words that summon it
  const MOTIF_WORDS = {
    water:'water waters wet liquid pool puddle lake lakes river rivers stream flood flooded flooding aquarium bath bathtub fountain pond well drip dripping rainwater waterfall',
    sea:'sea seas ocean oceans beach beaches shore wave waves tide coast harbour harbor bay surf seaside pier',
    desert:'desert deserts sand sands dune dunes',
    road:'road roads path paths highway street streets lane journey',
    stairs:'stairs stair staircase staircases stairway steps step escalator',
    ladder:'ladder ladders rope ropes',
    teeth:'tooth teeth molar dentist gum gums mouth jaw bite biting',
    door:'door doors doorway gate gates entrance exit portal threshold elevator lift',
    window:'window windows glass curtain curtains balcony',
    house:'house houses home cottage apartment flat room rooms attic basement kitchen bedroom hallway corridor hotel cabin hut childhood',
    school:'school schools classroom class teacher teachers lesson homework university college campus student students principal',
    tower:'tower towers city cities building buildings skyscraper church castle palace lighthouse office hospital',
    arcade:'square plaza arcade arches columns ruins museum temple courtyard',
    train:'train trains railway rail tracks platform subway metro tram carriage station locomotive',
    car:'car cars bus taxi truck vehicle bicycle bike driver',
    bridge:'bridge bridges',
    boat:'boat boats ship ships sail sailing ferry canoe raft yacht',
    plane:'plane planes airplane aeroplane airport flight jet rocket',
    bird:'bird birds crow crows raven ravens dove pigeon owl seagull gull eagle swan wings wing feather feathers parrot',
    fish:'fish fishes whale whales shark sharks dolphin octopus jellyfish',
    cat:'cat cats kitten tiger lion',
    dog:'dog dogs puppy wolf wolves fox',
    horse:'horse horses pony deer cow cows animal animals goat sheep elephant zebra',
    snake:'snake snakes serpent worm worms eel',
    insect:'butterfly butterflies moth moths bee bees insect insects spider spiders ant ants beetle',
    figure:'man woman person people stranger strangers someone somebody boy girl friend friends crowd husband wife boyfriend girlfriend brother sister grandmother grandfather grandma grandpa boss neighbour neighbor doctor police soldier king queen celebrity',
    mother:'mother mom mum mama mommy',
    father:'father dad daddy papa',
    child:'child children baby babies kid kids son daughter infant',
    clock:'clock clocks time hour hours minute minutes watch alarm deadline hurry early',
    moon:'moon moons moonlight',
    sun:'sun sunlight sunset sunrise morning noon dawn',
    star:'star stars galaxy space planet planets universe constellation',
    cloud:'cloud clouds fog mist sky skies heaven',
    rain:'rain raining rained storm storms umbrella drizzle thunder lightning',
    snow:'snow snowing winter ice frozen',
    tree:'tree trees forest forests woods wood garden park jungle leaf branch branches orchard',
    flower:'flower flowers rose roses lily tulip bloom blooming petals',
    mountain:'mountain mountains hill hills cliff cliffs volcano',
    eye:'eye eyes stare staring watched watching face faces blind',
    hand:'hand hands finger fingers fingernail nails arm arms glove gloves',
    key:'key keys lock locked unlock keyhole',
    piano:'piano pianos music song songs violin guitar orchestra concert melody',
    fire:'fire fires flame flames burning burn candle candles smoke ash',
    mirror:'mirror mirrors reflection reflections twin twins double',
    egg:'egg eggs nest',
    apple:'apple apples fruit pear pears',
    balloon:'balloon balloons party',
    book:'book books letter letters paper papers page pages diary notebook library',
    phone:'phone phones telephone call calling cellphone',
    bed:'bed beds pillow blanket sleep sleeping',
    chair:'chair chairs table tables sofa couch furniture',
    hat:'hat hats bowler coat suit',
    numbers:'number numbers count counting math numerals',
    ghost:'ghost ghosts death dead dying skull grave funeral bones coffin',
    money:'money coin coins treasure wallet cash',
  };
  const MULTI = { exam:['book','clock'], exams:['book','clock'], test:['book','clock'], late:['clock'], lost:['road'], night:['moon'], midnight:['moon','clock'] };
  const BIGRAMS = { 'piano key':'piano', 'grand piano':'piano', 'swimming pool':'water', 'train station':'train', 'high school':'school',
    'full moon':'moon', 'living room':'house', 'roller coaster':'train', 'fire escape':'stairs', 'bus stop':'car', 'new york':'tower' };
  const ENV = new Set(['sea','desert','road']);
  const VERBS = {
    rise:'fly flying flew flown float floating levitate levitating rise rising climb climbing climbed hover hovering soar soaring ascend lift lifted',
    fall:'fall falling fell fallen drop dropping dropped tumble tumbling slip slipped collapse collapsing crash crashed',
    sink:'sink sinking sank drown drowning drowned dive diving submerged',
    run:'run running ran chase chasing chased escape escaping flee fleeing fled hurry hurrying race racing drive driving drove ride riding rode crossed crossing',
    walk:'walk walking walked wander wandering wandered follow following followed',
    swim:'swim swimming swam',
    spin:'spin spinning spun dance dancing danced swirl swirling twist twisting rotate',
    grow:'grow growing grew grown expand expanding stretch stretching swell',
    shrink:'shrink shrinking shrank',
    melt:'melt melting melted dissolve dissolving',
    hide:'hide hiding hid disappear disappeared disappearing vanish vanished fade fading forget forgot invisible',
    pulse:'count counting counted sing singing sang play playing played breathe breathing',
  };
  const SIZES = { giant:2.1, gigantic:2.2, huge:2, enormous:2.2, massive:2, vast:2, tall:1.8, endless:2.2, immense:2.1, colossal:2.3, big:1.6, large:1.6, towering:2,
    tiny:.45, small:.6, little:.6, miniature:.4, minuscule:.35, short:.7 };
  const COLOURS = { red:'red', crimson:'red', scarlet:'red', orange:'orange', amber:'orange', yellow:'yellow', golden:'gold', gold:'gold',
    green:'green', emerald:'green', blue:'blue', azure:'blue', turquoise:'blue', navy:'blue', purple:'purple', violet:'purple', lilac:'purple', lavender:'purple',
    pink:'pink', white:'white', pale:'white', black:'black', grey:'grey', gray:'grey', silver:'grey', brown:'brown' };
  const NIGHT = new Set('night midnight dark darkness evening nighttime moonlight'.split(' '));
  const MORPH = new Set('into became become becomes becoming turned turn turns turning transformed changed like instead'.split(' '));
  const NUMWORDS = { zero:0, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, twenty:20, hundred:100, thousand:1000, million:1000000 };
  const MOOD = {};
  'late afraid scared fear terrified panic anxious nervous lost trapped stuck chase chased chasing scream screaming cry crying dead death die dying blood hurt pain fall falling fell drown drowning drowned exam test fail failed missing alone dark darkness nightmare monster attack attacked kill broken naked embarrassed sick hospital funeral angry shout shouting lonely cold empty storm crash crashed teeth ghost grave wrong forgot sinking cage lock locked'
    .split(' ').forEach(w => MOOD[w] = -1);
  'happy joy laugh laughing love loved kiss warm light bright sunny beautiful calm peaceful free freedom fly flying flew float floating dance dancing sing singing music friend friends safe garden flower flowers golden gentle soft wonderful hug together wedding party celebrate sun sunlight sweet gift glowing'
    .split(' ').forEach(w => MOOD[w] = (MOOD[w] || 0) + 1);
  const STOP = new Set(('a an the i me my mine we us our you your he him his she her it its they them their this that these those there here ' +
    'is was were be been being am are do did does done have had has having will would could should can may might must shall ' +
    'and or but so then than if when while because as of at in on to for from by with without about over under up down out off ' +
    'through across behind before after again back just very really still also even only not no yes all any some every each much many more most ' +
    'kept keep keeps knew know think thought felt feel feeling seemed seem looked look looking saw see seen went go going gone came come coming ' +
    'got get getting made make making said say says told tell asked ask tried try wanted want needed need stood stand began begin ' +
    'what which who whom whose where why how something nothing anything everything someone everyone nobody one ones own other another ' +
    'into onto upon around near far inside outside between toward towards along beside beyond above below within until though although ' +
    'like same different whole again myself yourself himself herself itself ourselves themselves dream dreamt dreamed dreaming suddenly ' +
    'then later once twice almost always never ever maybe kind sort thing things way lot bit too oh yeah okay ok').split(' '));
  const IRREG = { flew:'fly', flown:'fly', fell:'fall', fallen:'fall', ran:'run', swam:'swim', sank:'sink', grew:'grow', grown:'grow', shrank:'shrink',
    drove:'drive', rode:'ride', hid:'hide', forgot:'forget', teeth:'tooth', mice:'mouse', children:'child', men:'man', women:'woman', feet:'foot',
    spun:'spin', sang:'sing', leaves:'leaf', wolves:'wolf', fled:'flee', knives:'knife' };

  const LEX = Object.create(null), VERB = Object.create(null);
  for (const m in MOTIF_WORDS) for (const w of MOTIF_WORDS[m].split(' ')) (LEX[w] = LEX[w] || []).includes(m) || LEX[w].push(m);
  for (const w in MULTI) LEX[w] = MULTI[w].slice();
  for (const b in VERBS) for (const w of VERBS[b].split(' ')) VERB[w] = b;

  const known = w => w in LEX || w in VERB || w in SIZES || w in COLOURS || w in NUMWORDS || NIGHT.has(w);
  function forms(w) {
    const f = [w];
    if (IRREG[w]) f.push(IRREG[w]);
    if (w.length > 3) {
      f.push(w.replace(/ies$/, 'y'), w.replace(/es$/, ''), w.replace(/s$/, ''), w.replace(/ing$/, ''), w.replace(/ing$/, 'e'),
        w.replace(/([a-z])\1ing$/, '$1'), w.replace(/ied$/, 'y'), w.replace(/ed$/, ''), w.replace(/ed$/, 'e'), w.replace(/([a-z])\1ed$/, '$1'), w.replace(/ly$/, ''));
    }
    return f;
  }
  function base(w) { for (const f of forms(w)) if (known(f)) return f; return w; }
  function tokenize(text) { return (String(text).toLowerCase().replace(/[’‘]/g, "'").match(/[a-z]+(?:'[a-z]+)?|\d+|[.;!?]/g) || []); }

  function parse(text) {
    const toks = tokenize(text);
    const res = { objects: [], unknown: [], motifs: [], colours: [], mood: 0, night: false, ground: 'plaza', road: false, numbers: [] };
    const byMotif = {};
    let pend = { colour: null, size: 1, behav: null }, morphFrom = null, last = null, clauseI = false, dreamer = null;
    let moodSum = 0, moodN = 0;
    const seenUnknown = new Set();
    const addMotif = (m, word) => {
      if (!res.motifs.includes(m)) res.motifs.push(m);
      if (ENV.has(m)) { if (m === 'sea') res.ground = 'sea'; else if (m === 'desert' && res.ground !== 'sea') res.ground = 'sand'; else if (m === 'road') res.road = true; return null; }
      if (morphFrom && !morphFrom.morphTo && morphFrom.motif !== m) { morphFrom.morphTo = m; morphFrom.morphWord = word; const o = morphFrom; morphFrom = null; pend = { colour: null, size: 1, behav: null }; return o; }
      if (byMotif[m]) { byMotif[m].weight++; return byMotif[m]; }
      const o = { motif: m, word, colour: pend.colour, size: pend.size, behav: pend.behav, weight: 1 };
      pend = { colour: null, size: 1, behav: null };
      byMotif[m] = o; res.objects.push(o); return o;
    };
    for (let i = 0; i < toks.length; i++) {
      const raw = toks[i];
      if (/^[.;!?]$/.test(raw)) { last = null; clauseI = false; morphFrom = null; continue; }
      if (raw === 'but' || raw === 'then') { last = null; clauseI = false; continue; }
      if (raw === 'i' || raw === 'we' || raw === "i'm" || raw === "we're" || raw === 'myself') { clauseI = true; continue; }
      if (/^\d+$/.test(raw) || raw in NUMWORDS) {
        const label = /^\d+$/.test(raw) ? raw.slice(0, 4) : String(NUMWORDS[raw]);
        res.numbers.push(label);
        const o = addMotif('numbers', raw); if (o && o.motif === 'numbers' && !o.label) o.label = label; if (o) last = o;
        continue;
      }
      // bigram
      if (i + 1 < toks.length) {
        const b1 = raw + ' ' + toks[i + 1], b2 = base(raw) + ' ' + base(toks[i + 1]);
        const bm = BIGRAMS[b1] || BIGRAMS[b2] || BIGRAMS[raw + ' ' + toks[i + 1].replace(/e?s$/, '')];
        if (bm) { const o = addMotif(bm, b1); if (o) last = o; i++; continue; }
      }
      const w = base(raw);
      const mood = MOOD[raw] !== undefined ? MOOD[raw] : MOOD[w];
      if (mood) { moodSum += mood; moodN++; }
      if (NIGHT.has(raw) || NIGHT.has(w)) res.night = true;
      if (raw === 'made' && toks[i + 1] === 'of') { if (last) morphFrom = last; i++; continue; }
      if (MORPH.has(raw)) { if (last && !morphFrom) morphFrom = last; continue; }
      if (STOP.has(raw)) continue;
      let used = false;
      if (COLOURS[w]) { pend.colour = COLOURS[w]; if (!res.colours.includes(COLOURS[w])) res.colours.push(COLOURS[w]); used = true; }
      if (SIZES[w]) { pend.size = SIZES[w]; used = true; }
      if (VERB[w]) {
        const b = VERB[w];
        if (last) last.behav = b;
        else if (clauseI && !dreamer) { dreamer = { motif: 'figure', word: 'me', dreamer: true, colour: null, size: 1, behav: b, weight: 1 }; res.objects.push(dreamer); last = dreamer; }
        else if (clauseI && dreamer) { dreamer.behav = b; last = dreamer; }
        else pend.behav = b;
        used = true;
      }
      const ms = LEX[w];
      if (ms) {
        for (const m of ms) { const o = addMotif(m, raw); if (o) last = o; }
        if (!res.motifs.includes('figure') && dreamer) res.motifs.push('figure');
        used = true;
      }
      if (!used && raw.length >= 3 && !NIGHT.has(raw) && !seenUnknown.has(raw)) { seenUnknown.add(raw); res.unknown.push(raw.replace(/'s$/, '')); }
    }
    if (dreamer && !res.motifs.includes('figure')) res.motifs.push('figure');
    if (res.motifs.includes('moon') || res.motifs.includes('star')) res.night = true;
    if (res.ground === 'plaza') {
      if (res.motifs.includes('snow')) res.ground = 'snow';
      else if (res.motifs.includes('tree') || res.motifs.includes('flower')) res.ground = 'grass';
    }
    res.mood = Math.max(-1, Math.min(1, moodSum / Math.sqrt(moodN + 1)));
    return res;
  }
  const size = () => Object.keys(LEX).length + Object.keys(VERB).length + Object.keys(SIZES).length + Object.keys(COLOURS).length;
  return { parse, tokenize, base, MOTIFS: Object.keys(MOTIF_WORDS), lexiconSize: size };
})();
/*LEXICON-END*/

// ---------- utilities ----------
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

// ---------- tokens ----------
let T = {}, DARK = false;
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  ['sky-top','sky-low','ground','ground-2','night-ground','ink-a','ink-b','ink-c','ink-d','shade','text','map-bg','map-bg-2']
    .forEach(k => T[k] = cs.getPropertyValue('--' + k).trim());
  DARK = cs.colorScheme === 'dark' || cs.getPropertyValue('color-scheme').trim() === 'dark';
}
// riso-like spot inks for colour words
const RISO_LIGHT = { red:'#e2403a', orange:'#ff7433', yellow:'#ffcc2f', gold:'#d3a12c', green:'#2a9c58', blue:'#2c55b0', purple:'#77589f', pink:'#ef5f9c', white:'#cfd7de', black:'#2b2733', grey:'#949aa3', brown:'#8d5a3a' };
const RISO_DARK  = { red:'#ff6a5c', orange:'#ff9a5c', yellow:'#ffe066', gold:'#ecc35a', green:'#62d18c', blue:'#86a7ff', purple:'#b597ee', pink:'#ff8cb2', white:'#f4f1ea', black:'#4a4f5c', grey:'#b5bcc4', brown:'#c48a5e' };

// ---------- motif drawings (unit space: x,y in about [-1,1], base at y=1) ----------
const INKS = { water:'adc', sea:'adc', desert:'cbd', road:'adb', stairs:'bac', ladder:'dab', teeth:'cba', door:'abc', window:'dab', house:'bca', school:'acb',

  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const k = ease(fade), mk = ease(mapK);
  if (mk < 1) {
    if (prev) drawScene(c, prev, sceneT, 1);
    drawScene(c, cur, sceneT, prev ? k : 1);
    if (WALL) drawWallCaption(c, 1 - mk);
  }
  if (mk > 0) drawMap(c, sceneT, mk);
  tickSound();
  // grain
  if (!grainPat) grainPat = c.createPattern(grain, 'repeat');
  if (now - grainAt > 110 && !reduced.matches) { grainAt = now; grainOff = [Math.random() * 160, Math.random() * 160]; }
  c.save(); c.translate(-grainOff[0], -grainOff[1]); c.globalCompositeOperation = DARK ? 'screen' : 'multiply'; c.globalAlpha = DARK ? .25 : .55;
  c.fillStyle = grainPat; c.fillRect(0, 0, W + 160, H + 160); c.restore();
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

// ---------- sound: soft generative pads, key set by the dream's mood ----------
const MODES = { lydian: [0, 2, 4, 6, 7, 9, 11], ionian: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10], phrygian: [0, 1, 3, 5, 7, 8, 10] };
const PROGS = [[0, 5, 3, 4], [0, 3, 5, 2], [0, 4, 5, 3], [0, 2, 5, 3]];
let AC = null, master = null, bus = null, soundOn = false, nextChord = 0, nextBell = 0, chordStep = 0, key = { root: 48, mode: MODES.dorian, prog: PROGS[0] };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function keyFor(d) {
  const mood = d.p.mood, h = hash(d.text);
  const mode = mood > .35 ? MODES.lydian : mood > .05 ? MODES.ionian : mood > -.25 ? MODES.dorian : mood > -.55 ? MODES.aeolian : MODES.phrygian;
  return { root: 45 + h % 8, mode, prog: PROGS[(h >>> 3) % PROGS.length] };
}
function initAudio() {
  const Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return false;
  AC = new Ctor();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  bus = AC.createBiquadFilter(); bus.type = 'lowpass'; bus.frequency.value = 1300; bus.Q.value = .5;
  const dry = AC.createGain(); dry.gain.value = .55; bus.connect(dry); dry.connect(master);
  const conv = AC.createConvolver(), wet = AC.createGain(); wet.gain.value = .7;
  const len = Math.floor(AC.sampleRate * 4), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const dd = ir.getChannelData(ch); for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
  conv.buffer = ir; bus.connect(conv); conv.connect(wet); wet.connect(master);
  return true;
}
function note(midi, t0, dur, gain, type, detune) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = mtof(midi); o.detune.value = detune || 0;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + dur * .35); g.gain.setValueAtTime(gain, t0 + dur * .55); g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + dur + .05);
}
const deg = (k, oct) => { const m = key.mode, n = m.length; return key.root + m[((k % n) + n) % n] + 12 * (Math.floor(k / n) + (oct || 0)); };
function playChord(t0) {
  const d = key.prog[chordStep++ % key.prog.length], dur = 11;
  [0, 2, 4, 6].forEach((s, i) => { const m = deg(d + s, 1); note(m, t0 + i * .25, dur, .045, 'triangle', -5); note(m, t0 + i * .25, dur, .02, 'sawtooth', 6); });
  note(deg(d, 0), t0, dur, .06, 'sine');
}
function playBell(t0) {
  const steps = [0, 1, 2, 4, 5], m = deg(steps[Math.floor(Math.random() * steps.length)] + 14, 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = mtof(m);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.035, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + 4);
  o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + 4.1);
}
function tickSound() {
  if (!soundOn || !AC) return;
  const now = AC.currentTime;
  if (now > nextChord - .2) { playChord(Math.max(now, nextChord)); nextChord = Math.max(now, nextChord) + 7.5; }
  if (now > nextBell) { playBell(now + .05); nextBell = now + 2.5 + Math.random() * 4.5; }
}
function setKeyFor(d) { const k = keyFor(d); if (k.root !== key.root || k.mode !== key.mode) { key = k; chordStep = 0; if (AC && soundOn) nextChord = Math.min(nextChord, AC.currentTime + 1.2); } }
const soundBtn = $('sound-btn');
function startSound() {
  if (WALL) return;
  if (!AC && !initAudio()) { soundBtn.disabled = true; soundBtn.textContent = 'No sound here'; return; }
  if (AC.state !== 'running') AC.resume();
  soundOn = true; setKeyFor(cur.d); nextChord = AC.currentTime + .1; nextBell = AC.currentTime + 2;
  master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(master.gain.value, AC.currentTime); master.gain.linearRampToValueAtTime(.8, AC.currentTime + 2.5);
  soundBtn.setAttribute('aria-pressed', 'true'); soundBtn.textContent = 'Sound on';
}
function stopSound() {
  soundOn = false;
  if (soundBtn) { soundBtn.setAttribute('aria-pressed', 'false'); soundBtn.textContent = 'Sound off'; }
  if (!AC) return;
  const t0 = AC.currentTime; master.gain.cancelScheduledValues(t0); master.gain.setValueAtTime(master.gain.value, t0); master.gain.linearRampToValueAtTime(0, t0 + 1.2);
  setTimeout(() => { if (!soundOn && AC.state === 'running') AC.suspend(); }, 1500);
}
soundBtn.addEventListener('click', () => soundOn ? stopSound() : startSound());
document.addEventListener('visibilitychange', () => { if (document.hidden && soundOn) stopSound(); });

function drawWallCaption(c, a) {
  const d = cur.d, fz = Math.round(clamp(M * .03, 18, 34)), x = Math.max(28, W * .04), y = H - Math.max(36, H * .07);
  c.font = `italic ${fz}px "Instrument Serif", Georgia, serif`; c.textBaseline = 'alphabetic';
  c.globalAlpha = a * .9 * (prev ? ease(fade) : 1); c.fillStyle = T.text;
  c.shadowColor = T['sky-low']; c.shadowBlur = 14; c.fillText(d.text, x, y); c.fillText(d.text, x, y); c.shadowBlur = 0; c.globalAlpha = 1;
}

// ---------- input ----------
const form = $('dream-form'), input = $('dream-input'), live = $('live');
function touch() { lastInput = performance.now(); lastSwitch = lastInput; if (journey && !WALL) journey = null; }
['pointerdown', 'keydown', 'wheel'].forEach(e => addEventListener(e, touch, { passive: true }));
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : submit(e); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });
form.addEventListener('submit', submit);
function submit(e) {
  e.preventDefault();
  const text = input.value.replace(/\s+/g, ' ').trim().slice(0, 400);
  if (!text) { input.focus(); return; }
  const d = prep({ id: 'd' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36), text, at: Date.now() });
  dreams.push(d); saveMine(); layoutArchive();
  if (mapOpen) setMap(false);
  openDream(dreams.length - 1);
  input.value = ''; input.style.height = '';
  const n = d.p.motifs.length, u = d.p.unknown.length;
  live.textContent = n ? `Kept. It holds ${n} symbol${n > 1 ? 's' : ''}${u ? ' and ' + u + ' loose word' + (u > 1 ? 's' : '') : ''}.` : 'Kept. Its words drift loose.';
  touch();
}
$('forget-btn').addEventListener('click', () => {
  const d = dreams[curIdx]; if (!d || d.example) return;
  dreams.splice(curIdx, 1); saveMine(); layoutArchive(); openDream(Math.max(0, curIdx - 1)); live.textContent = 'Forgotten.';
});

// ---------- boot ----------
function themeChanged() { readTokens(); glyphCache = {}; for (const s of [cur, prev]) if (s) resolveInks(s); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged);
addEventListener('resize', resize);
function applyHash() {
  WALL = location.hash === '#wallpaper';
  document.documentElement.classList.toggle('wall', WALL);
  IDLE_MS = WALL ? 0 : 26000; DWELL_MS = WALL ? 20000 : 22000;
  if (WALL && mapOpen) setMap(false);
  if (WALL && typeof stopSound === 'function') stopSound();
}
addEventListener('hashchange', applyHash);
readTokens(); resize(); rebuildArchive(); layoutArchive(); applyHash();
openDream(WALL ? Math.floor(Math.random() * dreams.length) : 0, true);
lastSwitch = performance.now() - (WALL ? 8000 : 0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cur) cur.bg = null; });
requestAnimationFrame(frame);
})();
</script>
